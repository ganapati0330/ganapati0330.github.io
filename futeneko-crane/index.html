<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{height:100%;overflow:hidden;background:#2a1250;font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Rounded Mplus 1c","Noto Sans JP",system-ui,sans-serif;color:#fff;touch-action:manipulation}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#hud{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:6px 8px;background:linear-gradient(#3d1d6e,#2a1250);border-bottom:2px solid #7a4fd0}
.chip{display:flex;align-items:center;gap:4px;background:rgba(0,0,0,.35);border-radius:999px;padding:4px 10px;font-weight:800;font-size:14px;white-space:nowrap}
.chip b{font-size:16px;color:#ffd75e}
#hudSp{flex:1}
.hbtn{border:none;background:#7a4fd0;color:#fff;font-weight:800;font-size:13px;border-radius:10px;min-width:40px;height:36px;padding:0 8px;white-space:nowrap;box-shadow:0 3px 0 #3d1d6e;font-family:inherit}
.hbtn:active{transform:translateY(2px);box-shadow:0 1px 0 #3d1d6e}
#stageWrap{flex:1 1 auto;position:relative;min-height:0;background:radial-gradient(circle at 50% 10%,#5a2fa0 0%,#2a1250 70%)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.bub{position:absolute;display:flex;align-items:flex-end;gap:4px;max-width:46%;opacity:0;transition:opacity .25s;pointer-events:none;z-index:5}
.bub.show{opacity:1}
.bub img{width:64px;height:64px;object-fit:contain;flex:0 0 auto;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}
.bub .txt{background:#fff;color:#222;border-radius:14px;padding:7px 10px;font-size:13px;font-weight:800;line-height:1.3;box-shadow:0 2px 6px rgba(0,0,0,.3);position:relative}
#bubL{left:6px;top:8px}
#bubR{right:6px;top:8px;flex-direction:row-reverse}
#bubR2{right:6px;bottom:8px;flex-direction:row-reverse}
#timerBar{position:absolute;left:12%;right:12%;top:0;height:6px;background:rgba(0,0,0,.4);border-radius:0 0 6px 6px;overflow:hidden;display:none}
#timerFill{height:100%;background:linear-gradient(90deg,#ffd75e,#ff8a3d);width:100%}
#pad{flex:0 0 auto;background:linear-gradient(#2a1250,#1b0b36);border-top:2px solid #7a4fd0;padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1fr 1fr 1fr;grid-template-rows:auto auto;gap:8px}
.pb{border:none;border-radius:14px;height:58px;font-size:18px;font-weight:900;font-family:inherit;color:#fff;background:#4b6fd6;box-shadow:0 4px 0 #27408f;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.pb small{font-size:11px;font-weight:700;opacity:.9}
.pb:active,.pb.on{transform:translateY(3px);box-shadow:0 1px 0 #27408f}
.pb.dz{background:#2fa36b;box-shadow:0 4px 0 #1b6b44}
.pb.dz:active,.pb.dz.on{box-shadow:0 1px 0 #1b6b44}
#btnGrab{grid-column:1/5;background:linear-gradient(#ff8a3d,#f5541f);box-shadow:0 5px 0 #a3300a;height:60px;font-size:24px}
#btnGrab:active{box-shadow:0 1px 0 #a3300a}
#btnPlay{grid-column:1/5;background:linear-gradient(#ffd75e,#f5a623);color:#4a2500;box-shadow:0 5px 0 #a36a0a;height:60px;font-size:22px}
#btnPlay:active{box-shadow:0 1px 0 #a36a0a}
#pad.playing #btnPlay{display:none}
#pad:not(.playing) .mv,#pad:not(.playing) #btnGrab{display:none}
#pad:not(.playing){grid-template-rows:auto}
.pb:disabled{opacity:.45}
.ov{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch;background:radial-gradient(circle at 50% 0%,#5a2fa0 0%,#2a1250 60%);display:none;flex-direction:column;align-items:center;padding:14px 12px 30px;z-index:10}
.ov.show{display:flex}
h1{font-size:26px;color:#ffd75e;text-shadow:0 2px 0 #7a3a00;margin:6px 0 2px}
.sub{font-size:13px;opacity:.85;margin-bottom:10px;text-align:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:440px}
.mc{background:#fff;color:#222;border-radius:16px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:3px;border:none;font-family:inherit;box-shadow:0 4px 0 #b9a3e6;position:relative}
.mc:active{transform:translateY(3px);box-shadow:0 1px 0 #b9a3e6}
.mc .em{font-size:38px}
.mc .nm{font-weight:900;font-size:15px}
.mc .st{color:#f5a623;font-size:12px;letter-spacing:1px}
.mc .cs{font-size:13px;font-weight:800;color:#7a4fd0}
.mc .ds{font-size:11px;color:#555;text-align:center;line-height:1.3}
.row{display:flex;gap:10px;width:100%;max-width:440px;margin-top:10px}
.big{flex:1;border:none;border-radius:14px;padding:12px 6px;font-weight:900;font-size:16px;font-family:inherit;color:#fff;background:#4b6fd6;box-shadow:0 4px 0 #27408f}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 #27408f}
.big.g{background:#2fa36b;box-shadow:0 4px 0 #1b6b44}
.big.o{background:#f5821f;box-shadow:0 4px 0 #a3300a}
.big.p{background:#7a4fd0;box-shadow:0 4px 0 #3d1d6e}
.card{background:rgba(255,255,255,.1);border-radius:14px;padding:10px 12px;width:100%;max-width:440px;margin-top:10px;font-size:13px;line-height:1.5}
.card b{color:#ffd75e}
.cg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;max-width:440px;margin-top:8px}
.ci{background:#fff;color:#222;border-radius:12px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:108px;position:relative}
.ci img,.ci .em{height:58px;width:58px;object-fit:contain;font-size:44px;display:flex;align-items:center;justify-content:center}
.ci .nm{font-size:10px;font-weight:800;text-align:center;line-height:1.15}
.ci .rr{font-size:9px;font-weight:800;padding:1px 6px;border-radius:999px;background:#ddd;color:#444}
.ci .rr.r1{background:#cfe3ff;color:#1f4fa0}.ci .rr.r2{background:#ffe9a8;color:#8a5a00}
.ci.no{opacity:.55;filter:grayscale(1)}
.ci.no img{filter:brightness(0) opacity(.35)}
.ci .ct{position:absolute;right:4px;top:4px;background:#f5821f;color:#fff;font-size:10px;font-weight:900;border-radius:999px;padding:1px 6px}
.ms{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border-radius:12px;padding:8px 10px;width:100%;max-width:440px;margin-top:6px;font-size:13px;font-weight:800}
.ms .ok{color:#8ff0b0}
.ms .pr{margin-left:auto;color:#ffd75e;white-space:nowrap}
#res{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:8;background:rgba(0,0,0,.45)}
#res.show{display:flex}
#resBox{background:#fff;color:#222;border-radius:20px;padding:16px 18px;text-align:center;max-width:300px;box-shadow:0 8px 30px rgba(0,0,0,.5);animation:pop .35s}
@keyframes pop{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
#resBox img{height:120px;max-width:200px;object-fit:contain}
#resBox .em{font-size:80px}
#resBox h2{font-size:20px;margin:4px 0}
#resBox .rr{display:inline-block;font-size:12px;font-weight:900;padding:2px 10px;border-radius:999px;background:#ddd;color:#444}
#resBox .rr.r1{background:#cfe3ff;color:#1f4fa0}#resBox .rr.r2{background:#ffe9a8;color:#8a5a00}
#resBox p{font-size:13px;margin:6px 0;line-height:1.4}
#toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:#ffd75e;color:#4a2500;font-weight:900;font-size:14px;padding:8px 14px;border-radius:999px;opacity:0;transition:opacity .3s;z-index:20;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}
#load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;z-index:30;background:#2a1250}
.ver{font-size:11px;opacity:.6;margin-top:14px}
@media (max-width:390px){#chMach{display:none!important}.chip{font-size:13px;padding:3px 8px}}
@media (min-aspect-ratio:1/1){#app{flex-direction:row}#hud{flex-direction:column;border-bottom:none;border-right:2px solid #7a4fd0;width:120px;align-items:stretch}#hudSp{display:none}#pad{width:220px;border-top:none;border-left:2px solid #7a4fd0;align-content:center}}
</style>
</head>

let prizes=[];
let bars=null,floorHole=false; // 橋わたし: [{x,y,r},{x,y,r}]
function makePrize(id,x,z,y){
 const d=PRIZE[id];
 const p={id,d,z,shape:d.img.length<=2||id.startsWith('c_')?'ball':'box',held:false,landed:false,spin:0,sp:0};
 if(id.startsWith('c_')){p.shape='ball';p.r=27;p.col=pick(['#ff6f91','#4fc3f7','#ffd54f','#81c784','#ba68c8','#ff8a65']);p.x=x;p.y=(y||0)+p.r;p.px=p.x;p.py=p.y;p.wt=.9;p.fr=.15;}
 else{
  p.w=d.w;p.h=d.h;p.wt=d.wt;p.fr=d.fr;p.com=d.com;p.shape='box';
  if(IMG[d.img]&&!id.startsWith('giant_')){const im=IMG[d.img];p.w=clamp(Math.round(d.h*im.naturalWidth/im.naturalHeight),44,110);}
  const cx=x,cy=(y||0)+d.h/2;
  p.pt=[[cx-d.w/2,cy-d.h/2],[cx+d.w/2,cy-d.h/2],[cx+d.w/2,cy+d.h/2],[cx-d.w/2,cy+d.h/2]].map(q=>({x:q[0],y:q[1],px:q[0],py:q[1]}));
  p.cons=[[0,1,d.w],[1,2,d.h],[2,3,d.w],[3,0,d.h],[0,2,Math.hypot(d.w,d.h)],[1,3,Math.hypot(d.w,d.h)]];
 }
 return p;
}
function center(p){if(p.shape==='ball')return{x:p.x,y:p.y};let x=0,y=0;p.pt.forEach(q=>{x+=q.x;y+=q.y;});return{x:x/4,y:y/4};}
function angle(p){if(p.shape==='ball')return p.spin;return Math.atan2(p.pt[1].y-p.pt[0].y,p.pt[1].x-p.pt[0].x);}
function radius(p){return p.shape==='ball'?p.r:Math.min(p.w,p.h)*.5;}
function setBox(p,cx,cy,a){const c=Math.cos(a),s=Math.sin(a),hw=p.w/2,hh=p.h/2;const o=[[-hw,-hh],[hw,-hh],[hw,hh],[-hw,hh]];o.forEach((q,i)=>{const x=cx+q[0]*c-q[1]*s,y=cy+q[0]*s+q[1]*c;p.pt[i].x=x;p.pt[i].y=y;p.pt[i].px=x;p.pt[i].py=y;});}
function overHole(p){return floorHole||p.z<HOLE_Z;}
function collideCircle(q,cx,cy,r,fr){const dx=q.x-cx,dy=q.y-cy,d=Math.hypot(dx,dy);if(d<r&&d>0){const nx=dx/d,ny=dy/d;q.x=cx+nx*r;q.y=cy+ny*r;const vx=q.x-q.px,vy=q.y-q.py;const vn=vx*nx+vy*ny;let tx=vx-vn*nx,ty=vy-vn*ny;tx*=1-fr;ty*=1-fr;q.px=q.x-(tx+Math.max(0,vn)*nx);q.py=q.y-(ty+Math.max(0,vn)*ny);return true;}return false;}
function edgeCircle(a,b,cx,cy,r,fr){const ex=b.x-a.x,ey=b.y-a.y,l2=ex*ex+ey*ey;let t=((cx-a.x)*ex+(cy-a.y)*ey)/(l2||1);t=clamp(t,0,1);const qx=a.x+ex*t,qy=a.y+ey*t;const dx=qx-cx,dy=qy-cy,d=Math.hypot(dx,dy);if(d<r&&d>0){const nx=dx/d,ny=dy/d,pen=r-d;const wa=1-t,wb=t,ws=wa*wa+wb*wb||1;const ma=pen*wa/ws,mb=pen*wb/ws;a.x+=nx*ma;a.y+=ny*ma;b.x+=nx*mb;b.y+=ny*mb;
 // まさつ
 [a,b].forEach(q=>{const vx=q.x-q.px,vy=q.y-q.py;const vn=vx*nx+vy*ny;let tx=vx-vn*nx,ty=vy-vn*ny;tx*=1-fr*.6;ty*=1-fr*.6;q.px=q.x-(tx+Math.max(0,vn)*nx);q.py=q.y-(ty+Math.max(0,vn)*ny);});return true;}return false;}
function stepPrize(p,dt){
 if(p.held)return;
 const hole=overHole(p);
 const fl=p.fr;
 if(p.shape==='ball'){
  const vx=p.x-p.px,vy=p.y-p.py;p.px=p.x;p.py=p.y;p.x+=vx*.995;p.y+=vy*.995-G*dt*dt;
  // ゆか
  if(p.y<p.r&&!(hole&&(floorHole||p.x<HOLE_W))){p.y=p.r;const nvx=(p.x-p.px)*(1-fl*.5);p.px=p.x-nvx;p.py=p.y+Math.abs(p.y-p.py)*.3;p.landed=true;}
  if(p.x<p.r&&!hole){p.x=p.r;p.px=p.x+(p.x-p.px)*-.4;}
  if(p.x<-60)p.x=-60;
  if(p.x>W-p.r){p.x=W-p.r;p.px=p.x+(p.x-p.px)*-.4;}
  if(bars)bars.forEach(b=>collideCircle(p,b.x,b.y,b.r+p.r,fl));
  if(hole&&!floorHole)collideCircle(p,HOLE_W,-2,p.r+2,fl);
  p.spin+=(p.x-p.px)/p.r;
 }else{
  p.pt.forEach(q=>{const vx=q.x-q.px,vy=q.y-q.py;q.px=q.x;q.py=q.y;q.x+=vx*.995;q.y+=vy*.995-G*dt*dt;});
  for(let it=0;it<8;it++){
   p.cons.forEach(c=>{const a=p.pt[c[0]],b=p.pt[c[1]];const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1;const f=(d-c[2])/d*.5;a.x+=dx*f;a.y+=dy*f;b.x-=dx*f;b.y-=dy*f;});
   p.pt.forEach(q=>{
    if(q.y<0&&!(hole&&(floorHole||q.x<HOLE_W))){q.y=0;const vx=q.x-q.px;q.px=q.x-vx*(1-fl*.5);q.py=q.y+Math.abs(q.y-q.py)*.2;p.landed=true;}
    if(q.x<0&&!hole){q.x=0;q.px=q.x+(q.x-q.px)*-.3;}
    if(q.x>W){q.x=W;q.px=q.x+(q.x-q.px)*-.3;}
    if(q.x<-60)q.x=-60;
   });
   if(bars)bars.forEach(b=>{for(let i=0;i<4;i++)edgeCircle(p.pt[i],p.pt[(i+1)%4],b.x,b.y,b.r,fl);});
   if(hole&&!floorHole)for(let i=0;i<4;i++)edgeCircle(p.pt[i],p.pt[(i+1)%4],HOLE_W,-3,4,fl);
  }
 }
}
function pairCollide(){
 for(let i=0;i<prizes.length;i++)for(let j=i+1;j<prizes.length;j++){
  const a=prizes[i],b=prizes[j];if(a.held||b.held)continue;if(Math.abs(a.z-b.z)>.3)continue;
  const ca=center(a),cb=center(b);const ra=radius(a),rb=radius(b);
  const dx=cb.x-ca.x,dy=cb.y-ca.y,d=Math.hypot(dx,dy)||.01;const min=ra+rb;
  if(d<min){const pen=(min-d);const nx=dx/d,ny=dy/d;const ma=b.wt/(a.wt+b.wt),mb=a.wt/(a.wt+b.wt);
   const push=(p,sx,sy)=>{if(p.shape==='ball'){p.x+=sx;p.y+=sy;p.px+=sx*.85;p.py+=sy*.85;}else p.pt.forEach(q=>{q.x+=sx;q.y+=sy;q.px+=sx*.85;q.py+=sy*.85;});};
   push(a,-nx*pen*ma*.5,-ny*pen*ma*.5);push(b,nx*pen*mb*.5,ny*pen*mb*.5);
  }
 }
}
function clawPush(cx,cy,cz,r){
 prizes.forEach(p=>{if(p.held||Math.abs(p.z-cz)>.25)return;const c=center(p);const hw=p.shape==='ball'?p.r:p.w*.5;if(Math.abs(c.x-cx)<hw+10)return; // まうえの 景品は おさない（つかむ）
  if(p.shape==='ball')collideCircle(p,cx,cy,r+p.r,.2);
  else for(let i=0;i<4;i++)edgeCircle(p.pt[i],p.pt[(i+1)%4],cx,cy,r,.2);
 });
}
function topAt(x,z,r){ // クレーンの ぶつかる たかさ
 let top=0;
 prizes.forEach(p=>{if(p.held||Math.abs(p.z-z)>.2)return;const c=center(p);const hw=p.shape==='ball'?p.r:p.w*.5;
  if(Math.abs(c.x-x)<hw+10){const t=p.shape==='ball'?c.y+p.r*.9:Math.max(...p.pt.map(q=>q.y));if(t>top)top=t;}});
 return top;
}

function updateClaw(dt){
 const spd=165;const oldx=claw.x,oldz=claw.z;
 if(claw.st==='move'){
  if(input.l)claw.x-=spd*dt;if(input.r)claw.x+=spd*dt;if(input.b)claw.z+=.85*dt;if(input.f)claw.z-=.85*dt;
  claw.x=clamp(claw.x,20,W-20);claw.z=clamp(claw.z,.06,.94);
  timeLeft-=dt;if(timeLeft<=0){timeLeft=0;doGrab();}
  $('timerFill').style.width=(timeLeft/machine.time*100)+'%';
 }else if(claw.st==='down'){
  claw.y-=170*dt;const top=topAt(claw.x,claw.z,14);
  clawPush(claw.x,claw.y-6,claw.z,13);
  if(claw.y<=top+4||claw.y<=6){claw.y=Math.max(top+4,6);claw.st='close';claw.t=0;}
 }else if(claw.st==='close'){
  claw.t+=dt;claw.open=Math.max(0,1-claw.t/.4);
  if(claw.t>=.45){tryGrab();claw.st='up';claw.t=0;}
 }else if(claw.st==='up'){
  const sp=claw.hold?(claw.mode==='corner'?150:130):170;claw.y+=sp*dt;
  if(claw.y>=TOP){claw.y=TOP;claw.st='travel';}
 }else if(claw.st==='travel'){
  const dx=HOME.x-claw.x,dz=HOME.z-claw.z;const d=Math.hypot(dx,dz*300);
  if(d<3){claw.x=HOME.x;claw.z=HOME.z;claw.st='drop';claw.t=0;}
  else{claw.x+=dx/d*140*dt;claw.z+=dz/d*140*dt;}
 }else if(claw.st==='drop'){
  claw.t+=dt;claw.open=Math.min(1,claw.t/.3);
  if(claw.t>.15&&claw.hold)releasePrize('drop');
  if(claw.t>1.1){claw.st='wait';claw.t=0;}
 }else if(claw.st==='wait'){
  claw.t+=dt;const anyMoving=prizes.some(p=>{if(p.shape==='ball')return Math.hypot(p.x-p.px,p.y-p.py)>.6;return p.pt.some(q=>Math.hypot(q.x-q.px,q.y-q.py)>.6);});
  if(claw.t>3||(claw.t>.7&&!anyMoving)){claw.st='idle';endPlay();}
 }
 claw.vx=(claw.x-oldx)/dt;claw.vz=(claw.z-oldz)/dt;
 // もちあげ中
 if(claw.hold){
  const p=claw.hold;
  if(claw.mode==='carry'){
   const wob=Math.sin(performance.now()/180)*.04;const tilt=clamp(claw.offset*.55,-.6,.6)+wob;
   if(p.shape==='ball'){p.x=claw.x;p.y=claw.y-p.r-2;p.px=p.x;p.py=p.y;}
   else{const cx=claw.x-Math.sin(tilt)*p.h*.25,cy=claw.y-p.h*.5-4;setBox(p,cx,cy,tilt);}
   p.z=claw.z;
   if(claw.st==='up'||claw.st==='travel'){
    const ps=Math.max(0,1.3-claw.quality)*.8+Math.abs(claw.offset)*.4+(p.shape==='ball'?.08:0)+(machine.type==='hard'?.25:0)+(claw.st==='travel'?.06:0);
    if(Math.random()<ps*dt)releasePrize('slip');
   }
  }else if(claw.mode==='corner'){
   // かどは アームの力のぶんだけ ついてくる（よこは ひっぱられる）
   const q=p.pt[claw.grabPt];const ty=claw.g0.qy+(claw.y-claw.g0.cy)*Math.min(1,claw.quality),tx=claw.x+claw.g0.qx*.5;
   q.x=tx;q.y=ty;q.px=q.x;q.py=q.y;p.z=claw.z;
   p.held=false;stepPrize(p,dt);p.held=true;q.x=tx;q.y=ty;q.px=q.x;q.py=q.y;
   if(claw.st==='up'||claw.st==='travel'){claw.slipT-=dt;if(claw.slipT<=0)releasePrize('slip');}
  }
 }

 if(!clawDrawn)drawClaw();
 // ガラスの はんしゃ
 const gl=ctx.createLinearGradient(MX,80,MX+MW,FLOORY);gl.addColorStop(0,'rgba(255,255,255,.14)');gl.addColorStop(.4,'rgba(255,255,255,0)');gl.addColorStop(1,'rgba(255,255,255,.08)');
 ctx.fillStyle=gl;ctx.fillRect(MX,80,MW,FLOORY-80);
 ctx.strokeStyle='#ffd75e';ctx.lineWidth=5;ctx.strokeRect(MX,80,MW,FLOORY-80);
 // した
 ctx.fillStyle='#c73a62';ctx.fillRect(6,FLOORY+2,388,56);ctx.fillStyle='#4a1030';ctx.fillRect(40,FLOORY+16,320,26);
 ctx.fillStyle='#ffd75e';ctx.font='900 13px sans-serif';ctx.textAlign='center';ctx.fillText(machine?machine.name+'　'+'★'.repeat(machine.stars)+'　'+machine.cost+'コイン':'',200,FLOORY+34);
 ctx.restore();
 // かみふぶき
 for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.t-=1/60;q.x+=q.vx/60;q.y+=q.vy/60;q.vy+=.3/60;q.r+=.1;if(q.t<=0||q.y>1.1){parts.splice(i,1);continue;}
  ctx.save();ctx.translate(q.x*CW,q.y*CH);ctx.rotate(q.r);ctx.fillStyle=q.c;ctx.fillRect(-5,-3,10,6);ctx.restore();}
}

/* ===== ループ ===== */
let last=0;
function loop(t){
 const dt=Math.min(.033,(t-last)/1000||.016);last=t;
 if(machine){updateClaw(dt);physics(dt);if(hintT>0){hintT-=dt;if(hintT<=0)hint=null;}}
 render();requestAnimationFrame(loop);
}

/* ===== UI ===== */
const bubT={L:0,R:0,R2:0};
const BUBCH={L:'fute',R:'chap',R2:'kuro'};
function say(who,name,text,pose){const el=$('bub'+who);el.querySelector('.txt').textContent=text;el.querySelector('img').src='img/'+BUBCH[who]+'_'+(pose||'think')+'.webp';el.classList.add('show');clearTimeout(bubT[who]);bubT[who]=setTimeout(()=>el.classList.remove('show'),2800);}
let toastT=0;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2200);}
function buildMenu(){
 const g=$('machGrid');g.innerHTML='';
 MORDER.forEach(k=>{const m=MACH[k];const b=document.createElement('button');b.className='mc';b.innerHTML='<div class="em">'+m.em+'</div><div class="nm">'+m.name+'</div><div class="st">'+'★'.repeat(m.stars)+'</div><div class="cs">🪙 '+m.cost+'コイン</div><div class="ds">'+m.ds+'</div>';
  b.onclick=()=>{SFX.click();SFX.ctx();$('ovMenu').classList.remove('show');setupMachine(k);};g.appendChild(b);});
 const d=S.daily;let html='<b>🎯 きょうの ミッション</b><br>';
 if(d&&d.ids)d.ids.forEach(id=>{const m=MISPOOL.find(x=>x.id===id);html+=(d.done[id]?'✅ ':'⬜ ')+m.t+'（'+Math.min(d.prog[id]||0,m.g)+'/'+m.g+'）<br>';});
 html+='ずかん：'+colCount()+'/'+PR.length+'しゅるい';
 $('dailyCard').innerHTML=html;
 const wait=Math.max(0,60-(Date.now()-S.workAt)/1000);$('btnWork').textContent=wait>0?'🧹 おてつだい（あと '+Math.ceil(wait)+'びょう）':'🧹 おてつだい（+30コイン）';
}
function buildBook(){
 const g=$('bookGrid');g.innerHTML='';
 $('bookSub').textContent='あつめた 景品：'+colCount()+'/'+PR.length+'しゅるい　🧸 ごうけい '+Object.values(S.col).reduce((a,b)=>a+b,0)+'こ';
 PR.forEach(p=>{const d=PRIZE[p[0]];const n=S.col[d.id]||0;const el=document.createElement('div');el.className='ci'+(n?'':' no');
  el.innerHTML=(IMG[d.img]?'<img src="img/'+d.img+'.webp" alt="">':'<div class="em">'+(n?d.img:'❓')+'</div>')+'<div class="nm">'+(n?d.name:'？？？')+'</div><span class="rr r'+d.rar+'">'+RARN[d.rar]+'</span>'+(n?'<span class="ct">×'+n+'</span>':'');
  g.appendChild(el);});
}
function buildMission(){
 const l=$('misList');l.innerHTML='';const d=S.daily;
 d.ids.forEach(id=>{const m=MISPOOL.find(x=>x.id===id);const el=document.createElement('div');el.className='ms';el.innerHTML='<span class="'+(d.done[id]?'ok':'')+'">'+(d.done[id]?'✅':'⬜')+'</span><span>'+m.t+'</span><span class="pr">'+Math.min(d.prog[id]||0,m.g)+'/'+m.g+'　+50🪙</span>';l.appendChild(el);});
 $('statCard').innerHTML='<b>📊 きろく</b><br>あそんだ かいすう：'+S.plays+'かい<br>とった 景品：'+S.wins+'こ<br>せいこうりつ：'+(S.plays?Math.round(S.wins/S.plays*100):0)+'%<br>まいにち ログインで +100コイン、ずかんが 5しゅるい ふえるごとに +100コイン！';
}
function hold(id,key){const b=$(id);const on=e=>{e.preventDefault();if(!playing||claw.st!=='move')return;input[key]=1;b.classList.add('on');SFX.move();};const off=()=>{input[key]=0;b.classList.remove('on');};
 b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('pointerleave',off);b.addEventListener('contextmenu',e=>e.preventDefault());}
hold('bL','l');hold('bR','r');hold('bB','b');hold('bF','f');
window.addEventListener('pointerup',()=>{input={l:0,r:0,b:0,f:0};document.querySelectorAll('.pb.on').forEach(b=>b.classList.remove('on'));});
$('btnGrab').onclick=()=>{if(playing)doGrab();};
$('btnPlay').onclick=()=>{SFX.ctx();startPlay();};
$('btnQuit').onclick=()=>{if(playing){toast('あそんでいる とちゅうだよ！ おわってから もどろう');return;}machine=null;prizes=[];bars=null;$('chMach').style.display='none';$('btnQuit').style.display='none';$('btnHint').style.display='none';buildMenu();$('ovMenu').classList.add('show');};
$('btnHint').onclick=()=>{SFX.click();showHint();};
$('btnBook').onclick=()=>{SFX.click();buildBook();$('ovBook').classList.add('show');};
$('btnBookBack').onclick=()=>$('ovBook').classList.remove('show');
$('btnMission').onclick=()=>{SFX.click();buildMission();$('ovMission').classList.add('show');};
$('btnMisBack').onclick=()=>$('ovMission').classList.remove('show');
$('btnWork').onclick=()=>{const wait=60-(Date.now()-S.workAt)/1000;if(wait>0){toast('あと '+Math.ceil(wait)+'びょう まってね');return;}S.workAt=Date.now();S.coins+=30;save();updHud();SFX.coin();toast('🧹 おそうじ ありがとう！ +30コイン');buildMenu();};
$('btnMute').onclick=()=>{S.mute=!S.mute;save();$('btnMute').textContent=S.mute?'🔇':'🔊';};
window.addEventListener('keydown',e=>{if(!playing)return;const k=e.key;if(k==='ArrowLeft')input.l=1;if(k==='ArrowRight')input.r=1;if(k==='ArrowUp')input.b=1;if(k==='ArrowDown')input.f=1;if(k===' '||k==='Enter'){doGrab();e.preventDefault();}});
window.addEventListener('keyup',e=>{const k=e.key;if(k==='ArrowLeft')input.l=0;if(k==='ArrowRight')input.r=0;if(k==='ArrowUp')input.b=0;if(k==='ArrowDown')input.f=0;});
setInterval(()=>{if($('ovMenu').classList.contains('show'))buildMenu();},1000);

/* ===== 開始 ===== */
checkDay();updHud();$('btnMute').textContent=S.mute?'🔇':'🔊';
resize();buildMenu();
loadImgs().then(()=>{$('load').style.display='none';resize();requestAnimationFrame(loop);});
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
window.__crane={get S(){return S;},set S(v){S=v;},get prizes(){return prizes;},claw,MACH,PRIZE,PR,setupMachine,startPlay,doGrab,tryGrab,acquire,center,makePrize,physics,updateClaw,get machine(){return machine;},get playing(){return playing;},input,misProg,checkDay,save,VERSION};
