<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2b2b3a">
<title>フテ猫 ホーム画面そろえ</title>
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<style>
:root{
  --bg:#1e1e2a; --panel:#2b2b3a; --panel2:#363648; --text:#f3f1ec; --sub:#b7b3c4;
  --accent:#f5821f; --accent2:#ffb347; --ok:#3ccf7a; --danger:#ff5d5d; --line:#44445a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
body{display:flex;flex-direction:column;min-height:100dvh}
button{font-family:inherit;font-size:15px;border:0;border-radius:10px;padding:9px 14px;background:var(--panel2);color:var(--text);cursor:pointer}
button:active{transform:scale(.97)}
button.pri{background:var(--accent);color:#1b1208;font-weight:700}
button.ghost{background:transparent;border:1px solid var(--line)}
button.danger{background:var(--danger);color:#fff}
input,textarea{font-family:inherit;font-size:16px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#15151e;color:var(--text);width:100%}
header{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;background:var(--panel);position:sticky;top:0;z-index:20}
header h1{font-size:16px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header h1 small{color:var(--sub);font-weight:400;font-size:11px;margin-left:6px}
.seg{display:flex;background:#15151e;border-radius:10px;padding:3px}
.seg button{padding:6px 10px;font-size:13px;background:transparent;border-radius:8px;color:var(--sub)}
.seg button.on{background:var(--accent);color:#1b1208;font-weight:700}
#menuBtn{padding:6px 10px;font-size:18px;line-height:1}
main{flex:1;display:flex;flex-direction:column;align-items:center;padding:10px 10px calc(env(safe-area-inset-bottom) + 16px);gap:10px;width:100%;max-width:980px;margin:0 auto}
.tabs{display:flex;gap:6px;overflow-x:auto;width:100%;padding:2px 0;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{white-space:nowrap;padding:7px 12px;font-size:13px;border-radius:999px;flex:0 0 auto}
.tabs button.on{background:var(--accent);color:#1b1208;font-weight:700}
.tabs button.add{border:1px dashed var(--line);background:transparent;color:var(--sub)}
.hint{font-size:12px;color:var(--sub);text-align:center;margin:0;line-height:1.5}
.toolrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:100%}
.toolrow button{font-size:13px;padding:8px 12px}

/* iPhone frame */
.phone{width:min(100%,360px);background:linear-gradient(160deg,#4c5a8a,#8a4c7a 60%,#f0905a);border-radius:34px;padding:14px 10px 10px;box-shadow:0 10px 40px rgba(0,0,0,.5);position:relative}
.phone.ipad{width:min(100%,720px);border-radius:22px;padding:14px}
.ipad .cell{aspect-ratio:1/1.25}
.ipad .icon{width:56%}
.dock .cell{aspect-ratio:1}
.grid{display:grid;gap:6px 4px}
.cell{aspect-ratio:1/1.35;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;position:relative;border-radius:12px;cursor:pointer}
.cell.empty .icon{background:rgba(255,255,255,.12);border:1px dashed rgba(255,255,255,.35)}
.cell.src .icon{outline:3px solid var(--accent2);outline-offset:2px}
.cell.done .icon{opacity:.35}
.cell.done::after{content:"✓";position:absolute;top:2%;left:50%;transform:translateX(-50%);font-size:26px;color:var(--ok);font-weight:900;text-shadow:0 1px 3px #000}
.icon{width:72%;aspect-ratio:1;border-radius:22%;display:flex;align-items:center;justify-content:center;font-size:clamp(18px,6.5vw,30px);box-shadow:0 2px 6px rgba(0,0,0,.3);background:#fff;position:relative;overflow:hidden}
.ipad .icon{font-size:clamp(16px,3.2vw,30px)}
.icon.folder{background:rgba(255,255,255,.35);backdrop-filter:blur(4px);font-size:70%}
.icon .num{position:absolute;right:3px;bottom:2px;font-size:10px;color:#fff;background:rgba(0,0,0,.45);border-radius:6px;padding:0 4px}
.label{font-size:clamp(9px,2.7vw,11px);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.7);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.2}
.ipad .label{font-size:clamp(9px,1.3vw,12px)}
.dock{margin-top:10px;background:rgba(255,255,255,.22);border-radius:22px;padding:8px 6px 4px;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.dock .label{visibility:hidden;height:0}
.ipad .dock{grid-template-columns:repeat(var(--dockc,6),1fr);width:70%;margin-left:auto;margin-right:auto}

/* checklist */
.list{width:min(100%,560px);background:var(--panel);border-radius:14px;overflow:hidden}
.list .row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.list .row:last-child{border-bottom:0}
.list .row .n{width:24px;color:var(--sub);font-size:12px;text-align:right}
.list .row .ic{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px;flex:0 0 auto}
.list .row .t{flex:1;font-size:15px}
.list .row .t small{display:block;color:var(--sub);font-size:11px}
.list .row .ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:16px;color:#1b1208}
.list .row.done .ck{background:var(--ok);border-color:var(--ok)}
.list .row.done .t{text-decoration:line-through;color:var(--sub)}
.list .sec{padding:8px 12px;font-size:12px;color:var(--sub);background:#24243090}
.prog{width:min(100%,560px);display:flex;align-items:center;gap:10px;font-size:13px;color:var(--sub)}
.prog .bar{flex:1;height:8px;background:#15151e;border-radius:4px;overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .2s}

/* sheet */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:50;align-items:flex-end;justify-content:center}
.ov.show{display:flex}
.sheet{width:100%;max-width:560px;max-height:88dvh;background:var(--panel);border-radius:18px 18px 0 0;padding:14px 14px calc(env(safe-area-inset-bottom) + 14px);display:flex;flex-direction:column;gap:10px;overflow:auto}
.sheet h2{font-size:16px;margin:0;display:flex;align-items:center;gap:8px}
.sheet h2 span{flex:1}
.sheet .x{background:transparent;font-size:20px;padding:4px 8px;color:var(--sub)}
.results{display:flex;flex-direction:column;gap:4px;max-height:50dvh;overflow:auto}
.results button{display:flex;align-items:center;gap:10px;text-align:left;padding:8px 10px;background:var(--panel2)}
.results .ic{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;flex:0 0 auto}
.results button.add{background:transparent;border:1px dashed var(--line)}
.actions{display:flex;flex-direction:column;gap:6px}
.actions button{text-align:left;padding:12px 14px}
.row2{display:flex;gap:8px}
.row2 button{flex:1}
.colors{display:flex;flex-wrap:wrap;gap:6px}
.colors button{width:30px;height:30px;border-radius:50%;padding:0;border:2px solid transparent}
.colors button.on{border-color:#fff}
.emojis{display:flex;flex-wrap:wrap;gap:4px}
.emojis button{width:38px;height:38px;padding:0;font-size:20px;border-radius:8px}
.emojis button.on{background:var(--accent)}
.viewer{position:fixed;inset:0;background:#000;display:none;z-index:60;align-items:center;justify-content:center}
.viewer.show{display:flex}
.viewer img{max-width:100%;max-height:100%;object-fit:contain}
.viewer button{position:absolute;top:calc(env(safe-area-inset-top) + 10px);right:12px;background:rgba(255,255,255,.2);color:#fff}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 70px);transform:translateX(-50%);background:#000c;color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;z-index:70;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1}
.small{font-size:12px;color:var(--sub);line-height:1.5;margin:0}
.linkbox{word-break:break-all;font-size:11px;background:#15151e;padding:8px;border-radius:8px;max-height:80px;overflow:auto;color:var(--sub);-webkit-user-select:text;user-select:text}
.movebar{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 12px);transform:translateX(-50%);background:var(--accent);color:#1b1208;padding:10px 14px;border-radius:999px;font-weight:700;font-size:13px;z-index:40;display:none;gap:10px;align-items:center;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.movebar.show{display:flex}
.movebar button{padding:4px 10px;font-size:12px;background:#1b1208;color:#fff;border-radius:999px}
</style>
</head>
<body>
<header>
  <h1 id="title">ホーム画面そろえ <small id="ver"></small></h1>
  <div class="seg" id="modeSeg">
    <button data-m="phone" class="on">iPhone きろく</button>
    <button data-m="pad">iPad ならべ</button>
  </div>
  <button id="menuBtn" aria-label="メニュー">☰</button>
</header>
<main id="main"></main>

<div class="movebar" id="moveBar"><span id="moveTxt">いれかえ先を タップ</span><button id="moveCancel">やめる</button></div>

<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>
<div class="viewer" id="viewer"><img id="viewerImg" alt="スクリーンショット"><button id="viewerClose">とじる ✕</button></div>
<div class="toast" id="toast"></div>
<input type="file" id="shotFile" accept="image/*" style="display:none">
<input type="file" id="jsonFile" accept="application/json,.json" style="display:none">

/* ---------- 状態 ---------- */
var S=null;
var mode='phone';
var page=0;
var moveSrc=null; // {page:n|'dock', idx}
function newPage(){ return {cells:[], shot:null}; }
function defaultState(){ return {v:1,rows:6,cols:4,padCols:6,padRows:5,padDock:6,pages:[newPage()],dock:[null,null,null,null],checks:{}}; }
function load(){
  try{ var s=JSON.parse(localStorage.getItem(KEY)||'null'); if(s&&s.pages){ S=s; } }catch(e){}
  if(!S) S=defaultState();
  if(!S.checks) S.checks={};
  if(!S.padDock) S.padDock=6;
  normalize();
}
function normalize(){
  var n=S.rows*S.cols;
  S.pages.forEach(function(p){ p.cells=p.cells||[]; while(p.cells.length<n) p.cells.push(null); p.cells.length=n; });
  while(S.dock.length<4) S.dock.push(null); S.dock.length=4;
  if(page>=S.pages.length) page=S.pages.length-1;
}
function save(){
  try{ localStorage.setItem(KEY,JSON.stringify(S)); }
  catch(e){ toast('保存できませんでした（容量不足？ スクショを減らしてください）'); }
}
function cellsOf(ref){ return ref==='dock'?S.dock:S.pages[ref].cells; }
function itemsOfPage(pi){ return S.pages[pi].cells.filter(function(c){return c;}); }
function dockItems(){ return S.dock.filter(function(c){return c;}); }
function ckey(pi,i){ return (pi==='dock'?'d':'p'+pi)+'-'+i; }
function isDone(pi,i){ return !!S.checks[ckey(pi,i)]; }
function toggleDone(pi,i){ var k=ckey(pi,i); if(S.checks[k]) delete S.checks[k]; else S.checks[k]=1; save(); render(); }

/* ---------- 描画 ---------- */
var main=document.getElementById('main');
function el(tag,cls,html){ var e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e; }
function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function iconHTML(it){
  if(!it) return '<div class="icon" style="background:transparent;box-shadow:none"></div>';
  if(it.f){ var n=(it.items||[]).length; return '<div class="icon folder">📁'+(n?'<span class="num">'+n+'</span>':'')+'</div>'; }
  return '<div class="icon" style="background:'+esc(it.c||'#fff')+'">'+esc(it.e||'📱')+'</div>';
}
function render(){
  main.innerHTML='';
  document.querySelectorAll('#modeSeg button').forEach(function(b){ b.classList.toggle('on',b.dataset.m===mode); });
  renderTabs();
  if(mode==='phone') renderPhone(); else renderPad();
  document.getElementById('moveBar').classList.toggle('show',!!moveSrc);
}
function renderTabs(){
  var t=el('div','tabs');
  S.pages.forEach(function(p,i){
    var b=el('button',i===page?'on':'', 'ページ'+(i+1));
    if(mode==='pad'){ var items=itemsOfPage(i); var d=items.filter(function(_,j){return isDone(i,j);}).length; if(items.length&&d===items.length) b.textContent='ページ'+(i+1)+' ✓'; }
    b.onclick=function(){ page=i; render(); };
    t.appendChild(b);
  });
  if(mode==='phone'){
    var add=el('button','add','＋ ページ'); add.onclick=function(){ S.pages.push(newPage()); normalize(); page=S.pages.length-1; save(); render(); }; t.appendChild(add);
  }
  main.appendChild(t);
}
function cellNode(ref,i,it,opts){
  var c=el('div','cell'+(it?'':' empty'));
  if(moveSrc&&moveSrc.page===ref&&moveSrc.idx===i) c.classList.add('src');
  if(opts&&opts.done) c.classList.add('done');
  c.innerHTML=iconHTML(it)+'<div class="label">'+(it?esc(it.n):'')+'</div>';
  c.onclick=function(){ if(opts&&opts.onclick) opts.onclick(); else onCellTap(ref,i); };
  return c;
}
function renderPhone(){
  var p=S.pages[page];
  var hint=el('p','hint','iPhoneの ホーム画面を 見ながら、おなじ場所に アプリを 入れてください。<br>マスを タップ→アプリを さがして 追加。入っている アプリを タップ→いれかえ・名前・削除。');
  main.appendChild(hint);
  var tools=el('div','toolrow');
  var shotBtn=el('button','', p.shot?'📷 スクショを見る':'📷 このページの スクショを登録');
  shotBtn.onclick=function(){ if(p.shot) openViewer(p.shot); else pickShot(); };
  tools.appendChild(shotBtn);
  if(p.shot){ var rm=el('button','ghost','スクショを変更'); rm.onclick=pickShot; tools.appendChild(rm); }
  if(S.pages.length>1){ var del=el('button','ghost','このページを削除'); del.onclick=function(){ if(confirm('ページ'+(page+1)+'を削除しますか？（アプリの記録も消えます）')){ S.pages.splice(page,1); clearChecksPage(); normalize(); if(page>0)page--; save(); render(); } }; tools.appendChild(del); }
  main.appendChild(tools);

  var ph=el('div','phone');
  var g=el('div','grid'); g.style.gridTemplateColumns='repeat('+S.cols+',1fr)';
  p.cells.forEach(function(it,i){ g.appendChild(cellNode(page,i,it)); });
  ph.appendChild(g);
  var d=el('div','dock');
  S.dock.forEach(function(it,i){ d.appendChild(cellNode('dock',i,it)); });
  ph.appendChild(d);
  main.appendChild(ph);
  var cnt=itemsOfPage(page).length;
  main.appendChild(el('p','hint','このページ：'+cnt+'こ ／ 全ページ：'+totalItems()+'こ（ドック '+dockItems().length+'こ）'));
}
function totalItems(){ return S.pages.reduce(function(a,p,i){return a+itemsOfPage(i).length;},0); }
function clearChecksPage(){ Object.keys(S.checks).forEach(function(k){ if(k.indexOf('p')===0) delete S.checks[k]; }); }

function renderPad(){
  var items=itemsOfPage(page);
  var hint=el('p','hint','iPhoneの ページ'+(page+1)+'を、iPadでは こう ならべます（おなじ順番）。<br>iPadで ならべたら タップして ✓ を つけていきましょう。');
  main.appendChild(hint);
  var cap=S.padCols*S.padRows;
  var ph=el('div','phone ipad'); ph.style.setProperty('--dockc',S.padDock);
  var g=el('div','grid'); g.style.gridTemplateColumns='repeat('+S.padCols+',1fr)';
  for(var i=0;i<cap;i++){
    (function(i){ var it=items[i]||null; g.appendChild(cellNode(page,i,it,{done:it&&isDone(page,i),onclick:function(){ if(it) toggleDone(page,i); }})); })(i);
  }
  ph.appendChild(g);
  if(page===0){
    var d=el('div','dock'); var di=dockItems();
    for(var j=0;j<S.padDock;j++){ (function(j){ var it=di[j]||null; d.appendChild(cellNode('dock',j,it,{done:it&&isDone('dock',j),onclick:function(){ if(it) toggleDone('dock',j); }})); })(j); }
    ph.appendChild(d);
  }
  main.appendChild(ph);
  if(items.length>cap) main.appendChild(el('p','hint','⚠️ iPadの1ページ（'+cap+'こ）に 入りきらない分が '+(items.length-cap)+'こ あります。次のページに 回してください。'));

  // 進捗
  var done=items.filter(function(_,k){return isDone(page,k);}).length;
  var total=items.length;
  if(page===0){ var dd=dockItems(); done+=dd.filter(function(_,k){return isDone('dock',k);}).length; total+=dd.length; }
  var pr=el('div','prog','<span>'+done+' / '+total+' 配置ずみ</span><div class="bar"><i style="width:'+(total?Math.round(done/total*100):0)+'%"></i></div>');
  main.appendChild(pr);

  // チェックリスト
  var L=el('div','list');
  if(page===0&&dockItems().length){
    L.appendChild(el('div','sec','ドック（下の バー）'));
    dockItems().forEach(function(it,k){ L.appendChild(rowNode('dock',k,it,k+1)); });
  }
  L.appendChild(el('div','sec','ページ'+(page+1)+'（左上から 右へ、順番に）'));
  if(!items.length) L.appendChild(el('div','sec','このページには まだ アプリが 入っていません。「iPhone きろく」で 入れてください。'));
  items.forEach(function(it,k){ L.appendChild(rowNode(page,k,it,k+1)); });
  main.appendChild(L);

  var tools=el('div','toolrow');
  var rs=el('button','ghost','このページの ✓ を リセット'); rs.onclick=function(){ Object.keys(S.checks).forEach(function(k){ if(k.indexOf('p'+page+'-')===0||(page===0&&k.indexOf('d-')===0)) delete S.checks[k]; }); save(); render(); };
  tools.appendChild(rs);
  main.appendChild(tools);
  main.appendChild(el('p','hint','iPadでの 置き方：アプリライブラリ（いちばん右まで スワイプ）で 名前を 検索 → 長押し → ドラッグで ホーム画面へ。<br>iPadの マス目の数は メニューの「せってい」で 変えられます。'));
}
function rowNode(ref,k,it,num){
  var r=el('div','row'+(isDone(ref,k)?' done':''));
  var sub=it.f?('フォルダ：'+(it.items&&it.items.length?esc(it.items.join('、')):'中身 未登録')):'';
  var ic=it.f?'<div class="ic" style="background:#ffffff44">📁</div>':'<div class="ic" style="background:'+esc(it.c||'#fff')+'">'+esc(it.e||'📱')+'</div>';
  r.innerHTML='<div class="n">'+num+'</div>'+ic+'<div class="t">'+esc(it.n)+(sub?'<small>'+sub+'</small>':'')+'</div><div class="ck">'+(isDone(ref,k)?'✓':'')+'</div>';
  r.onclick=function(){ toggleDone(ref,k); };
  return r;
}

/* ---------- セルのタップ（iPhoneモード） ---------- */
function onCellTap(ref,i){
  var cells=cellsOf(ref);
  if(moveSrc){
    var src=cellsOf(moveSrc.page); var a=src[moveSrc.idx]; var b=cells[i];
    src[moveSrc.idx]=b; cells[i]=a; moveSrc=null; save(); render(); return;
  }
  var it=cells[i];
  if(!it) openPicker(ref,i); else openActions(ref,i);
}
var ov=document.getElementById('ov'), sheet=document.getElementById('sheet');
function openSheet(html){ sheet.innerHTML=html; ov.classList.add('show'); }
function closeSheet(){ ov.classList.remove('show'); sheet.innerHTML=''; }
ov.addEventListener('click',function(e){ if(e.target===ov) closeSheet(); });

function openPicker(ref,i){
  openSheet('<h2><span>アプリを えらぶ</span><button class="x" id="shX">✕</button></h2><input id="q" placeholder="アプリ名を 入力（例：LINE、天気）" autocomplete="off"><div class="results" id="res"></div>');
  document.getElementById('shX').onclick=closeSheet;
  var q=document.getElementById('q'), res=document.getElementById('res');
  function used(){ var s={}; S.pages.forEach(function(p){p.cells.forEach(function(c){ if(c&&!c.f) s[c.n]=1; });}); S.dock.forEach(function(c){ if(c&&!c.f) s[c.n]=1; }); return s; }
  function list(){
    var v=q.value.trim(); var lv=v.toLowerCase(); var u=used(); res.innerHTML='';
    var seen={}; var hits=PRESETS.filter(function(p){ if(seen[p[0]]) return false; seen[p[0]]=1; return !lv||p[0].toLowerCase().indexOf(lv)>=0; });
    if(v){
      var b=el('button','add','<div class="ic" style="background:'+COLORS[9]+'">📱</div><div>「'+esc(v)+'」を このまま 追加</div>');
      b.onclick=function(){ place(ref,i,{n:v,e:'📱',c:'#1e90ff'}); closeSheet(); };
      res.appendChild(b);
      var f=el('button','add','<div class="ic" style="background:#ffffff33">📁</div><div>フォルダ「'+esc(v)+'」を 作る</div>');
      f.onclick=function(){ place(ref,i,{n:v,f:true,items:[]}); closeSheet(); openFolderEdit(ref,i); };
      res.appendChild(f);
    }else{
      var f0=el('button','add','<div class="ic" style="background:#ffffff33">📁</div><div>フォルダを 作る</div>');
      f0.onclick=function(){ var nm=prompt('フォルダの名前','フォルダ'); if(nm==null) return; place(ref,i,{n:nm||'フォルダ',f:true,items:[]}); closeSheet(); openFolderEdit(ref,i); };
      res.appendChild(f0);
    }
    hits.slice(0,60).forEach(function(p){
      var b=el('button','','<div class="ic" style="background:'+p[2]+'">'+p[1]+'</div><div>'+esc(p[0])+(u[p[0]]?' <small style="color:var(--sub)">（登録ずみ）</small>':'')+'</div>');
      b.onclick=function(){ place(ref,i,{n:p[0],e:p[1],c:p[2]}); closeSheet(); };
      res.appendChild(b);
    });
  }
  q.oninput=list; list();
  setTimeout(function(){ q.focus(); },50);
}
function place(ref,i,it){ cellsOf(ref)[i]=it; save(); render(); }

function openActions(ref,i){
  var it=cellsOf(ref)[i];
  openSheet('<h2>'+iconHTML(it).replace('class="icon','style="width:34px;height:34px;font-size:18px" class="icon')+'<span>'+esc(it.n)+'</span><button class="x" id="shX">✕</button></h2><div class="actions" id="acts"></div>');
  document.getElementById('shX').onclick=closeSheet;
  var A=document.getElementById('acts');
  function act(label,fn,cls){ var b=el('button',cls||'',label); b.onclick=function(){ closeSheet(); fn(); }; A.appendChild(b); }
  act('↔️ いれかえ・移動（つぎに タップした マスへ）',function(){ moveSrc={page:ref,idx:i}; document.getElementById('moveTxt').textContent='「'+it.n+'」の 行き先を タップ（ページも 切りかえOK）'; render(); });
  if(it.f) act('📁 フォルダの中身を 編集',function(){ openFolderEdit(ref,i); });
  act('✏️ 名前・アイコンを 変える',function(){ openEdit(ref,i); });
  act('🗑️ このマスから 消す',function(){ cellsOf(ref)[i]=null; save(); render(); },'danger');
}
function openEdit(ref,i){
  var it=cellsOf(ref)[i];
  var ch='';
  if(!it.f){
    ch='<p class="small">アイコンの 絵文字</p><div class="emojis" id="em"></div><p class="small">アイコンの 色</p><div class="colors" id="co"></div>';
  }
  openSheet('<h2><span>名前・アイコン</span><button class="x" id="shX">✕</button></h2><input id="nm" value="'+esc(it.n)+'">'+ch+'<button class="pri" id="ok">決定</button>');
  document.getElementById('shX').onclick=closeSheet;
  var e=it.e, c=it.c;
  if(!it.f){
    var em=document.getElementById('em'), co=document.getElementById('co');
    EMOJIS.forEach(function(x){ var b=el('button',x===e?'on':'',x); b.onclick=function(){ e=x; em.querySelectorAll('button').forEach(function(z){z.classList.toggle('on',z.textContent===x);}); }; em.appendChild(b); });
    COLORS.forEach(function(x){ var b=el('button',x===c?'on':''); b.style.background=x; b.onclick=function(){ c=x; co.querySelectorAll('button').forEach(function(z){z.classList.toggle('on',z===b);}); }; co.appendChild(b); });
  }
  document.getElementById('ok').onclick=function(){ var v=document.getElementById('nm').value.trim(); if(v) it.n=v; if(!it.f){ it.e=e; it.c=c; } save(); closeSheet(); render(); };
}
function openFolderEdit(ref,i){
  var it=cellsOf(ref)[i];
  openSheet('<h2><span>📁 '+esc(it.n)+' の中身</span><button class="x" id="shX">✕</button></h2><p class="small">中に 入っている アプリ名を 1行に 1つずつ 書いてください（iPadで ならべるときの 目印です）。</p><textarea id="ta" rows="7">'+esc((it.items||[]).join('\n'))+'</textarea><button class="pri" id="ok">決定</button>');
  document.getElementById('shX').onclick=closeSheet;
  document.getElementById('ok').onclick=function(){ it.items=document.getElementById('ta').value.split('\n').map(function(s){return s.trim();}).filter(Boolean); save(); closeSheet(); render(); };
}
document.getElementById('moveCancel').onclick=function(){ moveSrc=null; render(); };

/* ---------- スクショ ---------- */
var shotFile=document.getElementById('shotFile');
function pickShot(){ shotFile.value=''; shotFile.click(); }
shotFile.onchange=function(){
  var f=shotFile.files[0]; if(!f) return;
  var img=new Image(); var url=URL.createObjectURL(f);
  img.onload=function(){
    var w=img.naturalWidth,h=img.naturalHeight,max=900,sc=Math.min(1,max/Math.max(w,h));
    var cv=document.createElement('canvas'); cv.width=Math.round(w*sc); cv.height=Math.round(h*sc);
    cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
    S.pages[page].shot=cv.toDataURL('image/jpeg',0.75); URL.revokeObjectURL(url); save(); render(); toast('スクショを登録しました');
  };
  img.onerror=function(){ toast('画像を読み込めませんでした'); };
  img.src=url;
};
var viewer=document.getElementById('viewer');
function openViewer(src){ document.getElementById('viewerImg').src=src; viewer.classList.add('show'); }
document.getElementById('viewerClose').onclick=function(){ viewer.classList.remove('show'); };
viewer.onclick=function(e){ if(e.target===viewer) viewer.classList.remove('show'); };

/* ---------- メニュー・せってい・受け渡し ---------- */
document.getElementById('menuBtn').onclick=openMenu;
function openMenu(){
  openSheet('<h2><span>メニュー</span><button class="x" id="shX">✕</button></h2><div class="actions" id="acts"></div><p class="small">ホーム画面そろえ v'+VERSION+'　© 泉正道 / フテ猫実行委員会<br>記録は この端末の ブラウザ内に 保存されます。iPadへは「iPadに送る」で 渡してください。</p>');
  document.getElementById('shX').onclick=closeSheet;
  var A=document.getElementById('acts');
  function act(label,fn,cls){ var b=el('button',cls||'',label); b.onclick=fn; A.appendChild(b); }
  act('📤 iPadに送る（リンクを作る）',openShare);
  act('📥 リンク・コードから 受け取る',openReceive);
  act('⚙️ せってい（マス目の数）',openSettings);
  act('💾 JSONファイルに 書き出す',exportJSON);
  act('📂 JSONファイルを 読み込む',function(){ jsonFile.value=''; jsonFile.click(); });
  act('🗑️ すべて消す',function(){ if(confirm('すべての記録を消しますか？')){ S=defaultState(); page=0; moveSrc=null; save(); closeSheet(); render(); } },'danger');
}
function openSettings(){
  openSheet('<h2><span>せってい</span><button class="x" id="shX">✕</button></h2>'+
    '<p class="small">iPhone のマス目</p><div class="row2"><label style="flex:1">よこ<input id="sc" type="number" min="3" max="6" value="'+S.cols+'"></label><label style="flex:1">たて<input id="sr" type="number" min="4" max="8" value="'+S.rows+'"></label></div>'+
    '<p class="small">iPad のマス目（横向きなら ふつう よこ6×たて5、縦向きなら よこ5×たて6。「アイコンを大きく」だと よこ4〜5）</p><div class="row2"><label style="flex:1">よこ<input id="pc" type="number" min="3" max="8" value="'+S.padCols+'"></label><label style="flex:1">たて<input id="pr" type="number" min="3" max="8" value="'+S.padRows+'"></label><label style="flex:1">ドック<input id="pd" type="number" min="3" max="10" value="'+S.padDock+'"></label></div>'+
    '<button class="pri" id="ok">決定</button>');
  document.getElementById('shX').onclick=closeSheet;
  document.getElementById('ok').onclick=function(){
    var g=function(id,lo,hi,d){ var v=parseInt(document.getElementById(id).value,10); return isNaN(v)?d:Math.max(lo,Math.min(hi,v)); };
    var nc=g('sc',3,6,S.cols), nr=g('sr',4,8,S.rows);
    if(nc!==S.cols||nr!==S.rows){
      // 既存の配置を 新しいマス目に 詰めなおす
      S.pages.forEach(function(p){ var items=p.cells.filter(Boolean); p.cells=[]; for(var k=0;k<nc*nr;k++) p.cells.push(items[k]||null); if(items.length>nc*nr) toast('入りきらない アプリが ありました'); });
      S.cols=nc; S.rows=nr;
    }
    S.padCols=g('pc',3,8,S.padCols); S.padRows=g('pr',3,8,S.padRows); S.padDock=g('pd',3,10,S.padDock);
    normalize(); save(); closeSheet(); render();
  };
}
function packData(){
  var c=JSON.parse(JSON.stringify(S)); c.pages.forEach(function(p){ delete p.shot; }); delete c.checks;
  var s=JSON.stringify(c);
  return btoa(unescape(encodeURIComponent(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function unpackData(code){
  code=code.trim(); var m=code.match(/#d=([^&\s]+)/); if(m) code=m[1];
  code=code.replace(/-/g,'+').replace(/_/g,'/'); while(code.length%4) code+='=';
  var s=decodeURIComponent(escape(atob(code)));
  var o=JSON.parse(s); if(!o||!o.pages||!o.pages.length) throw new Error('bad');
  return o;
}
function shareURL(){ return location.origin+location.pathname+'#d='+packData(); }
function openShare(){
  var url=shareURL();
  openSheet('<h2><span>📤 iPadに送る</span><button class="x" id="shX">✕</button></h2>'+
    '<p class="small">このリンクを iPadで 開くと、おなじ記録が 読み込まれます（スクショは 送られません）。<br>AirDrop・LINE・メモ などで iPadに 送ってください。</p>'+
    '<div class="row2"><button class="pri" id="sh">共有（AirDropなど）</button><button id="cp">リンクを コピー</button></div><div class="linkbox" id="lb">'+esc(url)+'</div>'+
    '<p class="small">リンクの長さ：'+url.length.toLocaleString()+'文字（長すぎて 送れないときは「JSONファイルに 書き出す」を 使ってください）</p>');
  document.getElementById('shX').onclick=closeSheet;
  document.getElementById('sh').onclick=function(){
    if(navigator.share){ navigator.share({title:'ホーム画面そろえ',text:'iPhoneのホーム画面の配置',url:url}).catch(function(){}); }
    else copy(url);
  };
  document.getElementById('cp').onclick=function(){ copy(url); };
}
function copy(t){
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(function(){toast('コピーしました');},function(){fallbackCopy(t);}); } else fallbackCopy(t);
}
function fallbackCopy(t){ var ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); toast('コピーしました'); }catch(e){ toast('コピーできませんでした。リンクを 長押しして コピーしてください'); } document.body.removeChild(ta); }
function openReceive(){
  openSheet('<h2><span>📥 受け取る</span><button class="x" id="shX">✕</button></h2><p class="small">送られてきた リンク（または #d= のあとの コード）を はりつけてください。</p><textarea id="ta" rows="5" placeholder="https://…#d=…"></textarea><button class="pri" id="ok">読み込む</button>');
  document.getElementById('shX').onclick=closeSheet;
  document.getElementById('ok').onclick=function(){ applyReceived(document.getElementById('ta').value); };
}
function applyReceived(code){
  try{
    var o=unpackData(code);
    if(totalItems()>0&&!confirm('いまの記録を 置きかえますか？（スクショは 残ります）')) return;
    var shots=S.pages.map(function(p){return p.shot;});
    o.pages.forEach(function(p,i){ p.shot=shots[i]||null; });
    o.checks={}; S=o; page=0; moveSrc=null; normalize(); save(); closeSheet(); render(); toast('読み込みました');
  }catch(e){ toast('読み込めませんでした。リンクが 途中で 切れていないか 確認してください'); }
}
function exportJSON(){
  var c=JSON.parse(JSON.stringify(S)); c.pages.forEach(function(p){ delete p.shot; });
  var blob=new Blob([JSON.stringify(c,null,1)],{type:'application/json'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='homescreen.json'; document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },500);
  closeSheet();
}
var jsonFile=document.getElementById('jsonFile');
jsonFile.onchange=function(){
  var f=jsonFile.files[0]; if(!f) return; var r=new FileReader();
  r.onload=function(){ try{ var o=JSON.parse(r.result); if(!o.pages) throw 0; if(totalItems()>0&&!confirm('いまの記録を 置きかえますか？')) return; S=o; page=0; moveSrc=null; normalize(); save(); closeSheet(); render(); toast('読み込みました'); }catch(e){ toast('JSONを 読み込めませんでした'); } };
  r.readAsText(f);
};

/* ---------- その他 ---------- */
var toastT=null;
function toast(m){ var t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(function(){ t.classList.remove('show'); },2600); }
document.querySelectorAll('#modeSeg button').forEach(function(b){ b.onclick=function(){ mode=b.dataset.m; moveSrc=null; render(); }; });

load();
if(location.hash.indexOf('#d=')===0){
  var code=location.hash.slice(3);
  history.replaceState(null,'',location.pathname);
  try{
    var o=unpackData(code);
    if(totalItems()===0||confirm('iPhoneから 送られた 記録を 読み込みますか？（いまの記録は 置きかわります）')){
      var shots=S.pages.map(function(p){return p.shot;});
      o.pages.forEach(function(p,i){ p.shot=shots[i]||null; });
      o.checks={}; S=o; normalize(); save(); mode='pad'; toast('iPhoneの記録を 読み込みました');
    }
  }catch(e){ toast('リンクの データを 読めませんでした'); }
}
render();
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
</script>
</body>
</html>
