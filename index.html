<style>
:root{--bg:#fbf4e6;--paper:#fffaf0;--ink:#3b2a1a;--sub:#8a6f52;--line:#e6d3b3;--orange:#f08a1c;--orange2:#c9650b;--pink:#e8608a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Hiragino Maru Gothic ProN","Hiragino Maru Gothic Pro","BIZ UDPGothic","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif}
body{background-image:radial-gradient(circle at 15% 20%,rgba(240,138,28,.07) 0 60px,transparent 61px),radial-gradient(circle at 85% 60%,rgba(58,143,214,.06) 0 80px,transparent 81px)}
.wrap{max-width:880px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px 32px}
header{text-align:center;padding:10px 0 6px}
.faces{display:flex;justify-content:center;gap:6px;margin-bottom:6px}
.faces img{width:64px;height:64px;border-radius:50%;background:#fff;border:3px solid #fff;box-shadow:0 0 0 2px var(--line),0 4px 8px rgba(0,0,0,.08)}
.faces img:nth-child(odd){transform:rotate(-6deg)}.faces img:nth-child(even){transform:rotate(6deg) translateY(4px)}
h1{margin:4px 0 0;font-size:clamp(28px,7.5vw,44px);letter-spacing:.04em;
  text-shadow:3px 3px 0 #fff,-2px -2px 0 #fff,2px -2px 0 #fff,-2px 2px 0 #fff,0 5px 0 rgba(201,101,11,.3)}
h1 b{color:var(--orange)}
.lead{margin:6px 0 0;color:var(--sub);font-size:14px}
h2{display:flex;align-items:center;gap:8px;font-size:18px;margin:26px 2px 10px}
h2 span{font-size:22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
a.card{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:10px 12px;box-shadow:0 3px 0 var(--line);transition:transform .08s,box-shadow .08s;position:relative}
a.card:hover{transform:translateY(-2px);box-shadow:0 5px 0 var(--line)}
a.card:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.ic{flex:none;width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:28px;background:#fff3dd}
.tx{min-width:0}
.nm{font-weight:800;font-size:16px;line-height:1.3}
.ds{font-size:12px;color:var(--sub);margin-top:2px;line-height:1.4}
.new{position:absolute;top:-8px;right:10px;background:var(--pink);color:#fff;font-size:11px;font-weight:900;border-radius:999px;padding:2px 8px;box-shadow:0 2px 0 #b8456a}
footer{text-align:center;color:var(--sub);font-size:12px;margin-top:30px;line-height:1.7}
</style>
</head>
