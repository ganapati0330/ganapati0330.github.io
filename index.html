<style>
:root{--bg:#0e1a2f;--bg2:#13223d;--card:#14233f;--ink:#fff;--sub:#c9d3e6;--line:rgba(255,255,255,.88);--orange:#f5821f;--orange2:#e0600c;--pink:#ff6b8f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Hiragino Maru Gothic ProN","Hiragino Maru Gothic Pro","BIZ UDPGothic","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif}
body{background:radial-gradient(ellipse at 50% 0,#1a2c4d 0,var(--bg) 60%) fixed}
.wrap{max-width:900px;margin:0 auto;padding:max(10px,env(safe-area-inset-top)) 12px calc(86px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:center;gap:clamp(6px,2.4vw,14px);padding:8px 0 10px;max-width:100%}
.logo{display:flex;align-items:center;gap:.25em;margin:0;font-size:clamp(17px,5.1vw,34px);font-weight:900;letter-spacing:.03em;white-space:nowrap}
.logo svg{width:1.2em;height:1.2em;flex:none}
.slash{width:3px;height:1.6em;background:var(--orange);border-radius:2px;transform:rotate(14deg);flex:none}
.free{font-size:clamp(11px,3.2vw,18px);font-weight:900;font-style:italic;white-space:nowrap;padding-bottom:4px;
  background:linear-gradient(var(--orange),var(--orange)) 0 100%/100% 3px no-repeat;border-radius:2px}
.hero{display:block;width:100%;aspect-ratio:913/323;object-fit:cover;border-radius:14px;box-shadow:0 6px 18px rgba(0,0,0,.4)}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:16px 0 4px}
.tabs button{font:inherit;font-weight:900;font-size:clamp(11.5px,3.4vw,18px);letter-spacing:-.02em;white-space:nowrap;color:#fff;background:transparent;border:2px solid var(--line);border-radius:999px;padding:9px 0;cursor:pointer}
.grid>.ttl{grid-column:1/-1;margin:22px 0 2px}
.tabs button.on{background:linear-gradient(#ff9a3c,var(--orange2));border-color:#ffb877;box-shadow:0 3px 0 #9c3f05}
.ttl{display:flex;align-items:center;gap:10px;margin:16px 0 12px;font-size:clamp(17px,5vw,22px);font-weight:900;white-space:nowrap}
.ttl::before,.ttl::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,transparent,var(--orange))}
.ttl::after{background:linear-gradient(90deg,var(--orange),transparent)}
.ttl svg{width:1.1em;height:1.1em;flex:none}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:720px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{position:relative;display:block;text-decoration:none;color:inherit;background:var(--card);border:2px solid var(--line);border-radius:14px;overflow:hidden;
  box-shadow:0 4px 12px rgba(0,0,0,.35);transition:transform .08s}
.card:active{transform:scale(.97)}
.art{position:relative;aspect-ratio:426/230;overflow:hidden;background:#24375b}
.art img.pic{width:100%;height:100%;object-fit:cover;display:block}
.art .emo{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(38px,12vw,60px);filter:drop-shadow(0 4px 4px rgba(0,0,0,.35))}
.art .face{position:absolute;right:6%;bottom:-8%;width:34%;aspect-ratio:1;border-radius:50%;background:#fff;border:3px solid #fff;object-fit:cover;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.art .paws{position:absolute;inset:0;opacity:.16;background-image:radial-gradient(circle,#fff 0 3px,transparent 4px);background-size:22px 22px}
.cap{padding:8px 10px 10px;border-top:2px solid rgba(255,255,255,.15)}
.nm{font-weight:900;font-size:clamp(15px,4.3vw,20px);line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm.wrap2{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.2}
.ds{font-size:clamp(10.5px,2.9vw,12.5px);color:var(--sub);margin-top:3px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.8em}
.new{position:absolute;left:0;top:0;z-index:2;background:linear-gradient(#ff8a2a,#ec5f0a);color:#fff;font-size:clamp(11px,3.2vw,14px);font-weight:900;letter-spacing:.05em;padding:4px 12px 5px 10px;border-radius:12px 0 14px 0;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.heart{position:absolute;right:8%;top:14%;transform:translate(50%,-50%);z-index:2;width:15%;min-width:32px;max-width:52px;aspect-ratio:1;border:0;border-radius:50%;background:rgba(14,26,47,.55);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.heart svg{width:62%;height:62%}
.heart.on{background:rgba(255,255,255,.92)}
.heart.on path{fill:var(--pink);stroke:var(--pink)}
.empty{grid-column:1/-1;text-align:center;color:var(--sub);padding:34px 10px;line-height:1.8;border:2px dashed rgba(255,255,255,.25);border-radius:14px}
footer{text-align:center;color:#8a99b8;font-size:12px;margin-top:26px;line-height:1.7}
nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:rgba(10,19,36,.96);border-top:1px solid rgba(255,255,255,.12);padding:6px 0 calc(6px + env(safe-area-inset-bottom));backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
nav .in{max-width:900px;margin:0 auto;display:grid;grid-template-columns:1fr auto 1fr auto 1fr auto 1fr;align-items:center}
@media(max-width:520px){nav button{flex-direction:column;gap:1px;font-size:12px;padding:6px 0 7px}nav button svg{width:24px;height:24px}nav i{height:30px}}
#nReload.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
nav i{width:2px;height:26px;background:rgba(255,255,255,.3)}
nav button{font:inherit;font-weight:800;font-size:clamp(14px,4vw,17px);color:#e6ecf7;background:none;border:0;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 0 9px;cursor:pointer;position:relative}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--orange)}
nav button.on::after{content:"";position:absolute;left:18%;right:18%;bottom:0;height:3px;border-radius:2px;background:var(--orange)}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center}
.sheet.show{display:flex}
.sheet .box{background:#fffaf0;color:#3b2a1a;width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));line-height:1.75;font-size:15px;max-height:80vh;overflow:auto}
.sheet h3{margin:0 0 8px;font-size:19px;color:var(--orange2)}
.sheet ul{padding-left:1.2em;margin:6px 0 14px}
.sheet .close{display:block;width:100%;font:inherit;font-weight:900;font-size:16px;color:#fff;background:linear-gradient(#ff9a3c,var(--orange2));border:0;border-radius:999px;padding:12px}
</style>
</head>

</div>
<nav><div class="in">

<div class="sheet" id="help"><div class="box">
  <h3>あそびかた</h3>
  <ul>
    <li>あそびたい ゲームの カードを タッチすると はじまるよ。</li>
    <li>うえの ボタンで「たいせん」「ぼうけん」「あたま」に わけて さがせるよ。「おとうさん」は お父さんの趣味の 道具だよ。</li>
    <li>カードの ♡ を タッチすると「おきにいり」に はいるよ。したの「おきにいり」で すぐ みつかる！</li>

<script>
'use strict';
// [フォルダ, 名前, せつめい, 絵文字, NEW, カテゴリ(vs/adv/brain/other), 顔]
var GAMES=[

 ['futeneko-fighter','フテ猫ファイター','7にんで かくとう！ ド派手な ひっさつわざ！','🥊',1,'vs','kuro'],
 ['futeneko-daisenryaku','フテ猫大戦略','あかりちゃん司令官で ダンボール城を めざせ！','🚩',1,'vs','akari'],
 ['futeneko-othello','フテ猫オセロ','あかりちゃんが コンピュータに ちょうせん！','⚫',1,'vs','akari'],
 ['futeneko-shogi','フテ猫しょうぎ','しょうぎで しょうぶ！','☗',1,'vs','kuro'],
 ['fute-tennis','フテ猫のテニス対決','ともだちと つうしん たいせん！','🎾',0,'vs','fute'],
 ['futeneko-poker','フテ猫ポーカー','ドローポーカーと たいせんモード','🃏',0,'vs','kuro'],
 ['futeneko-rhythm','フテ猫リズム','どうようで リズムゲーム！ 18きょく・CPU＆ふたりで たいけつ・ランキング・ごほうびガチャ','🎵',1,'adv','fute'],
 ['futeneko-piano','フテ猫ピアノ','けんばんで れんしゅう！ かたて・りょうて・MIDIも OK','🎹',1,'adv','akari'],
 ['futeneko-walk','フテ猫ウォーク','ほんとうに あるいた 歩数で 町を めぐろう！','👟',1,'adv','fute'],
 ['futeneko-world','フテ猫ワールド','はたけ・家づくり・まもの・ボス！ みんなで あそぼう','🌍',1,'adv','chap'],
 ['futeneko-td','フテ猫タワーディフェンス','なかまを おいて かつおぶしを まもれ！','🏰',1,'adv','kuro'],
 ['futeneko-runner','フテ猫ランナー','けいさんで なかまを ふやして ロボボスを たおせ！','🪖',1,'adv','chap'],
 ['futeneko-fishing','フテ猫フィッシング','みんなで ふねに のって つりを しよう！','🎣',1,'adv','akari'],
 ['futeneko-craft','フテ猫クラフト','ブロックで じゆうに つくろう！','🧱',1,'adv','chap'],
 ['futeneko','フテ猫クエスト！！！','チャッピーちゃんを すくえ！','🗡️',0,'adv','chap'],
 ['futeneko-jump','フテ猫のジャンプ大冒険','ジャンプで すすめ！','🦘',0,'adv','fute'],
 ['futeneko-jungle','フテ猫の大冒険 ジャングル編','ジャングルを たんけん','🌴',0,'adv','fute'],
 ['futeneko-duo','フテ猫の大冒険 ふたり協力編','ふたりで きょうりょく','🤝',0,'adv','kuro'],
 ['drone-sim','ドローン操縦シミュレーター','10ステージを とびまわれ','🚁',0,'adv','chap'],
 ['nihon-isshu-sugoroku','日本一周 お宝すごろく','47都道府県を めぐろう','🗾',0,'adv','fute'],
 ['hokkaido-sugoroku','北海道 車たび お宝すごろく','車で 北海道を ドライブ','🚗',0,'adv','kuro'],
 ['tokyo23-sugoroku','東京観光 お宝すごろく','23区を めぐろう','🗼',0,'adv','chap'],
 ['shizuoka-sugoroku','静岡県一周 お宝すごろく','35市町を めぐろう','🗻',0,'adv','fute'],
 ['iwata-sugoroku','磐田めぐり お宝すごろく','磐田市を たんけん','🏯',0,'adv','akari'],
 ['futeneko-rensa','フテ猫れんさパズル','4つ そろえて れんさ！ つうしんたいせんも','🔗',1,'brain','chap'],
 ['futeneko-tsunagi','フテ猫つなぎ','おなじキャラを つなげて けそう','🐾',1,'brain','fute'],
 ['futeneko-pitatto','フテ猫 ピタッとパズル','ピースを ピタッと はめよう','🧩',0,'brain','akari'],
 ['futeneko-otasuke','フテ猫のお片付け','にもつを おして かたづけ 36面','📦',0,'brain','fute'],
 ['sudoku','数独','すうじの パズル','🔢',0,'brain','kuro'],
 ['futeneko-otsukai','フテ猫商店街 おつかい大作戦','お金を だして おかいもの！ おつりも けいさん','🛒',1,'brain','akari'],
 ['sansu-battle','さんすうバトル！','フテ猫 vs クロネコさん','➕',0,'brain','fute'],
 ['kanji-battle','漢字バトル','小1〜3の かんじと めいろ だっしゅつ','✏️',0,'brain','kuro'],
 ['futeneko-kotoba','フテ猫のことばパズル','もじを つないで ことばと ぶん','🔤',0,'brain','chap'],
 ['futeneko-english-adventure','えいごアドベンチャー','フテ猫と チャッピーの えいご','🌏',0,'brain','chap'],
 ['chizu-kigou','地図記号バトル！','ちずきごうを おぼえよう','🗾',0,'brain','fute'],
 ['futeneko-daytrade-dojo','フテ猫のデイトレ道場','かぶの しくみを たいけん','📈',0,'brain','kuro'],
 ['cycle-route','サイクルルートプランナー','ロードバイクの ルートマップづくり','🚴',0,'other','fute'],
 ['futeneko-health','フテ猫ヘルスノート','歩数・すいみん・心拍の きろく','⌚',1,'other','fute'],
 ['futeneko-mojiokoshi','フテ猫もじおこし','会議を 録音して 話者ごとに 文字に','🎙️',1,'other','fute']
];
// イラストがある作品（portal-img/フォルダ名.webp）
var ART={'futeneko-rhythm':1,'futeneko-trump':1,'futeneko-fighter':1,'futeneko-daisenryaku':1,'futeneko-othello':1,'futeneko-shogi':1,'fute-tennis':1,'futeneko-fishing':1,'futeneko-runner':1,'futeneko-td':1,'futeneko-tsunagi':1,'futeneko-walk':1,'sansu-battle':1,'futeneko-pitatto':1,'futeneko-otsukai':1,'futeneko-world':1,'futeneko-rensa':1,'hokkaido-sugoroku':1,'iwata-sugoroku':1};
var BG={vs:['#d9452f','#7a1d3a'],adv:['#2f9be0','#1c4f8f'],brain:['#7b5cd6','#36246e'],other:['#2fa67a','#14533f']};
var KEY='futeneko-gc-fav';
var favs={};
try{favs=JSON.parse(localStorage.getItem(KEY)||'{}')||{};}catch(e){favs={};}
function saveFav(){try{localStorage.setItem(KEY,JSON.stringify(favs));}catch(e){}}
var cat='all',favOnly=false;
var root=document.getElementById('list');
function heartBtn(id){
  var b=document.createElement('button');b.className='heart'+(favs[id]?' on':'');b.type='button';
  b.setAttribute('aria-label','おきにいり');
  b.innerHTML='<svg viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-9.3-9.2C1.4 7.8 3.6 4.5 7 4.5c2.1 0 3.6 1.2 5 3 1.4-1.8 2.9-3 5-3 3.4 0 5.6 3.3 4.3 6.8-1.8 4.6-9.3 9.2-9.3 9.2z" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/></svg>';
  b.addEventListener('click',function(ev){
    ev.preventDefault();ev.stopPropagation();
    if(favs[id])delete favs[id];else favs[id]=1;
    saveFav();b.classList.toggle('on',!!favs[id]);
    if(favOnly)render();
  });
  return b;
}
function card(g){
  var a=document.createElement('a');a.className='card';a.href='/'+g[0]+'/';
  var art=document.createElement('div');art.className='art';
  if(ART[g[0]]){
    var im=document.createElement('img');im.className='pic';im.loading='lazy';im.alt='';im.src='portal-img/'+g[0]+'.webp';art.appendChild(im);
  }else{
    var c=BG[g[5]];art.style.background='linear-gradient(135deg,'+c[0]+','+c[1]+')';
    art.innerHTML='<div class="paws"></div><div class="emo"></div><img class="face" alt="" loading="lazy">';
    art.querySelector('.emo').textContent=g[3];
    art.querySelector('.face').src='portal-img/face-'+g[6]+'.webp';
  }
  art.appendChild(heartBtn(g[0]));
  a.appendChild(art);
  var cap=document.createElement('div');cap.className='cap';
  cap.innerHTML='<div class="nm"></div><div class="ds"></div>';
  cap.firstChild.textContent=g[1];cap.lastChild.textContent=g[2];
  a.appendChild(cap);
  if(g[4]){var n=document.createElement('span');n.className='new';n.textContent='NEW';a.appendChild(n);}
  return a;
}
function render(){
  root.innerHTML='';
  var list=GAMES.filter(function(g){
    if(favOnly)return !!favs[g[0]];
    return cat==='all'||g[5]===cat;
  });
  document.getElementById('ttlText').textContent=favOnly?'おきにいりの ゲーム':(cat==='other'?'お父さんの趣味':'あそぶゲームを えらぼう');
  if(!list.length){
    var e=document.createElement('div');e.className='empty';
    e.innerHTML='まだ おきにいりが ないよ。<br>カードの ♡ を タッチしてね！';root.appendChild(e);return;
  }
  // 「すべて」では お父さんの趣味を いちばん下に まとめる
  var split=!favOnly&&cat==='all';
  list.forEach(function(g){if(!split||g[5]!=='other')root.appendChild(card(g));});
  if(split){
    var h=document.createElement('div');h.className='ttl';
    h.innerHTML='<svg fill="#f5821f"><use href="#paw"/></svg><span>お父さんの趣味</span><svg fill="#f5821f"><use href="#paw"/></svg>';
    root.appendChild(h);
    list.forEach(function(g){if(g[5]==='other')root.appendChild(card(g));});
  }
  fitNames();
}
// ながい なまえは 1行に おさまるまで 文字を 小さくする
function fitNames(){
  Array.prototype.forEach.call(root.querySelectorAll('.nm'),function(el){
    el.style.fontSize='';el.classList.remove('wrap2');
    var fs=parseFloat(getComputedStyle(el).fontSize);
    while(el.scrollWidth>el.clientWidth&&fs>13){fs-=0.5;el.style.fontSize=fs+'px';}
    if(el.scrollWidth>el.clientWidth)el.classList.add('wrap2');
  });
}
var rzT=0;window.addEventListener('resize',function(){clearTimeout(rzT);rzT=setTimeout(fitNames,150);});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitNames);
var tabs=document.getElementById('tabs');
tabs.addEventListener('click',function(ev){
  var b=ev.target.closest('button');if(!b)return;
  cat=b.getAttribute('data-c');favOnly=false;setNav('nHome');
  Array.prototype.forEach.call(tabs.children,function(x){x.classList.toggle('on',x===b);});
  render();
});
function setNav(id){['nHome','nFav','nHelp'].forEach(function(k){document.getElementById(k).classList.toggle('on',k===id);});}
document.getElementById('nHome').addEventListener('click',function(){favOnly=false;setNav('nHome');tabs.style.display='';render();window.scrollTo(0,0);});
document.getElementById('nFav').addEventListener('click',function(){favOnly=true;setNav('nFav');tabs.style.display='none';render();window.scrollTo(0,document.querySelector('.ttl').offsetTop-10);});
var help=document.getElementById('help');
document.getElementById('nHelp').addEventListener('click',function(){help.classList.add('show');});
function closeHelp(){help.classList.remove('show');}
document.getElementById('helpClose').addEventListener('click',closeHelp);
help.addEventListener('click',function(ev){if(ev.target===help)closeHelp();});
// こうしん：キャッシュを使わず さいしんばんを よみなおす
document.getElementById('nReload').addEventListener('click',function(){
  var b=this;b.classList.add('spin');
  setTimeout(function(){location.replace(location.pathname+'?r='+Date.now());},250);
});
// ?r= を アドレスから けしておく
if(/[?&]r=\d+/.test(location.search)){try{history.replaceState(null,'',location.pathname);}catch(e){}}
render();
</script>
