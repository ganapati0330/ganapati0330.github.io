/* ホーム：たてのスマホで 1がめんに おさめる／よこでは せつめいを みぎに */
#home{overflow:hidden;height:100%}
#home .topbar{flex:0 0 auto;position:relative;padding-left:max(10px,env(safe-area-inset-left));padding-right:max(10px,env(safe-area-inset-right))}
#btnFull{font-size:17px}
#home .yardbox{flex:1 1 auto;min-height:140px;display:flex;flex-direction:column;max-width:none}
#home #yard{flex:1 1 0;height:auto;min-height:0}
#home .yardbar{flex:0 0 auto;padding:4px 6px;gap:4px;padding-left:max(6px,env(safe-area-inset-left));padding-bottom:max(4px,env(safe-area-inset-bottom))}
#home .yardbar button{padding:5px 8px;font-size:12px}
#homeWrap{flex:0 1 auto;display:flex;flex-direction:column;overflow:hidden;max-height:66%;padding:6px 8px;padding-bottom:max(6px,env(safe-area-inset-bottom));max-width:none}
#homeWrap .card{padding:6px 10px;margin-bottom:6px;border-radius:16px;box-shadow:0 3px 0 #d69a4a}
#homeWrap .dname{font-size:17px;margin:0;line-height:1.2}
#homeWrap .dsub{font-size:11px;line-height:1.3}
.hinfo{flex:0 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
#homeWrap .acts{flex:0 0 auto;padding-top:2px}
.eggi{height:44px;display:block;margin:0 auto}
.eggnote{font-size:11px;color:#8a6f52}
#homeWrap .eggi{height:30px}
#homeWrap .eggnote{font-size:10px}
#homeWrap .card>div:first-child{font-size:12px!important;margin-bottom:2px!important}
#home .yardbar{position:relative}
#home .yardbar .yhint{position:absolute;left:6px;right:6px;bottom:calc(100% + 4px);background:rgba(40,25,70,.72);border-radius:10px;padding:3px 8px;font-size:10px;line-height:1.35;pointer-events:none;min-width:0;flex:none}
.bars3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
#homeWrap .blbl{font-size:10px;margin-top:2px}
#homeWrap .bar{height:9px;margin:1px 0}
#homeWrap .stats{margin-top:4px;gap:4px;font-size:11px}
#homeWrap .stats div{padding:2px 2px}
#homeWrap .stats b{font-size:14px}
#homeWrap .stats em{font-size:8px;line-height:1.1}
#homeWrap .chips{padding:0 0 2px}
#homeWrap .chips button{width:58px;font-size:10px;padding:2px;border-width:2px}
#homeWrap .chips canvas{width:46px;height:35px}
#homeWrap .acts{gap:5px}
#homeWrap .act{padding:4px 2px;font-size:12px;border-radius:12px;box-shadow:0 3px 0 rgba(0,0,0,.25)}
#homeWrap .act span{font-size:19px;line-height:1.1}
#homeWrap .act small{font-size:9px}
#homeWrap .empty{padding:6px}
#homeWrap .empty img{height:80px}
@media (max-height:700px) and (orientation:portrait){#homeWrap .act small{display:none}#homeWrap .dsub+.dsub{display:none}}
@media (orientation:landscape) and (min-width:560px){
  #home.on{display:grid;grid-template-columns:minmax(0,1fr) clamp(300px,40vw,420px);grid-template-rows:auto minmax(0,1fr)}
  #home .topbar{grid-column:1/-1}
  #home .yardbox{grid-column:1;grid-row:2;min-height:0}
  #homeWrap{grid-column:2;grid-row:2;max-height:none;height:100%;min-height:0;border-left:3px solid #d69a4a;padding-right:max(8px,env(safe-area-inset-right))}
  #homeWrap .acts{grid-template-columns:repeat(4,1fr)}
}
@media (orientation:landscape) and (min-width:560px) and (max-height:480px){#homeWrap .act small{display:none}#homeWrap .act span{font-size:17px}}

.yardbox{max-width:900px;margin:0 auto;width:100%;position:relative}
#yard{display:block;width:100%;height:min(52vh,420px);touch-action:pan-y;background:#8cc860}
.yardbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 8px;background:#5a3a8f}
.yardbar button{background:#fff3;color:#fff;border-radius:12px;padding:7px 10px;font-weight:bold;font-size:13px;white-space:nowrap}
.yardbar button.go{background:#3fa858}
.yardbar .yhint{color:#fff;font-size:11px;opacity:.9;flex:1;min-width:140px}
.tabs{display:flex;gap:4px;margin:6px 0}
.tabs button{flex:1;padding:8px 2px;border-radius:10px;background:#f4e6cf;font-weight:bold;font-size:13px;color:#3a2a1a}
.tabs button.on{background:#e8812a;color:#fff}
.dname{font-size:22px;font-weight:bold;margin:6px 0 0}
.dsub{font-size:13px;color:#8a6f52}
.bar{height:14px;background:#e9dcc8;border-radius:8px;overflow:hidden;position:relative;margin:3px 0}
.bar i{display:block;height:100%;border-radius:8px;transition:width .3s}
.bar b{position:absolute;inset:0;font-size:10px;line-height:14px;text-align:center;color:#3a2a1a}
.blbl{display:flex;justify-content:space-between;font-size:12px;font-weight:bold;margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.stats div{background:#f4e6cf;border-radius:10px;text-align:center;padding:4px 2px;font-size:11px;color:#8a6f52}
.stats b{display:block;font-size:18px;color:#3a2a1a}
.stats em{font-style:normal;color:#e8582a;font-size:10px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px}
.chips button{flex:0 0 auto;width:74px;border-radius:14px;background:#f4e6cf;padding:4px;font-size:11px;font-weight:bold;color:#3a2a1a;border:3px solid transparent}
.chips button.sel{border-color:#e8582a;background:#ffe2c0}
.chips canvas{width:60px;height:46px;display:block;margin:0 auto}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.act{border-radius:16px;padding:8px 2px;font-size:13px;font-weight:bold;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.25);line-height:1.25}
.act span{display:block;font-size:26px}
.act small{display:block;font-size:10px;opacity:.9}
.act:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.act.lock{filter:grayscale(.9) brightness(.85)}
.a1{background:#e8812a}.a2{background:#3fa858}.a3{background:#e05a7a}.a4{background:#2f7fe0}.a5{background:#c0392b}.a6{background:#7b5cd6}.a7{background:#d4a017}.a8{background:#5a8a9a}
.empty{text-align:center;padding:16px 8px;font-weight:bold}
.empty img{height:130px}
/* ステージ（キャンバス） */
#stage{background:#000}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.hudTop{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:6px;padding:6px 8px;padding-top:max(6px,env(safe-area-inset-top));pointer-events:none;color:#fff;font-weight:bold;font-size:14px;text-shadow:0 1px 2px #000}
.hudTop>*{pointer-events:auto}
.hbtn{white-space:nowrap;background:rgba(30,20,60,.75);color:#fff;border-radius:14px;padding:7px 12px;font-size:14px;font-weight:bold;border:2px solid #fff6}
.hudBot{position:absolute;left:0;right:0;bottom:0;padding:8px;flex-wrap:wrap;padding-bottom:max(8px,env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center;align-items:flex-end;pointer-events:none}
.hudBot>*{pointer-events:auto}
.hint{position:absolute;left:50%;transform:translateX(-50%);bottom:max(70px,calc(env(safe-area-inset-bottom) + 62px));background:rgba(30,20,60,.7);color:#fff;border-radius:14px;padding:5px 12px;font-size:13px;font-weight:bold;white-space:nowrap;pointer-events:none}
.mini{flex:1;min-width:0}
.mini .bar{height:11px;background:#0005;margin:2px 0}
.mini .bar b{color:#fff;font-size:9px;line-height:11px;text-shadow:0 1px 1px #000}
.mini .lbl{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* バトル */
.bpanel{width:100%;max-width:620px;background:rgba(255,250,240,.96);border-radius:18px;padding:8px;color:#3a2a1a}
.bmsg{min-height:44px;font-size:15px;font-weight:bold;padding:4px 6px;line-height:1.4}
.bmoves{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.bmoves button{padding:10px 4px;border-radius:12px;font-size:15px;font-weight:bold;color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.bmoves button small{display:block;font-size:10px;opacity:.9}
.bmoves button:disabled{filter:grayscale(1) brightness(.8)}
/* モーダル */
#modal{position:fixed;inset:0;background:rgba(10,5,25,.6);display:none;align-items:center;justify-content:center;z-index:3000;padding:14px}
#modal.on{display:flex}
.mbox{background:#fffaf0;border-radius:22px;max-width:440px;width:100%;max-height:88vh;overflow-y:auto;padding:16px;text-align:center;box-shadow:0 6px 0 #c58a3a;color:#3a2a1a}
.mbox h2{margin:0 0 8px;font-size:21px}
.mbox p{margin:6px 0;font-size:15px;line-height:1.5}
.mbtns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.mbtns button{flex:1 1 40%;padding:12px 8px;border-radius:14px;font-size:16px;font-weight:bold;color:#fff;background:#e8812a;box-shadow:0 4px 0 #9a5010}
.mbtns button.sub{background:#9b93ad;box-shadow:0 4px 0 #5a5070}
.mbtns button.go{background:#3fa858;box-shadow:0 4px 0 #1f6a30}
#mdCv{width:220px;height:170px;display:block;margin:0 auto;border-radius:16px;background:radial-gradient(circle,#fff6d8,#ffe0a0)}
.mbox input{font-size:20px;padding:8px 12px;border-radius:12px;border:3px solid #e8812a;width:80%;text-align:center;font-family:inherit}
.list{display:flex;flex-direction:column;gap:6px;text-align:left}
.row{display:flex;align-items:center;gap:8px;background:#f4e6cf;border-radius:12px;padding:8px 10px;font-weight:bold}
.row .e{font-size:26px}
.row .n{flex:1;font-size:15px}
.row .n small{display:block;font-weight:normal;font-size:11px;color:#8a6f52}
.row button{background:#e8812a;color:#fff;border-radius:10px;padding:8px 12px;font-weight:bold;font-size:14px}
.row button:disabled{background:#bbb}
.row.lockrow{opacity:.55}
.dex{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.dex div{background:#f4e6cf;border-radius:12px;padding:4px;font-size:11px;font-weight:bold}
.dex canvas{width:100%;height:64px;display:block}
.toast{position:fixed;left:50%;top:18%;transform:translateX(-50%);background:linear-gradient(#ffe36a,#ffb347);color:#5a2a00;font-weight:bold;font-size:22px;padding:12px 22px;border-radius:20px;box-shadow:0 5px 0 #b86a10;z-index:3100;pointer-events:none;text-align:center;animation:pop 2.4s forwards;white-space:nowrap}
.toast small{display:block;font-size:13px}
@keyframes pop{0%{opacity:0;transform:translateX(-50%) scale(.5)}12%{opacity:1;transform:translateX(-50%) scale(1.1)}20%{transform:translateX(-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-30px)}}
.ver{font-size:11px;opacity:.6;margin-top:10px}
.storyimg{width:100%;max-width:400px;aspect-ratio:4/3;object-fit:cover;border-radius:14px;display:block;margin:0 auto;box-shadow:0 3px 10px rgba(0,0,0,.25)}
/* ドラゴンさがし（ちず） */
#mapScr{background:#e8e0cc}
#dmap{position:absolute;inset:0;background:#e8e0cc;z-index:1}
.mtop{position:absolute;left:0;right:0;top:0;z-index:2000;display:flex;align-items:center;gap:8px;padding:8px;padding-top:max(8px,env(safe-area-inset-top));pointer-events:none}
.mtop>*{pointer-events:auto}
.mtop .mttl{flex:1;font-weight:bold;font-size:16px;color:#fff;text-shadow:0 1px 3px #000,0 0 6px #000}
.mtop .pill2{background:rgba(30,20,60,.8);color:#fff;border-radius:16px;padding:6px 12px;font-weight:bold;font-size:15px}
.leaflet-top.leaflet-right{top:52px}
.mcard{position:absolute;left:8px;right:8px;bottom:0;z-index:2000;max-width:560px;margin:0 auto;background:#fffaf0;border-radius:18px 18px 0 0;padding:8px 10px;padding-bottom:max(10px,env(safe-area-inset-bottom));box-shadow:0 -3px 12px rgba(0,0,0,.25);font-size:14px}
.mrow{padding:5px 4px;border-bottom:1px dashed #e6cfa3;line-height:1.4}
.mrow small{color:#8a6f52}
.mrow.warn{color:#c0392b}
.mbtn2{display:flex;gap:6px;margin-top:6px}
.mbtn2 button{flex:1;padding:9px 2px;border-radius:12px;background:#f4e6cf;font-weight:bold;font-size:13px;color:#3a2a1a}
.mbtn2 button.on{background:#3fa858;color:#fff}
.sbtn2{margin-top:4px;padding:6px 14px;border-radius:10px;background:#e8812a;color:#fff;font-weight:bold}
.mfoot{font-size:11px;color:#8a6f52;text-align:center;margin-top:4px}
.here{position:absolute;left:49px;bottom:-6px;width:22px;height:22px;border-radius:50%;background:#2f7fe8;border:4px solid #fff;box-shadow:0 0 0 10px #2f7fe833,0 1px 4px #0006}
.meic{position:relative;width:120px;height:96px}
.meic .mk{position:absolute;left:44px;bottom:2px;width:76px;height:76px;background-repeat:no-repeat}
.meic .md{position:absolute;left:-6px;bottom:10px;width:78px}
.ppin{position:relative;width:54px;height:62px}
.ppin .pb{position:absolute;left:5px;top:0;width:44px;height:44px;border-radius:50%;background:#fffaf0;border:3px solid #e8743b;box-shadow:0 2px 4px #0005;display:flex;align-items:center;justify-content:center;font-size:24px}
.ppin.k-dragon .pb{border-color:#7b5cd6;background:#f3edff}
.ppin.k-coin .pb{border-color:#d99a1a}
.ppin .ex{position:absolute;right:-6px;top:-6px;width:20px;height:20px;border-radius:50%;background:#c8324a;color:#fff;font-size:13px;line-height:20px;text-align:center;animation:pulse 1.2s infinite}
.ppin .ok{position:absolute;right:-5px;top:-5px;width:20px;height:20px;border-radius:50%;background:#5c9b45;color:#fff;font-size:13px;line-height:20px;text-align:center}
.ppin.got .pb{filter:grayscale(.8);opacity:.6}
.ppin:not(.got) .pb{animation:hop 1.4s infinite}
.ppin .lb{position:absolute;left:50%;top:46px;transform:translateX(-50%);white-space:nowrap;max-width:140px;overflow:hidden;text-overflow:ellipsis;font-size:11px;font-weight:900;background:#fffaf0e6;border-radius:8px;padding:1px 6px;border:1.5px solid #e6cfa3;color:#3a2a1a}
.pcoin{display:inline-block;width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe680,#f0b324 60%,#c98a10);box-shadow:inset 0 0 0 3px #d99a1a}
@media (max-height:500px) and (orientation:landscape){.mcard{left:auto;right:8px;top:52px;bottom:8px;width:300px;margin:0;border-radius:16px;overflow-y:auto;font-size:13px}.leaflet-top.leaflet-right{right:316px}}
.meic.fl .mk{left:2px}
.meic.fl .md{left:50px;transform:scaleX(-1)}
.leaflet-top.leaflet-left{top:52px}
.leaflet-touch .leaflet-bar a{width:38px;height:38px;line-height:38px;font-size:22px}
.dpad{position:absolute;right:10px;bottom:240px;z-index:2001;width:150px;height:150px;touch-action:none}
.dpad button{position:absolute;width:52px;height:52px;border-radius:14px;background:rgba(30,20,60,.72);color:#fff;font-size:22px;border:2px solid #fff8;box-shadow:0 3px 0 rgba(0,0,0,.3);touch-action:none;-webkit-user-select:none;user-select:none}
.dpad button.on{background:#e8812a}
.dpad .du{left:49px;top:0}.dpad .dd{left:49px;bottom:0}.dpad .dl{left:0;top:49px}.dpad .dr{right:0;top:49px}
@media (max-height:500px) and (orientation:landscape){.dpad{left:10px;right:auto;bottom:10px!important}}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
</style>
</head>
<body>

<!-- タイトル -->
<section id="title" class="screen on">
  <div class="tbg"></div>
  <div class="tbox" id="tbox">
    <img src="dr/menu.webp" class="tmenu" alt="フテ猫ドラゴン どらごんを そだてよう！">
    <button class="hz" id="tContinue" style="left:14.5%;top:50.5%;width:70%;height:9.5%" aria-label="つづきから"></button>
    <button class="hz" id="tNew" style="left:14.5%;top:61.6%;width:70%;height:9.2%" aria-label="はじめから"></button>
    <button class="hz" id="tDex" style="left:17%;top:72.8%;width:21%;height:9.6%" aria-label="ずかん"></button>
    <button class="hz" id="tRoom" style="left:40%;top:72.8%;width:21%;height:9.6%" aria-label="おへや"></button>
    <button class="hz" id="tGear" style="left:63%;top:72.8%;width:21%;height:9.6%" aria-label="せってい"></button>
    <div class="tver" id="tver">ver <span id="verT"></span> © 泉正道 / フテ猫実行委員会</div>
  </div>
  <canvas id="titleCv" style="display:none"></canvas>
  <div id="titleMain" style="display:none"></div>
</section>

<!-- ホーム（ドラゴンこや） -->
<section id="home" class="screen">
  <div class="topbar">
    <div class="ttl">🐉 ドラゴンこや</div>
    <div class="pill">🪙 <span id="hCoin">0</span></div>
    <div class="pill">👣 <span id="hPow">0</span></div>
    <button class="gear" id="btnFull" title="ぜんがめん">⛶</button><button class="gear" id="btnGear">⚙</button>
  </div>
  <div class="yardbox"><canvas id="yard"></canvas><div id="yardBar" class="yardbar"></div></div>
  <div class="wrap" id="homeWrap"></div>
</section>

<!-- キャンバスのシーン -->
<section id="stage" class="screen">
  <canvas id="cv"></canvas>
  <div class="hudTop" id="hudTop"></div>
  <div class="hudBot" id="hudBot"></div>
  <div class="hint" id="hint" style="display:none"></div>
</section>

<!-- ドラゴンさがし（ほんとうの ちず） -->
<section id="mapScr" class="screen">
  <div id="dmap"></div>
  <div class="mtop"><button class="hbtn" id="mBack">← こやへ</button><div class="mttl">🗺️ ドラゴンさがし</div><div class="pill2">🔎 きょう <span id="mSteps">0</span></div></div>
  <div class="dpad" id="dpad"><button data-k="ArrowUp" class="du">▲</button><button data-k="ArrowLeft" class="dl">◀</button><button data-k="ArrowRight" class="dr">▶</button><button data-k="ArrowDown" class="dd">▼</button></div>
  <div class="mcard" id="mCard"></div>
</section>

<div id="modal"><div class="mbox" id="mbox"></div></div>

};

function drawWing(c,k,st,ang,fill,edge){
  const ws=k*(0.3+st*0.16);
  c.save();c.translate(-k*0.04,-k*0.62);c.rotate(-0.35-ang);
  c.fillStyle=fill;c.strokeStyle=edge;c.lineWidth=Math.max(1,k*0.025);c.lineJoin='round';
  c.beginPath();c.moveTo(0,0);c.lineTo(-ws*0.1,-ws);
  c.quadraticCurveTo(-ws*0.32,-ws*0.7,-ws*0.55,-ws*0.86);
  c.quadraticCurveTo(-ws*0.66,-ws*0.5,-ws*0.95,-ws*0.5);
  c.quadraticCurveTo(-ws*0.6,-ws*0.2,-ws*0.4,ws*0.06);
  c.closePath();c.fill();c.stroke();
  c.beginPath();c.moveTo(0,0);c.lineTo(-ws*0.55,-ws*0.86);c.moveTo(0,0);c.lineTo(-ws*0.95,-ws*0.5);c.stroke();
  c.restore();
}
function drawDragonVec(c,x,y,size,spId,lv,t,face,o){
  o=o||{};
  const S=SP[spId]||SP.fire, st=stageOf(lv);
  const k=size*(0.62+st*0.14);
  c.save();c.translate(x,y);
  const fly=!!o.fly, bob=fly?Math.sin(t*5)*k*0.06:0;
  if(o.shadow!==false){c.fillStyle='rgba(0,0,0,.18)';c.beginPath();c.ellipse(0,0,k*0.42*(fly?0.75:1),k*0.07,0,0,7);c.fill();}
  if(face<0)c.scale(-1,1);
  c.translate(0,bob-(fly?k*(o.alt===undefined?0.35:o.alt):0));
  if(o.squash){c.scale(1+o.squash*0.15,1-o.squash*0.15);}
  let col1=S.c1,col2=S.c2,bel=S.belly,wing=S.wing,horn=S.horn;
  if(S.rainbow){const h=(t*70)%360;col1='hsl('+h+',85%,65%)';col2='hsl('+((h+50)%360)+',65%,42%)';wing='hsl('+((h+180)%360)+',90%,72%)';}
  if(o.flash){col1=col2=bel=wing=horn='#ffffff';}
  const flap=fly?Math.sin(t*11)*0.55:Math.sin(t*2.5)*0.12;
  c.lineJoin='round';c.lineCap='round';
  // しっぽ
  const tw=Math.sin(t*3)*k*0.06;
  c.fillStyle=col1;c.strokeStyle=col2;c.lineWidth=Math.max(1,k*0.03);
  c.beginPath();c.moveTo(-k*0.25,-k*0.5);c.quadraticCurveTo(-k*0.72,-k*0.42+tw,-k*0.86,-k*0.68+tw*1.5);
  c.quadraticCurveTo(-k*0.62,-k*0.2,-k*0.18,-k*0.18);c.closePath();c.fill();c.stroke();
  const tx=-k*0.86,ty=-k*0.68+tw*1.5;
  c.fillStyle=col2;c.beginPath();c.moveTo(tx-k*0.02,ty-k*0.12);c.lineTo(tx-k*0.1,ty+k*0.04);c.lineTo(tx+k*0.08,ty+k*0.05);c.closePath();c.fill();
  // うしろの つばさ
  c.globalAlpha=0.8;drawWing(c,k,st,flap+0.25,wing,col2);c.globalAlpha=1;
  // うしろあし
  c.fillStyle=col2;
  c.beginPath();c.ellipse(-k*0.16,-k*0.08,k*0.1,k*0.08,0,0,7);c.fill();
  // からだ
  c.fillStyle=col1;c.strokeStyle=col2;
  c.beginPath();c.ellipse(0,-k*0.42,k*0.37,k*0.33,0,0,7);c.fill();c.stroke();
  // せなかの トゲ
  c.fillStyle=col2;
  const ns=2+st;
  for(let i=0;i<ns;i++){const a=Math.PI*(1.18+i*(0.42/ns));const px=Math.cos(a)*k*0.36,py=-k*0.42+Math.sin(a)*k*0.32;
    c.beginPath();c.moveTo(px-k*0.05,py+k*0.03);c.lineTo(px+Math.cos(a)*k*0.1,py+Math.sin(a)*k*0.1);c.lineTo(px+k*0.05,py+k*0.02);c.closePath();c.fill();}
  // おなか
  c.fillStyle=bel;c.beginPath();c.ellipse(k*0.12,-k*0.36,k*0.21,k*0.24,0,0,7);c.fill();
  c.strokeStyle='rgba(0,0,0,.1)';c.lineWidth=Math.max(1,k*0.02);
  for(let i=0;i<3;i++){c.beginPath();c.moveTo(k*-0.02,-k*(0.24+i*0.09));c.quadraticCurveTo(k*0.12,-k*(0.2+i*0.09),k*0.27,-k*(0.26+i*0.09));c.stroke();}
  // まえあし
  c.fillStyle=col2;
  const leg=fly?k*0.05:0;
  c.beginPath();c.ellipse(k*0.17,-k*0.07+leg,k*0.1,k*0.075,0,0,7);c.fill();
  c.fillStyle=col1;c.beginPath();c.ellipse(k*0.27,-k*0.38,k*0.07,k*0.05,0.6,0,7);c.fill();
  // くび と あたま
  const hr=k*(0.37-st*0.035), hx=k*0.3, hy=-k*(0.78+st*0.05)-(o.headUp||0)*k*0.05;
  c.fillStyle=col1;c.strokeStyle=col2;c.lineWidth=Math.max(1,k*0.03);
  c.beginPath();c.ellipse(k*0.2,-k*0.62,k*0.15,k*0.2,0.5,0,7);c.fill();
  // つの
  c.fillStyle=horn;c.strokeStyle=col2;
  const hl=k*(0.08+st*0.07);
  for(let i=0;i<2;i++){const bx=hx-hr*(0.35+i*0.3),by=hy-hr*0.75+i*hr*0.1;
    c.beginPath();c.moveTo(bx-hr*0.13,by+hr*0.1);c.quadraticCurveTo(bx-hl*0.6,by-hl*0.6,bx-hl*1.1,by-hl);c.quadraticCurveTo(bx-hl*0.2,by-hl*0.2,bx+hr*0.13,by+hr*0.05);c.closePath();c.fill();c.stroke();}
  c.fillStyle=col1;
  c.beginPath();c.arc(hx,hy,hr,0,7);c.fill();c.stroke();
  // はな
  c.fillStyle=col1;c.beginPath();c.ellipse(hx+hr*0.72,hy+hr*0.28,hr*0.5,hr*0.38,0.1,0,7);c.fill();c.stroke();
  c.fillStyle=col2;c.beginPath();c.arc(hx+hr*1.0,hy+hr*0.12,hr*0.06,0,7);c.fill();
  // 口
  c.strokeStyle=col2;c.lineWidth=Math.max(1,k*0.022);
  if(o.open){c.fillStyle='#7a1a2a';c.beginPath();c.ellipse(hx+hr*0.82,hy+hr*0.5,hr*0.28,hr*0.16,0,0,7);c.fill();}
  else{c.beginPath();c.arc(hx+hr*0.7,hy+hr*0.38,hr*0.22,0.3,2.2);c.stroke();}
  // ほっぺ
  if(st<=1){c.fillStyle='rgba(255,120,140,.35)';c.beginPath();c.ellipse(hx+hr*0.35,hy+hr*0.42,hr*0.17,hr*0.1,0,0,7);c.fill();}
  // め
  const ex=hx+hr*0.2,ey=hy-hr*0.08,er=hr*(st===0?0.32:0.27);
  const blink=(t%3.9)<0.12&&!o.flash;
  if(o.happy){c.strokeStyle='#2a1a10';c.lineWidth=Math.max(1.5,k*0.035);c.beginPath();c.arc(ex,ey+er*0.3,er*0.75,Math.PI*1.15,Math.PI*1.85);c.stroke();}
  else if(o.sad||blink||o.sleep){c.strokeStyle='#2a1a10';c.lineWidth=Math.max(1.5,k*0.03);c.beginPath();c.moveTo(ex-er*0.7,ey+(o.sad?-er*0.2:0));c.lineTo(ex+er*0.7,ey+(o.sad?er*0.25:0));c.stroke();}
  else{
    c.fillStyle='#fff';c.beginPath();c.ellipse(ex,ey,er,er*1.2,0,0,7);c.fill();
    c.fillStyle=S.eye;c.beginPath();c.ellipse(ex+er*0.22,ey+er*0.1,er*0.68,er*0.85,0,0,7);c.fill();
    c.fillStyle='#160a10';c.beginPath();c.ellipse(ex+er*0.28,ey+er*0.12,er*0.38,er*0.52,0,0,7);c.fill();
    c.fillStyle='#fff';c.beginPath();c.arc(ex+er*0.08,ey-er*0.25,er*0.24,0,7);c.fill();
    c.beginPath();c.arc(ex+er*0.45,ey+er*0.38,er*0.1,0,7);c.fill();
  }
  // まえの つばさ
  drawWing(c,k,st,flap,wing,col2);
  if(o.sleep){c.fillStyle='#fff';c.font='bold '+Math.round(k*0.22)+'px sans-serif';c.fillText('Z',hx+hr*0.6,hy-hr*1.2-Math.sin(t*2)*k*0.05);}
  c.restore();
}

/* ===== フテ猫ワールドの ドラゴンの え（4×2コマの シート）=====
   baby：0たつ 1,2あるく 3くち 4たべる 5よろこぶ 6ねる 7おどろく
   kid ：0たつ 1,2あるく 3ふせ 4ブレス 5はばたく 6ひくい 7すわる

const DSHEET={};
const HAS_FLY={fire:1,ice:1,earth:1,water:1,light:1,dark:1,rainbow:1,wind:1,thunder:1};
function dsheet(sp,st){
  const k=sp+'_'+st;let im=DSHEET[k];

function drawDragon(c,x,y,size,spId,lv,t,face,o){
  o=o||{};

    const cw=rim.naturalWidth/4,ch=rim.naturalHeight/2,f=o.rf,w=size*(st===0?1.15:st===1?1.35:1.6),h=w*ch/cw;
    c.save();c.translate(x,y);if(face<0)c.scale(-1,1);

    c.drawImage(rim,(f%4)*cw,Math.floor(f/4)*ch,cw,ch,-w/2,-h*0.83,w,h);c.restore();return;}}
  const fly=!!o.fly;
  let im=null,f=0,isFly=false;
  if(fly&&st>=2&&HAS_FLY[spId]){im=dsheet(spId,'fly');if(im){isFly=true;f=Math.floor(t*10)%8;}}
  if(!im){im=dsheet(spId,sheet);if(!im)return drawDragonVec(c,x,y,size,spId,lv,t,face,o);
    if(sheet==='baby'){f=o.open?3:o.sleep?6:o.sad?6:o.happy?(Math.floor(t*4)%2?5:0):o.surprise?7:o.eat?4:(o.walk||fly)?(Math.floor(t*7)%2?1:2):0;}
    else{f=o.open?4:o.sleep?7:o.sad?3:o.happy?7:fly?(Math.floor(t*6)%2?5:6):o.walk?(Math.floor(t*7)%2?1:2):0;
      if(sheet==='kid'&&fly)f=5;}

  if(o.squash)c.scale(1+o.squash*0.15,1-o.squash*0.15);

  c.restore();

  const t0=AC.currentTime+(delay||0);
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f,t0);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t0+dur);
  g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(vol||0.15,t0+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g);g.connect(master);o.start(t0);o.stop(t0+dur+0.02);
}

}

let bgmEl=null,bgmSrc=null,bgmGain=null;
function fileBgm(src){
  if(!src){if(bgmEl){bgmEl.pause();}return;}
  if(!AC)return;
  if(!bgmEl){bgmEl=new Audio();bgmEl.loop=true;bgmEl.preload='auto';bgmEl.setAttribute('playsinline','');
    try{bgmSrc=AC.createMediaElementSource(bgmEl);bgmGain=AC.createGain();bgmGain.gain.value=0.55;bgmSrc.connect(bgmGain);bgmGain.connect(master);}catch(e){bgmEl.volume=0.5;}}
  if(!bgmEl.src.endsWith(src)){
    if(bgmEl.src){const k=bgmEl.src.split('/').pop();BGM_POS[k]=bgmEl.currentTime;}
    bgmEl.src=src;
    const k=src.split('/').pop();
    if(k==='main.mp3'&&BGM_POS[k]){const t=BGM_POS[k];bgmEl.addEventListener('loadedmetadata',()=>{try{bgmEl.currentTime=t;}catch(e){}},{once:true});}
  }
  const p=bgmEl.play();if(p&&p.catch)p.catch(()=>{});
}
function bgm(name){
  if(bgmName===name){if(FILE_BGM[name]&&bgmEl&&bgmEl.paused&&!document.hidden)fileBgm(FILE_BGM[name]);return;}
  bgmName=name;bgmStep=0;
  if(bgmTimer){clearInterval(bgmTimer);bgmTimer=null;}
  if(FILE_BGM[name]){fileBgm(FILE_BGM[name]);return;}
  fileBgm(null);
  if(!name||!AC)return;
  bgmNext=AC.currentTime+0.1;
  bgmTimer=setInterval(()=>{
    const s=SONGS[bgmName];if(!s||!AC)return;
    const st=60/s.bpm/2;
    while(bgmNext<AC.currentTime+0.25){
      const d=bgmNext-AC.currentTime;
      const m=s.m[bgmStep%s.m.length];if(m)tone(mf(m),st*0.9,'square',0.035,0,d);
      if(bgmStep%2===0){const b=s.b[(bgmStep/2)%s.b.length];if(b)tone(mf(b),st*1.8,'triangle',0.07,0,d);}
      bgmStep++;bgmNext+=st;
    }
  },60);
}

const MENU_AR=941/1672;
function fitTitle(){
  const b=$('tbox');if(!b)return;const W=window.innerWidth,H=window.innerHeight,ar=W/H;
  let w,h;
  if(ar>=0.40&&ar<MENU_AR){h=H;w=H*MENU_AR;}           // たかさに あわせる（よこを すこし きる）
  else if(ar<0.40){w=W/0.74;h=w/MENU_AR;}               // ほそながい がめん：ボタンが きれない ところまで
  else{h=H;w=H*MENU_AR;}                                 // よこひろ：ぜんたいを みせる
  if(w>W/0.72){w=W/0.72;h=w/MENU_AR;}
  b.style.width=w+'px';b.style.height=h+'px';
  const fs=Math.max(9,w*0.024);$('tver').style.fontSize=fs+'px';$('tver').style.lineHeight=(h*0.0235)+'px';
}

function routeTo(e,x,y){

  if(sideOf(e.x)!==sideOf(p.x)){const dy=(DOOR_R[0]+1)*TS;path.push({x:(sideOf(e.x)?WALL_C+1.4:WALL_C-0.4)*TS,y:dy},{x:(sideOf(e.x)?WALL_C-0.4:WALL_C+1.4)*TS,y:dy});}
  path.push(p);e.path=path;
}
function moveEnt(e,dt,sp){
  if(!e.path.length){e.mv=false;return true;}
  const t=e.path[0],dx=t.x-e.x,dy=t.y-e.y,d=Math.hypot(dx,dy);
  if(d<2){e.path.shift();if(!e.path.length){e.mv=false;return true;}return false;}
  const m=Math.min(d,sp*dt);e.x+=dx/d*m;e.y+=dy/d*m;if(Math.abs(dx)>1)e.face=dx>0?1:-1;e.mv=true;return false;
}
function randSpot(room){
  if(room)return {x:rnd(0.8,8.2)*TS,y:rnd(3,11.3)*TS};
  for(let k=0;k<10;k++){const p={x:rnd(10.6,19.3)*TS,y:rnd(2.2,11.4)*TS};if(!POND.has(Math.floor(p.x/TS)+','+Math.floor(p.y/TS)))return p;}
  return {x:12*TS,y:7*TS};
}
function parentAI(q,dt){
  q.poseT=Math.max(0,q.poseT-dt);if(q.poseT<=0)q.pose=null;
  const ox=q.x,oy=q.y;
  if(moveEnt(q,dt,55)&&q.act){const f=q.act;q.act=null;f();}
  {const dx=q.x-ox,dy=q.y-oy;if(dx||dy)q.dir=Math.abs(dx)>=Math.abs(dy)*0.8?(dx>0?'R':'L'):(dy>0?'F':'B');}
  if(q.mv||q.act||q.pose)return;
  q.idle-=dt;if(q.idle>0)return;q.idle=rnd(4,10);
  const face=x=>{q.face=x>q.x?1:-1;};
  const r=Math.random();
  if(q.k==='mom'){
    const i2=G.home.plots.findIndex(p=>p&&!p.w&&plotState(p)==='dry');
    if(i2>=0&&r<0.5){const P=ALLPLOTS[i2];routeTo(q,(P.c-0.4)*TS,(P.r+1)*TS+4);q.act=()=>{q.face=1;q.pose='water';q.poseT=2.2;const p=G.home.plots[i2];if(p&&!p.w&&plotState(p)==='dry'){p.w=true;p.gt=0;growTick();save();burst((P.c+0.5)*TS,P.r*TS+10,['#6cc6ff','#bfe8ff'],10,90);yardSay('おかあさんが みずを あげてくれた！');}};return;}
    if(r<0.75&&YARD.ents.length){const e=pick(YARD.ents);routeTo(q,e.x-30,e.y+4);q.act=()=>{face(e.x);q.pose='pet';q.poseT=2.4;e.heart=2;e.hop=0.6;};return;}
    if(r<0.9){const s=randSpot(true);routeTo(q,s.x,s.y);q.act=()=>{q.pose='bowl';q.poseT=rnd(3,6);};return;}
  }else{
    if(r<0.35&&YARD.ents.length){const e=pick(YARD.ents);routeTo(q,e.x-34,e.y+4);q.act=()=>{face(e.x);q.pose='apple';q.poseT=2.6;e.heart=2;e.hop=0.8;};return;}
    if(r<0.6){const s=randSpot(Math.random()<0.5);routeTo(q,s.x,s.y);q.act=()=>{q.pose='tool';q.poseT=rnd(3,6);};return;}
    if(r<0.75){const a=YARD.akari;routeTo(q,a.x+(a.x>10*TS?-50:50),a.y);q.act=()=>{face(a.x);q.pose=Math.random()<0.5?'wave':'joy';q.poseT=2;};return;}
  }
  const s=randSpot(Math.random()<0.5);routeTo(q,s.x,s.y);
}
function parentAt(p){if(isNight())return null;return (YARD.par||[]).find(q=>Math.abs(q.x-p.x)<22&&p.y<q.y+6&&p.y>q.y-90)||null;}

  q.path=[];q.act=null;q.mv=false;q.face=YARD.akari.x>q.x?1:-1;q.pose='wave';q.poseT=2.2;sfx.pick();

function yardUpdate(dt){
  if(!YARD.inited)yardInit();
  yardSync();
  if(Math.floor(T)%5===0&&Math.floor(T)!==YARD._gt){YARD._gt=Math.floor(T);growTick();}
  const night=isNight();
  const a=YARD.akari;
  a.poseT=Math.max(0,a.poseT-dt);if(a.poseT<=0)a.pose=null;
  const ox=a.x,oy=a.y;
  if(moveEnt(a,dt,70)&&a.act){const f=a.act;a.act=null;f();}
  {const dx=a.x-ox,dy=a.y-oy;if(dx||dy)a.dir=Math.abs(dx)>=Math.abs(dy)*0.8?(dx>0?'R':'L'):(dy>0?'F':'B');}
  if(night&&a.pose&&a.pose!=='sleep'&&!a.mv&&sideOf(a.x)===sideOf(0)&&a.poseT>0.5)a.poseT=0.5;
  if(!a.mv&&!a.act&&!a.pose){a.idle-=dt;if(a.idle<=0){a.idle=rnd(2,5);
    if(night){const bed=G.home.room.find(it=>FURN[it.id].k==='bed');const s=bed?{x:(bed.x+fsize(bed).w+0.6)*TS,y:(bed.y+fsize(bed).h+0.4)*TS}:randSpot(true);routeTo(a,s.x,s.y);a.act=()=>{a.dir='R';a.pose='sleep';a.poseT=rnd(20,40);};}
    else if(Math.random()<0.3&&YARD.ents.length){const e=pick(YARD.ents);routeTo(a,e.x-24,e.y+4);a.act=()=>{a.face=e.x>a.x?1:-1;a.dir=a.face>0?'R':'L';a.pose=Math.random()<0.5?'pet':'joy';a.poseT=1.6;e.heart=1.6;e.hop=0.6;};}
    else{const room=Math.random()<0.4,s=randSpot(room);routeTo(a,s.x,s.y);
      a.act=()=>{a.pose=pick(room?['read','chair','toys','drink','stretch','sweep','throw']:['butterfly','basket','sitknee','look','stretch','dig']);a.poseT=rnd(3,7);};}}}
  if(!night)(YARD.par||[]).forEach(q=>parentAI(q,dt));
  YARD.ents.forEach((e,i)=>{
    e.hop=Math.max(0,e.hop-dt);e.heart=Math.max(0,e.heart-dt);
    if(night&&e.st!=='sleep'&&e.st!=='bed'){e.st='bed';const bed=G.home.room.find(it=>FURN[it.id].k==='bed');const s=bed?{x:(bed.x+0.6+i*0.3)*TS,y:(bed.y+fsize(bed).h+0.3)*TS}:randSpot(true);routeTo(e,s.x,s.y);}
    if(!night&&(e.st==='sleep'||e.st==='bed'))e.st='idle';
    const done=moveEnt(e,dt,e.job?60:45);
    if(e.st==='bed'&&done){e.st='sleep';}
    if(done&&e.job){const j=e.job;e.job=null;j();}
    if(e.st==='sleep')return;
    if(!e.mv&&!e.job){e.idle-=dt;if(e.idle<=0){e.idle=rnd(2,6);
      // みずの ドラゴンは はたけに みずを あげる
      if((e.d.sp==='water'||e.d.sp==='ice')&&Math.random()<0.5){const i2=G.home.plots.findIndex(p=>p&&!p.w&&plotState(p)==='dry');if(i2>=0){const P=ALLPLOTS[i2];routeTo(e,(P.c-0.3)*TS,(P.r+0.8)*TS);e.job=()=>{const p=G.home.plots[i2];if(p&&!p.w){p.w=true;p.gt=0;growTick();save();burst((P.c+0.5)*TS,(P.r+0.4)*TS,['#6cc6ff','#bfe8ff'],10,90);yardSay(e.d.name+'が みずを あげたよ！');}e.hop=0.6;};return;}}
      const r=Math.random();
      if(r<0.25){e.hop=0.8;}
      else if(r<0.45&&YARD.ents.length>1){const o=pick(YARD.ents);if(o!==e){routeTo(e,o.x+rnd(-30,30),o.y+rnd(-10,10));}}
      else{const s=randSpot(Math.random()<0.3);routeTo(e,s.x,s.y);}}}
  });
  YARD.msgT=Math.max(0,YARD.msgT-dt);
}

  c.fillStyle='#c8a070';c.fillRect(WALL_C*TS,0,TS,YH*TS+8);c.fillStyle='#a87848';c.fillRect(WALL_C*TS,0,6,YH*TS+8);
  c.save();c.beginPath();c.rect(WALL_C*TS,DOOR_R[0]*TS,TS,(DOOR_R[1]-DOOR_R[0]+1)*TS);c.clip();
  if(ok(RMI.floor))c.drawImage(RMI.floor,WALL_C*TS-TS,DOOR_R[0]*TS-TS,FT,FT);else{c.fillStyle='#e8c890';c.fill();}c.restore();
  if(ok(RMI.door)){const dh=(DOOR_R[1]-DOOR_R[0]+1)*TS+10,dw=dh*RMI.door.naturalWidth/RMI.door.naturalHeight;c.drawImage(RMI.door,(WALL_C+0.5)*TS-dw/2,(DOOR_R[1]+1)*TS-dh,dw,dh);}

  if(YARD.edit){c.strokeStyle='rgba(255,255,255,.5)';c.lineWidth=1;for(let x=0;x<=WALL_C;x++){c.beginPath();c.moveTo(x*TS,2*TS);c.lineTo(x*TS,YH*TS);c.stroke();}for(let y=2;y<=YH;y++){c.beginPath();c.moveTo(0,y*TS);c.lineTo(WALL_C*TS,y*TS);c.stroke();}

function yardPoint(ev){const el=$('yard'),r=el.getBoundingClientRect();return {x:(ev.clientX-r.left)/YARD.s+YARD.cam,y:(ev.clientY-r.top)/YARD.s};}
function yardBind(){
  const el=$('yard');if(!el||el._b)return;el._b=1;
  el.addEventListener('pointerdown',ev=>{audioInit();YARD.drag={x0:ev.clientX,cam0:YARD.cam,moved:false};});
  el.addEventListener('pointermove',ev=>{const d=YARD.drag;if(!d)return;const dx=ev.clientX-d.x0;if(Math.abs(dx)>8)d.moved=true;if(d.moved)YARD.cam=d.cam0-dx/YARD.s;});
  const up=ev=>{const d=YARD.drag;YARD.drag=null;if(!d||d.moved)return;yardTap(yardPoint(ev));};
  el.addEventListener('pointerup',up);el.addEventListener('pointercancel',()=>{YARD.drag=null;});
}

function yardTap(p){
  const a=YARD.akari;
  if(YARD.edit)return editTap(p);
  // ドラゴン
  let best=null,bd=34;YARD.ents.forEach(e=>{const dd=Math.hypot(e.x-p.x,e.y-20-p.y);if(dd<bd){bd=dd;best=e;}});
  if(best){const i=G.dragons.indexOf(best.d);if(i>=0&&G.sel!==i){G.sel=i;save();renderHome();}
    routeTo(a,best.x-best.face*26,best.y+3);a.act=()=>{a.face=best.x>a.x?1:-1;a.dir=a.face>0?'R':'L';a.pose=stageOf(best.d.lv)>=2?'hug':'pet';a.poseT=1.4;best.heart=1.4;best.hop=0.8;best.path=[];best.idle=2;petDragon(best.d);};sfx.tap();return;}
  const pq=parentAt(p);
  if(pq){routeTo(a,pq.x+(pq.x>a.x?-36:36),pq.y+2);a.act=()=>{a.face=pq.x>a.x?1:-1;a.dir=a.face>0?'R':'L';a.pose='joy';a.poseT=1.2;parentTalk(pq);};sfx.tap();return;}
  const pi=plotAt(p);
  if(pi>=0){const P=ALLPLOTS[pi];routeTo(a,(P.c+0.5)*TS-20,(P.r+1)*TS+6);a.act=()=>{a.face=1;plotAction(pi);};sfx.tap();return;}
  routeTo(a,p.x,p.y);
}

function setEdit(on){YARD.edit=on;YARD.pick=null;YARD.place=null;if(on)YARD.cam=0;renderYardBar();}
function canPut(it,x,y,ign){
  const sz=fsize(it);if(x<0||y<2||x+sz.w>WALL_C||y+sz.h>YH)return false;
  const rug=!!FURN[it.id].rug;
  return !G.home.room.some(o=>{if(o===ign||!!FURN[o.id].rug!==rug)return false;const s2=fsize(o);return x<o.x+s2.w&&x+sz.w>o.x&&y<o.y+s2.h&&y+sz.h>o.y;});
}
function editTap(p){
  const c=Math.floor(p.x/TS),r=Math.floor(p.y/TS);
  if(YARD.place){const it={id:YARD.place,x:c,y:r,r:0};if(!canPut(it,c,r)){toast('そこには おけないよ');return;}
    G.home.room.push(it);G.home.inv[YARD.place]--;if(!G.home.inv[YARD.place])delete G.home.inv[YARD.place];YARD.place=null;YARD.pick=it;save();sfx.pick();renderYardBar();return;}
  if(YARD.pick&&YARD.moving){const it=YARD.pick;if(canPut(it,c,r,it)){it.x=c;it.y=r;save();sfx.pick();}else toast('そこには おけないよ');YARD.moving=false;renderYardBar();return;}
  const f=furnAt(p);YARD.pick=f||null;YARD.moving=false;renderYardBar();
}

function drawStory(c,W2,H2){
  const st=mdStory,sp=st.sp,tt=T-st.t0;
  const g=c.createLinearGradient(0,0,0,H2);g.addColorStop(0,'#141238');g.addColorStop(1,'#3a3478');c.fillStyle=g;c.fillRect(0,0,W2,H2);
  c.fillStyle='#fff';for(let i=0;i<30;i++){c.globalAlpha=0.3+0.7*Math.abs(Math.sin(T*1.3+i));c.fillRect(hash(i)*W2,hash(i+50)*H2*0.55,2,2);}c.globalAlpha=1;
  c.fillStyle='#fff6c8';c.beginPath();c.arc(W2*0.82,58,26,0,7);c.fill();
  // ベランダ
  c.fillStyle='#8a7a6a';c.fillRect(0,H2-46,W2,46);
  c.fillStyle='#c8c0d8';c.fillRect(0,H2-120,W2,8);
  for(let x=10;x<W2;x+=28)c.fillRect(x,H2-114,5,70);
  const egg=eggImg(sp);
  const glow=(x,y,r)=>{const gg=c.createRadialGradient(x,y,4,x,y,r);gg.addColorStop(0,'rgba(255,240,170,.85)');gg.addColorStop(1,'rgba(255,240,170,0)');c.fillStyle=gg;c.beginPath();c.arc(x,y,r,0,7);c.fill();};
  if(st.page===0){
    glow(W2*0.62,H2-80,70+Math.sin(T*3)*8);
    if(egg){const eh=78;c.drawImage(egg,W2*0.62-eh*0.42,H2-46-eh+Math.sin(T*4)*1.5,eh*0.84,eh);}
    drawAkari(c,W2*0.2,H2-30+Math.sin(tt*2)*3,190,'look');
    c.font='bold 30px sans-serif';c.fillStyle='#fff27a';c.fillText('！',W2*0.33,H2-190);
  } else if(st.page===1){
    c.globalAlpha=Math.max(0.35,1-tt*0.08);
    drawDragon(c,W2*0.42,H2-40,150,sp,40,0,1,{sad:true,shadow:false});
    c.globalAlpha=1;
    for(let i=0;i<10;i++){const a=(tt*0.3+i/10)%1;c.fillStyle='rgba(255,240,180,'+(1-a)*0.8+')';c.beginPath();c.arc(W2*0.25+hash(i)*W2*0.35,H2-60-a*220,3,0,7);c.fill();}
    glow(W2*0.82,H2-70,50);
    if(egg){const eh=62;c.drawImage(egg,W2*0.82-eh*0.42,H2-46-eh,eh*0.84,eh);}
  } else {
    glow(W2*0.6,H2-110,90+Math.sin(T*4)*10);
    drawAkari(c,W2*0.4,H2-30,200,'hugegg');
    if(egg){const eh=70,wob=Math.sin(T*14)*0.12;c.save();c.translate(W2*0.62,H2-80);c.rotate(wob);c.drawImage(egg,-eh*0.42,-eh,eh*0.84,eh);c.restore();}
    c.font='24px sans-serif';c.textAlign='center';for(let i=0;i<3;i++){const a=(tt*0.5+i/3)%1;c.globalAlpha=1-a;c.fillText('💗',W2*0.5+i*30-30,H2-200-a*60);}c.globalAlpha=1;c.textAlign='left';
  }
}

/* こうか（パーティクルと うかぶ もじ） */
let PARTS=[],FLOATS=[];
function burst(x,y,col,n,sp){for(let i=0;i<(n||12);i++){const a=Math.random()*6.28,s=rnd(60,sp||220);PARTS.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-60,life:rnd(0.4,0.9),t:0,col:Array.isArray(col)?pick(col):col,r:rnd(3,7)});}}
function floatText(x,y,t,col){FLOATS.push({x,y,t,col:col||'#fff',life:1.1,a:0});}
function updFx(dt){
  PARTS.forEach(p=>{p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=400*dt;});PARTS=PARTS.filter(p=>p.t<p.life);
  FLOATS.forEach(f=>{f.a+=dt;f.y-=40*dt;});FLOATS=FLOATS.filter(f=>f.a<f.life);
}
function drawFx(c,ox){
  ox=ox||0;
  PARTS.forEach(p=>{c.globalAlpha=1-p.t/p.life;c.fillStyle=p.col;c.beginPath();c.arc(p.x-ox,p.y,p.r,0,7);c.fill();});
  c.globalAlpha=1;
  c.textAlign='center';c.font='bold 22px sans-serif';c.lineWidth=4;c.strokeStyle='rgba(0,0,0,.55)';
  FLOATS.forEach(f=>{c.globalAlpha=1-Math.max(0,f.a-0.6)/0.5;c.strokeText(f.t,f.x-ox,f.y);c.fillStyle=f.col;c.fillText(f.t,f.x-ox,f.y);});
  c.globalAlpha=1;
}
function isNight(){const h=new Date().getHours();return h>=19||h<5;}
function isEvening(){const h=new Date().getHours();return h>=16&&h<19;}
function skyGrad(c,y1){
  const g=c.createLinearGradient(0,0,0,y1);
  if(isNight()){g.addColorStop(0,'#0e0b2e');g.addColorStop(1,'#3a3270');}
  else if(isEvening()){g.addColorStop(0,'#4a5fb0');g.addColorStop(0.6,'#f59a6a');g.addColorStop(1,'#ffd08a');}
  else{g.addColorStop(0,'#5fb4f0');g.addColorStop(1,'#cfeeff');}
  c.fillStyle=g;c.fillRect(0,0,VW,y1+2);
  if(isNight()){c.fillStyle='#fff';for(let i=0;i<40;i++){const x=hash(i)*VW,y=hash(i+99)*y1*0.8;c.globalAlpha=0.4+0.6*Math.abs(Math.sin(T*1.5+i));c.fillRect(x,y,2,2);}c.globalAlpha=1;
    c.fillStyle='#fff8c8';c.beginPath();c.arc(VW*0.82,70,26,0,7);c.fill();c.fillStyle='#3a3270';c.beginPath();c.arc(VW*0.82+12,62,22,0,7);c.fill();}
}
function cloud(c,x,y,s,col){c.fillStyle=col||'rgba(255,255,255,.9)';c.beginPath();c.arc(x,y,s*0.5,0,7);c.arc(x+s*0.45,y+s*0.08,s*0.38,0,7);c.arc(x-s*0.45,y+s*0.1,s*0.34,0,7);c.arc(x+s*0.15,y-s*0.25,s*0.36,0,7);c.fill();}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function bubble(c,x,y,txt,size){
  c.font='bold '+(size||18)+'px sans-serif';c.textAlign='center';
  const w=c.measureText(txt).width+18,h=(size||18)+12;
  c.fillStyle='rgba(255,255,255,.95)';rr(c,x-w/2,y-h,w,h,10);c.fill();
  c.beginPath();c.moveTo(x-6,y-1);c.lineTo(x,y+8);c.lineTo(x+6,y-1);c.fill();
  c.fillStyle='#3a2a1a';c.fillText(txt,x,y-h*0.3);
}

/* ===================== ドラゴンさがし（ほんとうの まちを あるく）=====================
   フテ猫ウォークと おなじ しくみ：GPSの いまの ばしょ・OSMの ちず・ほんとうの 歩数。
   位置情報は 画面に 出すだけで 保存しない。ひろった ポイントは「きょうの ID」だけ のこす。 */
const DEMO=/[?&]demo=1/.test(location.search);
const PT_RADIUS=40, STEP_M=0.7, EXP_STEPS=3, HUNGER_STEPS=30;
const CAT={
 park:{i:'🌳',n:'こうえん',pref:{wind:4,earth:2,fire:1},msg:'こうえんの しげみで ねむっていた！'},
 shrine:{i:'⛩️',n:'じんじゃ・おてら',pref:{light:2,wind:2,water:1},night:{dark:3,light:1},msg:'おみやの もりで まいごに なっていた！'},
 station:{i:'🚉',n:'えき',pref:{thunder:4,fire:1},msg:'でんせんの うえで ビリビリ あそんでいた！'},
 food:{i:'🏪',n:'おみせ',pref:{fire:4,earth:1,thunder:1},msg:'おみせの うらの ダンボールで ないていた！'},
 school:{i:'🏫',n:'がっこう・としょかん',pref:{ice:3,water:1,wind:1},night:{dark:3,ice:1},msg:'ほんだなの かげから でてきた！'},
 sight:{i:'🗼',n:'けんぶつ',pref:{water:2,ice:1,light:1,earth:1},msg:'けしきを ながめていた！'},
 water:{i:'⛲',n:'みずべ',pref:{water:4,ice:2},msg:'みずべで みずあびしていた！'},
 spot:{i:'❓',n:'ひみつの ばしょ',pref:{fire:1,water:1,wind:1,earth:1,thunder:1,ice:1},msg:'みちの すみっこに かくれていた！'}
};
const KIND_TXT={dragon:'ドラゴンの けはい！',food:'ごはんが おちてる',coin:'コインが ひかってる'};
function distM(a,b){const R=6371000,r=Math.PI/180,dLa=(b.lat-a.lat)*r,dLo=(b.lng-a.lng)*r;const x=Math.sin(dLa/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(x));}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function seeded(seed){let a=seed>>>0;return function(){a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};}
function dayKey(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fmtM(m){m=Math.max(0,m);return m>=1000?(m/1000).toFixed(1)+'km':Math.round(m/10)*10+'m';}
function catOf(t){
  if(t.natural==='water'||t.amenity==='fountain'||t.waterway)return 'water';
  if(t.leisure==='park'||t.leisure==='garden'||t.leisure==='playground')return 'park';
  if(t.amenity==='place_of_worship')return 'shrine';
  if(t.railway==='station'||t.public_transport==='station')return 'station';
  if(t.shop)return 'food';
  if(t.amenity==='school'||t.amenity==='library'||t.amenity==='kindergarten')return 'school';
  if(t.tourism||t.historic)return 'sight';
  return 'spot';
}
function assignKinds(pts,day){
  const order=pts.slice().sort((a,b)=>hashStr(a.id+day)-hashStr(b.id+day));
  const pat=['dragon','food','dragon','coin','food'];
  order.forEach((p,i)=>{p.kind=pat[i%pat.length];});
  return pts;
}
function pickPoints(elements,center,day,max){
  const cand=[];
  (elements||[]).forEach(e=>{
    const lat=e.lat!==undefined?e.lat:(e.center&&e.center.lat),lng=e.lon!==undefined?e.lon:(e.center&&e.center.lon);
    if(lat===undefined||lng===undefined||!e.tags||!e.tags.name)return;
    const p={id:'o'+e.type.charAt(0)+e.id,lat,lng,name:e.tags.name,cat:catOf(e.tags)};
    const d=distM(center,p);if(d<25||d>1200)return;
    p.r=seeded(hashStr(p.id+day))();cand.push(p);
  });
  const byCat={};cand.sort((a,b)=>a.r-b.r).forEach(p=>{(byCat[p.cat]=byCat[p.cat]||[]).push(p);});
  const cats=Object.keys(byCat).sort(),out=[];let guard=0;
  while(out.length<max&&guard++<400){let any=false;
    for(let i=0;i<cats.length&&out.length<max;i++){const list=byCat[cats[i]];
      while(list.length){const p=list.shift();if(out.every(q=>distM(p,q)>=90)){out.push(p);any=true;break;}}}
    if(!any)break;}
  out.forEach(p=>{delete p.r;});
  return assignKinds(out,day);
}
function gridPoints(center,day,radius){
  const step=0.0025,out=[];const cxx=Math.floor(center.lat/step),cyy=Math.floor(center.lng/step);const n=Math.ceil(radius/250)+1;
  for(let i=-n;i<=n;i++)for(let j=-n;j<=n;j++){const id='g'+(cxx+i)+'_'+(cyy+j);const rr2=seeded(hashStr(id+'|'+day));
    if(rr2()>0.45)continue;const p={id,lat:(cxx+i+0.15+rr2()*0.7)*step,lng:(cyy+j+0.15+rr2()*0.7)*step,name:'ひみつの ばしょ',cat:'spot'};
    const d=distM(center,p);if(d<30||d>radius)continue;out.push(p);}
  out.sort((a,b)=>distM(center,a)-distM(center,b));
  return assignKinds(out.slice(0,14),day);
}
function overpassQuery(c,r){
  const a='(around:'+r+','+c.lat.toFixed(5)+','+c.lng.toFixed(5)+')';
  return '[out:json][timeout:20];('+
    'nwr'+a+'[leisure~"^(park|garden|playground)$"][name];'+
    'nwr'+a+'[amenity~"^(place_of_worship|library|school|kindergarten)$"][name];'+
    'nwr'+a+'[railway=station][name];'+
    'nwr'+a+'[shop~"^(bakery|convenience|supermarket|confectionery|seafood|butcher|greengrocer|deli|pastry|tea)$"][name];'+
    'nwr'+a+'[tourism~"^(viewpoint|museum|attraction|artwork)$"][name];'+
    'nwr'+a+'[historic][name];'+
    'nwr'+a+'[natural=water][name];'+
    'nwr'+a+'[amenity=fountain];'+
    ');out center 300;';
}
const OVERPASS=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter','https://overpass.private.coffee/api/interpreter','https://maps.mail.ru/osm/tools/overpass/api/interpreter'];
const GEO={watch:null,me:null,acc:999,pts:null,ptsCenter:null,loading:false,src:'',lastTry:0,mirror:0,state:'idle',fitted:false,resume:false};
const MAPV={map:null,ptMs:{},meM:null,accC:null,on:false,tileOk:0,tileErr:0,meKey:''};
function ptGot(id){return G.ptDay===dayKey()&&G.ptGot&&!!G.ptGot[id];}
function walkToday(){const k=dayKey();if(!G.walk||G.walk.day!==k)G.walk={day:k,steps:0,found:0};return G.walk;}

/* --- ほすう（センサー と GPS） --- */
const MOT={listening:false,grav:9.8,ema:0,above:false,lastPeak:0,streak:0,wake:null};
function motionHandler(e){
  const a=e.accelerationIncludingGravity;if(!a||a.x===null)return;
  const m=Math.sqrt(a.x*a.x+a.y*a.y+a.z*a.z);
  MOT.grav=MOT.grav*0.96+m*0.04;const d=m-MOT.grav;MOT.ema=MOT.ema*0.55+d*0.45;
  const t=performance.now();
  if(!MOT.above&&MOT.ema>1.15){MOT.above=true;const dt=t-MOT.lastPeak;
    if(dt>260){MOT.streak=dt<1800?MOT.streak+1:1;MOT.lastPeak=t;if(MOT.streak>=4)addRealSteps(MOT.streak===4?4:1);}}
  else if(MOT.above&&MOT.ema<0.25)MOT.above=false;
}
function needsMotionPermission(){return typeof DeviceMotionEvent!=='undefined'&&typeof DeviceMotionEvent.requestPermission==='function';}
function startMotion(fromTap){
  const go=()=>{if(!MOT.listening){window.addEventListener('devicemotion',motionHandler);MOT.listening=true;}G.motionOn=true;save();
    try{if(navigator.wakeLock)navigator.wakeLock.request('screen').then(w=>{MOT.wake=w;}).catch(()=>{});}catch(e){}
    if(scene===WALK)WALK.hudBtns();};
  if(typeof DeviceMotionEvent==='undefined'){toast('センサーが つかえないよ','GPSで かぞえるね');return;}
  if(needsMotionPermission()){
    if(!fromTap)return;
    DeviceMotionEvent.requestPermission().then(r=>{if(r==='granted')go();else toast('センサーが ゆるされなかったよ','せっていで かえられるよ');}).catch(()=>toast('ボタンを おして ゆるしてね'));
  } else go();
}
function stopMotion(keepSetting){
  window.removeEventListener('devicemotion',motionHandler);MOT.listening=false;
  if(!keepSetting){G.motionOn=false;save();}
  if(MOT.wake){try{MOT.wake.release();}catch(e){}MOT.wake=null;}
}
const GSTEP={anchor:null,t:0};
function gpsSteps(me,acc){
  if(acc>35)return;
  const now=Date.now();
  if(!GSTEP.anchor){GSTEP.anchor=me;GSTEP.t=now;return;}
  const d=distM(GSTEP.anchor,me);if(d<10)return;
  const dt=(now-GSTEP.t)/1000,v=d/Math.max(dt,1);
  GSTEP.anchor=me;GSTEP.t=now;
  if(v>3.2||dt>600)return;           // くるま・でんしゃは かぞえない
  if(MOT.listening)return;            // センサーが うごいていれば そちら
  const n=Math.round(d/STEP_M);if(n>0)addRealSteps(n);
}
let _stepUi=0;
function startStepSources(){
  if(G.motionOn&&!needsMotionPermission())startMotion(false);
  if(navigator.geolocation&&GEO.watch===null){
    try{GEO.watch=navigator.geolocation.watchPosition(p=>{gpsSteps({lat:p.coords.latitude,lng:p.coords.longitude},p.coords.accuracy||50);},()=>{},{enableHighAccuracy:true,maximumAge:3000,timeout:25000});}catch(e){}
  }
}
function stopStepSources(){stopGeo();if(MOT.listening)stopMotion(true);}
function addRealSteps(n,virt){   // virt：へやあそび（ほんとうの ほすうには かぞえない）
  if(!G)return 0;
  let gain=0;
  const w=walkToday();if(!virt){w.steps+=n;G.steps+=n;}
  const d=cur();
  if(d){
    if(!virt)d.steps+=n;G.expAcc=(G.expAcc||0)+n;G.hunAcc=(G.hunAcc||0)+n;
    while(G.hunAcc>=HUNGER_STEPS){G.hunAcc-=HUNGER_STEPS;d.hunger=Math.max(0,d.hunger-1);}
    gain=0;while(G.expAcc>=EXP_STEPS){G.expAcc-=EXP_STEPS;if(d.hunger>0)gain+=1+(Math.random()<d.love/200?1:0);}
    if(gain){const b=d.lv;if(gainExp(d,gain))lvUpMsg(d,b);}
    if(scene===WALK&&WALK.d===d)WALK.onSteps(n,gain,virt);
  }
  clearTimeout(_stepUi);_stepUi=setTimeout(()=>{save();},700);
  return n;
}

/* --- ばしょ：さいしょだけ ほんとうの いまの ばしょ。あとは フテ猫を やじるし・フリック・タッチで うごかす --- */
const MOVE={keys:{},target:null,face:1,moving:false,t:0,speed:55,uiT:0,lastSrc:''};
const HOME_LL={lat:35.6812,lng:139.7671};
function startGeo(force){
  if(GEO.me&&!force)return;
  const fallback=()=>{GEO.state='ok';setMe(G.mapPos||HOME_LL,true);if(!G.mapPos)toast('いまの ばしょが わからないので','とうきょうえきから スタート！');renderMapCard();};
  if(!navigator.geolocation){fallback();return;}
  // いちの きょかを まっている あいだも うごけるように、まず かりの ばしょで スタート
  if(!GEO.me){setMe(G.mapPos||HOME_LL,true);}
  const t0=MOVE.walked||0;
  GEO.state='pending';renderMapCard();
  try{navigator.geolocation.getCurrentPosition(p=>{GEO.state='ok';const real={lat:p.coords.latitude,lng:p.coords.longitude};
      // かりの ばしょで もう うごきはじめていたら、かってに ちずを うごかさない（ボタンで きりかえ）
      if(!force&&(MOVE.walked||0)>t0){GEO.realPos=real;toast('📍 いまの ばしょが わかったよ','「ほんとうの いまの ばしょ」ボタンで いけるよ');renderMapCard();return;}
      GEO.realPos=null;setMe(real,true);toast('📍 いまの ばしょから スタート！');renderMapCard();},
    err=>{GEO.geoErr=err&&err.code===1?'denied':'fail';fallback();},{enableHighAccuracy:true,timeout:15000,maximumAge:60000});}catch(e){fallback();}
}
function stopGeo(){GSTEP.anchor=null;if(GEO.watch!==null){try{navigator.geolocation.clearWatch(GEO.watch);}catch(e){}GEO.watch=null;}}
function setMe(me,jump){
  GEO.me={lat:me.lat,lng:me.lng};GEO.state='ok';GEO.acc=5;if(G.saveMap!==false)G.mapPos={lat:+me.lat.toFixed(4),lng:+me.lng.toFixed(4)};else delete G.mapPos;
  if(!GEO.pts||distM(GEO.ptsCenter,me)>700||(GEO.src==='grid'&&Date.now()-GEO.lastTry>90000))loadPts(me);
  if(MAPV.on&&MAPV.map){drawMe();if(jump)MAPV.map.setView([me.lat,me.lng],17,{animate:false});else MAPV.map.panTo([me.lat,me.lng],{animate:false});checkPick();}
}
function offsetLL(ll,east,north){const k=Math.cos(ll.lat*Math.PI/180);return {lat:ll.lat+north/110540,lng:ll.lng+east/(111320*Math.max(0.2,k))};}
function mapTick(dt){
  if(!MAPV.on||!GEO.me||!MAPV.map)return;
  let vx=0,vy=0;const k=MOVE.keys;
  if($('modal').classList.contains('on')){setMoving(false);return;}
  if(k.ArrowLeft||k.KeyA||k.padArrowLeft)vx-=1;if(k.ArrowRight||k.KeyD||k.padArrowRight)vx+=1;if(k.ArrowUp||k.KeyW||k.padArrowUp)vy+=1;if(k.ArrowDown||k.KeyS||k.padArrowDown)vy-=1;
  let lim=Infinity;
  if(vx||vy)MOVE.target=null;
  else if(MOVE.target){const d=distM(GEO.me,MOVE.target);if(d<1){MOVE.target=null;}else{const cosl=Math.cos(GEO.me.lat*Math.PI/180);vx=(MOVE.target.lng-GEO.me.lng)*111320*cosl;vy=(MOVE.target.lat-GEO.me.lat)*110540;lim=d;}}
  const len=Math.hypot(vx,vy);
  if(!len){setMoving(false);return;}
  vx/=len;vy/=len;
  const m=Math.min(MOVE.speed*dt,lim);
  if(Math.abs(vx)>0.25)MOVE.face=vx>0?1:-1;
  MOVE.dir=Math.abs(vx)>=Math.abs(vy)*0.8?(vx>0?'R':'L'):(vy>0?'B':'F');
  setMoving(true);
  MOVE.walked=(MOVE.walked||0)+m;
  setMe(offsetLL(GEO.me,vx*m,vy*m));
  MOVE.uiT+=dt;if(MOVE.uiT>0.4){MOVE.uiT=0;renderMapCard();}
}
function setMoving(m){
  if(MOVE.moving!==m){MOVE.moving=m;if(!m)renderMapCard();}
  MOVE.t+=1/60;
  const el=MAPV.meM&&MAPV.meM.getElement&&MAPV.meM.getElement();if(!el)return;
  const box=el.querySelector('.meic');if(box)box.classList.toggle('fl',MOVE.face<0);
  const css=akCss(akFrame('standF',MOVE.dir||'R',MOVE.t,m)),mk=el.querySelector('.mk');
  if(mk&&MOVE.lastSrc!==css){mk.style.cssText=css;MOVE.lastSrc=css;}
}
/* フリック・タッチ */
const FLK={id:null,x:0,y:0,t:0,n:0};
function mapPointer(){
  const el=$('dmap');
  el.addEventListener('pointerdown',e=>{FLK.n++;if(FLK.n>1){FLK.id=null;return;}FLK.id=e.pointerId;FLK.x=e.clientX;FLK.y=e.clientY;FLK.t=performance.now();audioInit();});
  const up=e=>{FLK.n=Math.max(0,FLK.n-1);if(FLK.id!==e.pointerId)return;FLK.id=null;
    if(e.target.closest&&e.target.closest('.leaflet-control'))return;
    if(!GEO.me||!MAPV.map)return;
    const dx=e.clientX-FLK.x,dy=e.clientY-FLK.y,L2=Math.hypot(dx,dy),dt=performance.now()-FLK.t;
    if(L2>28&&dt<900){
      const z=MAPV.map.getZoom(),mpp=156543.03*Math.cos(GEO.me.lat*Math.PI/180)/Math.pow(2,z);
      const dist=clamp(L2*mpp*2.5,40,450);
      MOVE.target=offsetLL(GEO.me,dx/L2*dist,-dy/L2*dist);sfx.tap();
    } else if(L2<12){
      const r=el.getBoundingClientRect();const ll=MAPV.map.containerPointToLatLng([e.clientX-r.left,e.clientY-r.top]);
      if(MOVE.moving&&MOVE.target&&distM(MOVE.target,{lat:ll.lat,lng:ll.lng})<15){MOVE.target=null;return;}
      MOVE.target={lat:ll.lat,lng:ll.lng};
    }
  };
  el.addEventListener('pointerup',up);el.addEventListener('pointercancel',e=>{FLK.n=Math.max(0,FLK.n-1);if(FLK.id===e.pointerId)FLK.id=null;});
  const kc=e=>{const k=e.code||'';if(/^(Arrow(Up|Down|Left|Right)|Key[WASD])$/.test(k))return k;const m={ArrowUp:'ArrowUp',ArrowDown:'ArrowDown',ArrowLeft:'ArrowLeft',ArrowRight:'ArrowRight',Up:'ArrowUp',Down:'ArrowDown',Left:'ArrowLeft',Right:'ArrowRight',w:'KeyW',a:'KeyA',s:'KeyS',d:'KeyD',W:'KeyW',A:'KeyA',S:'KeyS',D:'KeyD'}[e.key];return m||'';};
  document.addEventListener('keydown',e=>{if(!MAPV.on||$('modal').classList.contains('on'))return;const k=kc(e);if(k){MOVE.keys[k]=true;e.preventDefault();}},true);
  document.addEventListener('keyup',e=>{const k=kc(e);if(k)MOVE.keys[k]=false;},true);
  $('dpad').querySelectorAll('button').forEach(b=>{
    const on=e=>{e.preventDefault();audioInit();MOVE.target=null;MOVE.keys['pad'+b.dataset.k]=true;b.classList.add('on');};
    const off=()=>{MOVE.keys['pad'+b.dataset.k]=false;b.classList.remove('on');};
    b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('pointerleave',off);
    b.addEventListener('contextmenu',e=>e.preventDefault());
  });
  window.addEventListener('blur',()=>{MOVE.keys={};});
}
function loadPts(c){
  // よみこみ中に とおくへ いどうしたら、あたらしい ばしょを あとで よみなおす（ふるい ばしょの ポイントは つかわない）
  if(GEO.loading){if(!GEO.ptsCenter||distM(GEO.ptsCenter,c)>700){GEO.pending=c;GEO.ptsCenter=c;setPts(gridPoints(c,dayKey(),900),'grid');}return;}
  const day=dayKey();GEO.ptsCenter=c;GEO.lastTry=Date.now();
  const key='fd-pts|'+day+'|'+c.lat.toFixed(3)+','+c.lng.toFixed(3);
  try{const cached=sessionStorage.getItem(key);if(cached){setPts(JSON.parse(cached),'osm');return;}}catch(e){}
  if(!GEO.pts)setPts(gridPoints(c,day,900),'grid');
  GEO.loading=true;
  const q=overpassQuery(c,1000);
  const tryAt=n=>{
    const stale=()=>{if(GEO.pending){const pc=GEO.pending;GEO.pending=null;GEO.loading=false;if(distM(pc,c)>700){loadPts(pc);return true;}}return false;};
    if(n>=OVERPASS.length){if(stale())return;GEO.loading=false;if(!GEO.pts||GEO.src!=='osm'||distM(GEO.ptsCenter,c)<700)setPts(gridPoints(c,day,900),'grid');return;}
    const ctl=window.AbortController?new AbortController():null;const to=setTimeout(()=>{if(ctl)ctl.abort();},15000);
    fetch(OVERPASS[(n+GEO.mirror)%OVERPASS.length]+'?data='+encodeURIComponent(q),{signal:ctl?ctl.signal:undefined})
      .then(r=>{if(!r.ok)throw new Error('http '+r.status);return r.json();})
      .then(j=>{clearTimeout(to);GEO.mirror=(n+GEO.mirror)%OVERPASS.length;
        let pts=pickPoints(j.elements,c,day,14);
        if(pts.length<8){const extra=gridPoints(c,day,900).filter(g2=>pts.every(p=>distM(p,g2)>=90));pts=pts.concat(extra.slice(0,10-pts.length));}
        try{sessionStorage.setItem(key,JSON.stringify(pts));}catch(e){}
        if(stale())return;GEO.loading=false;setPts(pts,'osm');})
      .catch(()=>{clearTimeout(to);tryAt(n+1);});
  };
  tryAt(0);
}
function setPts(pts,src){
  // はじめての ドラゴンは かならず いちばん ちかい ポイントに
  if(G&&G.found===0&&GEO.me&&pts.length){const near=pts.slice().sort((a,b)=>distM(GEO.me,a)-distM(GEO.me,b))[0];near.kind='dragon';}
  GEO.pts=pts;GEO.src=src;
  if(MAPV.map){Object.keys(MAPV.ptMs).forEach(k=>MAPV.map.removeLayer(MAPV.ptMs[k]));}
  MAPV.ptMs={};
  if(MAPV.on){drawPts();checkPick();renderMapCard();if(src==='osm'&&!GEO.fitted)fitNear();}
}

/* --- ちず --- */
function initMap(){
  if(MAPV.map)return;
  MAPV.map=L.map('dmap',{zoomControl:false,attributionControl:false,minZoom:13,maxZoom:19,zoomSnap:0.25,dragging:false,doubleClickZoom:false,boxZoom:false,keyboard:false,touchZoom:'center',scrollWheelZoom:'center'});
  L.control.attribution({position:'topright',prefix:false}).addTo(MAPV.map);
  L.control.zoom({position:'topleft',zoomInText:'＋',zoomOutText:'－'}).addTo(MAPV.map);
  mapPointer();

 {id:'hurdle',name:'ハードルコース',lv:10,cpu:[9,11,13],skill:0.55,prize:70,exp:50,desc:'さくが たくさん',spec:'F300 h F150 h F150 H F300 h h F200 W F200 h F150 H F300 h F400'},
 {id:'mori',name:'もりの スティープル',lv:20,cpu:[19,22,25],skill:0.62,prize:150,exp:100,desc:'みずごえ と どろぬま',spec:'F400 h F200 W F300 M400 H F300 h F200 M300 W F400 h F300 M300 F400'},
 {id:'kazan',name:'かざんの グランプリ',lv:35,cpu:[35,38,41],skill:0.7,prize:300,exp:170,desc:'あつい どろと おおきな さく',spec:'F300 H F200 M400 H F200 W F300 M500 h h F300 H M300 F300 W F500'},
 {id:'king',name:'ドラゴンキング ステークス',lv:50,cpu:[50,55,60],skill:0.8,prize:600,exp:280,desc:'ながくて ぜんぶ ある さいきょう コース',spec:'F600 h F300 W F300 M500 H F300 h h F300 M400 W F400 H F300 M300 h F400 W F300 H F700'}

const OBS_LEN=260;
function buildCourse(spec){
  let x=0;const segs=[],obs=[];
  spec.split(' ').forEach(tk=>{
    const c=tk[0];
    if(c==='F'||c==='M'){const n=+tk.slice(1);segs.push({t:c==='F'?'flat':'mud',a:x,b:x+n});x+=n;}
    else{segs.push({t:'obs',a:x,b:x+OBS_LEN});obs.push({t:c==='h'?'fence':c==='H'?'big':'water',x:x+OBS_LEN*0.55,w:c==='W'?150:16,h:c==='H'?74:c==='h'?48:0});x+=OBS_LEN;}
  });
  segs.push({t:'flat',a:x,b:x+300});
  return {segs,obs,len:x};
}
function mudTake(C,x){return terrAt(C,x)==='mud'&&terrAt(C,x+220)==='mud';}

  /* ジャンプの はんい（しょうがいぶつまでの きょり）。
     さく：たかさ h を こえる じかん t1〜t2（y=v0 t − g t²/2 ≥ h）× いまの はやさ
     みずごえ：たいくう じかん T＝2v0/g の あいだに はば w を こえる → きょり 0〜(T×はやさ − w) */

      // ジャンプする はんい（あかるい おび）

/* ===================== バトル ===================== */
const TRAINERS={fute:'フテ猫',kuro:'クロネコさん',chap:'チャッピーちゃん',akari:'あかりちゃん'};
function towerFloor(f){
  const tr=Object.keys(TRAINERS).filter(k=>k!==G.keeper);
  const pool=['fire','water','wind','earth','thunder','ice'];
  let sp=pool[(f*5+2)%6];if(f===7)sp='light';if(f===8)sp='dark';if(f===9)sp=pool[(f*3)%6];if(f===10)sp='rainbow';
  const lv=f===1?9:6+f*4+Math.max(0,f-5);
  const tk=f===10?'kuro':tr[f%tr.length];
  return {f,lv,sp,trainer:tk,boss:f===10,name:SP[sp].names[(f+1)%4],prize:50+f*30,exp:40+f*18};
}
function openTower(){
  const d=cur();
  let h='<h2>⚔️ バトルタワー</h2><p>'+esc(d.name)+'（Lv'+d.lv+'）<br>おなか '+Math.round(d.hunger)+'</p><div class="list">';
  for(let f=1;f<=10;f++){const e=towerFloor(f);const okk=f<=G.tower+1;const clear=f<=G.tower;
    h+='<div class="row'+(okk?'':' lockrow')+'"><img src="img/face-'+e.trainer+'.webp" style="width:38px;height:38px;object-fit:contain" alt=""><span class="n">'+f+'かい'+(e.boss?' 👑ボス':'')+'　'+TRAINERS[e.trainer]+'<small>'+SP[e.sp].name+' Lv'+e.lv+'（'+SP[e.sp].el+'）'+(clear?' ✅クリア':'')+'</small></span><button data-f="'+f+'"'+(okk?'':' disabled')+'>'+(okk?'たたかう':'🔒')+'</button></div>';}
  h+='</div><p style="font-size:12px;color:#8a6f52;text-align:left">あいしょう：火→氷→風→土→雷→水→火（やじるしの さきに つよい）。光と闇は おたがいに つよい。</p>';
  modal(h,[{t:'もどる',c:'sub'}]);
  $('mbox').querySelectorAll('button[data-f]').forEach(b=>{b.onclick=()=>{if(d.hunger<20){closeModal();return hungry(d);}closeModal();BATTLE.foe=towerFloor(+b.dataset.f);startScene(BATTLE);};});
}
function towerTb(f){const k=f.boss?0.6:f.f===1?0:f.f===2?0.1:0.35;const v=f.lv*k;return {hp:v,atk:v,def:v,spd:v};}
/* ダメージ ＝ いりょく × こうげき÷ぼうぎょ × (0.6＋0.02×じぶんのLv) × あいしょう × きゅうしょ1.5 × 0.88〜1.0
   ただし 1かいの ダメージは あいての さいだいHPの 40%まで（ドラゴンメテオは 60%まで）→ さいしょの 1げきで たおれない */
const DMG_CAP=0.4,METEOR_CAP=0.6;
function dmgCalc(a,dfn,power,mult,crit,meteor){
  let d=power*a.st.atk/Math.max(1,dfn.st.def)*(0.6+0.02*a.d.lv)*mult*(crit?1.5:1)*rnd(0.88,1.0);
  d=Math.min(d,dfn.max*(meteor?METEOR_CAP:DMG_CAP));
  return Math.max(1,Math.round(d));
}

    if(e.hp<e.max*0.35&&r<0.25)return 'guard';
    const m=elMult(e.el,this.me.el);
    const easy=this.foe.f<=3;
    if(m>1)return r<(easy?0.45:0.75)?'breath':'tackle';
    return r<(easy?0.3:0.5)?'breath':r<0.85?'tackle':'guard';
  },
  async choose(mv){
    if(this.busy||this.over)return;
    if(mv==='meteor'&&!(this.d.lv>=25&&this.me.gauge>=100))return;
    sfx.tap();this.busy=true;this.updHud();
    const em=this.aiPick();
    const order=[];
    const ms=this.me.st.spd*rnd(0.9,1.1),es=this.en.st.spd*rnd(0.9,1.1);
    const meFirst=mv==='guard'||(em!=='guard'&&ms>=es);   // すばやさ×0.9〜1.1 で くらべる。おなじなら じぶんが さき
    if(meFirst){order.push([this.me,this.en,mv],[this.en,this.me,em]);}else{order.push([this.en,this.me,em],[this.me,this.en,mv]);}
    this.me.guard=false;this.en.guard=false;
    // まもるは さきに
    order.sort((a,b)=>(b[2]==='guard')-(a[2]==='guard'));
    for(const [a,dfn,m] of order){
      if(a.hp<=0||dfn.hp<=0)break;
      await this.act(a,dfn,m);
    }
    this.me.guard=false;this.en.guard=false;
    this.turn++;
    if(this.en.hp<=0)return this.end(true);
    if(this.me.hp<=0)return this.end(false);
    this.busy=false;this.msg('どうする？');this.updHud();
  },
  async act(a,dfn,m){
    const an=a.me?this.d.name:this.en.d.name;
    if(m==='guard'){const again=a.lastGuard;a.guard=again?0.5:0.3;a.lastGuard=true;const h=again?0:Math.round(a.max*0.08);a.hp=Math.min(a.max,a.hp+h);this.msg(an+'は まもりの かまえ！'+(again?'（つづけて つかうと ききめが よわい）':' HPが '+h+' かいふく'));sfx.pick();burst(this.pos(a).x,this.pos(a).y-60,'#8ad8ff',14,160);await this.anim(a,'shown',a.hp,500);return;}
    a.lastGuard=false;
    const S=SP[a.d.sp];
    let power=40,mult=1,name='たいあたり';
    if(m==='breath'){power=60;mult=elMult(a.el,dfn.el);name=S.breath;}
    if(m==='meteor'){power=110;mult=1;name='ドラゴンメテオ';a.gauge=0;}
    const crit=Math.random()<(a.me?0.05+this.d.love/1000:0.05);   // きゅうしょ：じぶん 5%＋なつき÷1000（さいだい15%）、あいて 5%
    this.msg(an+'の '+name+'！');
    if(m==='tackle'){a.lunge=1;sfx.hit();await sleep(320);}
    else{a.open=1;sfx.breath();this.beams.push({from:a,to:dfn,t:0,cols:m==='meteor'?['#ffb000','#ff4a2a','#fff27a']:S.bc,big:m==='meteor'});await sleep(650);a.open=0;}
    let dmg=dmgCalc(a,dfn,power,mult,crit,m==='meteor');
    if(dfn.guard)dmg=Math.max(1,Math.round(dmg*dfn.guard));
    dfn.hp=Math.max(0,dfn.hp-dmg);dfn.flash=0.4;
    a.gauge=Math.min(100,a.gauge+(m==='meteor'?0:15));dfn.gauge=Math.min(100,dfn.gauge+25);
    const p=this.pos(dfn);burst(p.x,p.y-60,m==='tackle'?['#fff','#ffe35a']:S.bc,18,240);floatText(p.x,p.y-110,'-'+dmg,crit?'#ff4a4a':'#fff');
    sfx.hit();
    await this.anim(dfn,'shown',dfn.hp,450);
    let note='';
    if(crit)note+='きゅうしょに あたった！ ';
    if(m==='breath'&&mult>1)note+='こうかは ばつぐんだ！';
    else if(m==='breath'&&mult<1)note+='こうかは いまひとつ…';
    if(dfn.guard)note+=' まもりで ふせいだ！';
    if(note){this.msg(note);await sleep(650);}
    this.updHud();
  },
  anim(f,key,to,ms){
    return new Promise(res=>{const from=f[key],t0=performance.now();
      const step=()=>{const p=Math.min(1,(performance.now()-t0)/ms);f[key]=from+(to-from)*p;this.updHud();if(p<1)requestAnimationFrame(step);else res();};step();});
  },
  pos(f){const pb=$('hudBot');const lim=pb?(H-pb.offsetHeight)/U-30:VH*0.56;const my=Math.min(VH*0.56,lim);return f.me?{x:VW*0.27,y:my}:{x:VW*0.73,y:Math.min(VH*0.4,my-70)};},
  end(win){
    this.over=true;this.updHud();
    const d=this.d,f=this.foe;
    d.hunger=Math.max(0,d.hunger-20);
    if(win){
      const first=f.f>G.tower;
      if(first)G.tower=f.f;
      const coins=first?f.prize:Math.round(f.prize*0.4),exp=first?f.exp:Math.round(f.exp*0.5);
      G.coins+=coins;d.wins++;const b=d.lv;const ups=gainExp(d,exp);save();
      sfx.win();this.msg(TRAINERS[f.trainer]+'に かった！');
      setTimeout(()=>{
        modal('<h2>🏆 しょうり！</h2><canvas id="mdCv" width="440" height="340"></canvas><p>'+f.f+'かい クリア！<br>🪙+'+coins+'　けいけんち +'+exp+(ups?'<br><b style="color:#e8582a">Lv'+d.lv+'に なった！</b>':'')+'</p>'+(f.boss&&first?'<p><b>でんせつの ドラゴンマスターに なった！！</b></p>':''),
          [{t:'タワーへ',f:()=>{goHome();openTower();}},{t:'こやへ',c:'go',f:()=>goHome()}]);
        mdDragon={sp:d.sp,lv:d.lv,happy:true,akari:'joy'};if(ups)lvUpMsg(d,b);
      },900);
    } else {
      const b=d.lv;const ups=gainExp(d,Math.round(f.exp*0.2));save();
      sfx.lose();this.msg(d.name+'は たおれてしまった…');
      setTimeout(()=>{
        modal('<h2>まけちゃった…</h2><canvas id="mdCv" width="440" height="340"></canvas><p>けいけんち +'+Math.round(f.exp*0.2)+'<br>おさんぽで とっくんして また ちょうせん！</p><p style="font-size:12px">ヒント：あいしょうの いい ブレスを つかおう。あぶない ときは まもる！</p>',
          [{t:'もういちど',f:()=>{if(d.hunger<20)hungry(d);else startScene(BATTLE);}},{t:'こやへ',c:'go',f:()=>goHome()}]);
        mdDragon={sp:d.sp,lv:d.lv,sad:true,akari:'sad'};if(ups)lvUpMsg(d,b);
      },900);
    }
  },
  update(dt){
    updFx(dt);
    [this.me,this.en].forEach(f=>{f.lunge=Math.max(0,f.lunge-dt*3);f.flash=Math.max(0,f.flash-dt);});
    this.beams.forEach(b=>b.t+=dt);this.beams=this.beams.filter(b=>b.t<0.7);
  },
  draw(){
    const c=cx;
    const g=c.createLinearGradient(0,0,0,VH);g.addColorStop(0,'#3a2a6a');g.addColorStop(0.5,'#8a5ab0');g.addColorStop(1,'#2a1a40');c.fillStyle=g;c.fillRect(0,0,VW,VH);
    // はしら
    c.fillStyle='rgba(255,255,255,.08)';for(let i=0;i<6;i++){c.fillRect(i*VW/6+20,0,30,VH);}
    // ぶたい
    const f=this.foe;const P1=this.pos(this.me),P2=this.pos(this.en);
    c.fillStyle='#5a4a7a';c.beginPath();c.ellipse(P2.x,P2.y+10,VW*0.2,30,0,0,7);c.fill();
    c.fillStyle='#6a5a8a';c.beginPath();c.ellipse(P1.x,P1.y+10,VW*0.22,34,0,0,7);c.fill();
    // トレーナー
    const tim=IMG['face-'+f.trainer];if(ok(tim))c.drawImage(tim,P2.x+VW*0.12,P2.y-150,70,70);
    const mim=IMG['face-'+G.keeper];if(ok(mim))c.drawImage(mim,Math.max(4,P1.x-VW*0.2-30),P1.y-140,64,64);
    // ドラゴン
    const dm=this.me,de=this.en;
    const p1=this.pos(dm),p2=this.pos(de);
    const l1=Math.sin(dm.lunge*Math.PI)*VW*0.3,l2=Math.sin(de.lunge*Math.PI)*VW*0.3;
    if(de.hp>0||this.over===false)drawDragon(c,p2.x-l2,p2.y+(de.hp<=0?20:0),Math.min(VW*0.17,f.boss?100:86),de.d.sp,de.d.lv,T,-1,{fly:de.hp>0,alt:0.25,flash:de.flash>0&&Math.floor(de.flash*20)%2===0,open:!!de.open,sad:de.hp<=0,sleep:de.hp<=0});
    drawDragon(c,p1.x+l1,p1.y,Math.min(VW*0.17,88),dm.d.sp,dm.d.lv,T,1,{fly:dm.hp>0,alt:0.25,flash:dm.flash>0&&Math.floor(dm.flash*20)%2===0,open:!!dm.open,sad:dm.hp<=0,happy:this.over&&dm.hp>0});
    if(dm.guard){c.strokeStyle='rgba(140,220,255,.8)';c.lineWidth=4;c.beginPath();c.arc(p1.x,p1.y-60,80,0,7);c.stroke();}
    if(de.guard){c.strokeStyle='rgba(140,220,255,.8)';c.lineWidth=4;c.beginPath();c.arc(p2.x,p2.y-60,80,0,7);c.stroke();}
    // ブレス
    this.beams.forEach(b=>{const a=this.pos(b.from),t=this.pos(b.to);const sx=a.x+(b.from.me?50:-50),sy=a.y-80;const n=b.big?30:18;
      for(let i=0;i<n;i++){const p=clamp(b.t/0.5-i*0.02,0,1);if(p<=0)continue;const x=sx+(t.x-sx)*p+Math.sin(i*3+T*20)*8,y=sy+(t.y-60-sy)*p+Math.cos(i*2+T*17)*8;c.globalAlpha=1-b.t/0.7;c.fillStyle=b.cols[i%b.cols.length];c.beginPath();c.arc(x,y,(b.big?16:10)*(1-i/n*0.5),0,7);c.fill();}
      c.globalAlpha=1;
      if(b.big){c.fillStyle='rgba(255,200,80,'+(0.4*(1-b.t/0.7))+')';c.fillRect(0,0,VW,VH);}});
    drawFx(c,0);
  }
};

/* ===================== ループ ===================== */
let last=0,homeCvCtx=null,_pt=0;
function drawHomeCv(){
  const el=$('homeCv');if(!el){homeCvCtx=null;return;}
  const d=cur();if(!d)return;
  const r=el.offsetWidth,h=el.offsetHeight;const dpr=Math.min(2,window.devicePixelRatio||1);
  if(el.width!==Math.round(r*dpr)){el.width=Math.round(r*dpr);el.height=Math.round(h*dpr);}
  const c=el.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,r,h);
  const hungry=d.hunger<15;
  drawDragon(c,r*0.4,h*0.88,Math.min(r*0.36,h*(stageOf(d.lv)>=2?0.42:0.55)),d.sp,d.lv,T,1,{fly:!hungry&&stageOf(d.lv)>=2,alt:0.15,sad:hungry,happy:d.love>60&&!hungry});
  const hp=d.hunger<15?'sad':d.love>=60?'joy':'give';
  drawAkari(c,r*0.78,h*0.92,h*0.55,hp,'L');
  if(hungry){c.font='bold 15px sans-serif';c.fillStyle='#c0392b';c.textAlign='center';c.fillText('おなか ぺこぺこ…',r*0.42,22);}
}
function drawModalDragon(){
  const el=$('mdCv');if(!el)return;
  if(mdStory){const c=el.getContext('2d');c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,el.width,el.height);drawStory(c,el.width,el.height);return;}
  if(!mdDragon)return;
  const c=el.getContext('2d');c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,el.width,el.height);
  c.save();c.translate(el.width/2,el.height/2);c.rotate(T*0.4);c.fillStyle='rgba(255,220,120,.35)';for(let i=0;i<8;i++){c.rotate(Math.PI/4);c.beginPath();c.moveTo(0,0);c.lineTo(-30,-260);c.lineTo(30,-260);c.fill();}c.restore();
  if(mdDragon.egg!==undefined){
    const tt=T-mdDragon.egg,egg=eggImg(mdDragon.sp);
    const ex=el.width/2+(mdDragon.akari?40:0);
    if(mdDragon.akari)drawAkari(c,70,el.height*0.95,el.height*0.72,tt<1.8?'pick':'joy');
    if(tt<1.8){const e1=eggImg(mdDragon.sp,1),e2=eggImg(mdDragon.sp,2);let im=egg;if(tt>1.0&&e1)im=e1;if(tt>1.55&&e2)im=e2;
      if(im){const eh=150,ew=eh*im.naturalWidth/im.naturalHeight,wob=tt>1.55&&e2?0:Math.sin(tt*(8+tt*10))*0.12*Math.min(1,tt*2);c.save();c.translate(ex,el.height*0.88);c.rotate(wob);c.drawImage(im,-ew/2,-eh,ew,eh);
        if(tt>1&&!e1){c.strokeStyle='#3a2a1a';c.lineWidth=3;c.beginPath();c.moveTo(-30,-80);c.lineTo(-12,-92);c.lineTo(2,-78);c.lineTo(16,-94);c.lineTo(30,-82);c.stroke();}c.restore();}
      if(!mdDragon._s1&&tt>1){mdDragon._s1=1;sfx.tap();}
      return;}
    if(!mdDragon._s2){mdDragon._s2=1;sfx.find();}
    if(tt<2.1){c.fillStyle='rgba(255,255,255,'+(1-(tt-1.8)/0.3)+')';c.fillRect(0,0,el.width,el.height);}
  }
  if(mdDragon.akari&&mdDragon.egg===undefined)drawAkari(c,70,el.height*0.95,el.height*0.72,mdDragon.akari);
  drawDragon(c,el.width/2-20+(mdDragon.akari?50:0),el.height*0.9,mdDragon.akari?170:200,mdDragon.sp,mdDragon.lv,T,1,{fly:!mdDragon.sad&&stageOf(mdDragon.lv)>=2,alt:0.15,happy:mdDragon.happy,sad:mdDragon.sad});
}
function drawTitleCv(){
  const el=$('titleCv');if(!$('title').classList.contains('on'))return;
  const r=el.offsetWidth,h=el.offsetHeight;if(!r)return;
  if(el.width!==r*2){el.width=r*2;el.height=h*2;}
  const c=el.getContext('2d');c.setTransform(2,0,0,2,0,0);c.clearRect(0,0,r,h);
  const sps=['fire','water','thunder'];
  sps.forEach((s,i)=>drawDragon(c,r*(0.2+i*0.3),h*0.92-(i===1?h*0.06:0),i===1?Math.min(120,h*0.5):Math.min(92,h*0.4),s,i===1?32:14,T+i,i===2?-1:1,{fly:true,alt:0.3+(i===1?0.2:0),shadow:true}));
}
function loop(ts){
  const dt=Math.min(0.05,(ts-last)/1000||0);last=ts;T+=dt;
  try{
    if(scene&&$('stage').classList.contains('on')){scene.update(dt);cx.setTransform(DPR*U,0,0,DPR*U,0,0);cx.clearRect(0,0,VW,VH);scene.draw();}
    if(MAPV.on)mapTick(dt);
    if(homeOn){try{yardUpdate(dt);yardDraw();}catch(e){console.error(e);}_pt+=dt;if(_pt>1){_pt=0;updTop();}}
    if((mdDragon||mdStory)&&$('modal').classList.contains('on'))drawModalDragon();
    drawTitleCv();
  }catch(e){console.error(e);}
  requestAnimationFrame(loop);
}
preloadSprites(['fire','water','thunder']);
renderTitle();
requestAnimationFrame(loop);
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{});}
</script>
