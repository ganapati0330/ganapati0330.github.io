<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f7e7c9">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>フテ猫れんさパズル</title>
<style>
:root{--bg:#fbf3e4;--ink:#4a3424;--orange:#f08a24;--orange-d:#c9661a;--pink:#ef6f9a;--panel:#fffaf0;--line:#e7d3b0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Hiragino Maru Gothic ProN","Hiragino Maru Gothic Pro","BIZ UDPGothic","Meiryo",sans-serif;overflow:hidden;touch-action:manipulation}
body{display:flex;flex-direction:column;height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.screen{display:none;flex:1;flex-direction:column;min-height:0}
.screen.on{display:flex}
/* title */
#title{align-items:center;justify-content:flex-start;overflow-y:auto;padding:14px 16px 20px;gap:10px}
.logo{text-align:center;margin-top:6px}
.logo h1{margin:0;font-size:34px;letter-spacing:2px;color:var(--orange);text-shadow:3px 3px 0 #fff,5px 5px 0 #e9c79a}
.logo h1 span{color:var(--ink);font-size:24px;display:block;text-shadow:2px 2px 0 #fff}
.faces{display:flex;gap:8px;justify-content:center;margin:6px 0}
.faces img{width:min(56px,15vw);height:min(56px,15vw);border-radius:50%;border:4px solid;background:#fff;object-fit:cover}
.box{background:var(--panel);border:3px solid var(--line);border-radius:18px;padding:12px;width:100%;max-width:420px}
.box h2{margin:0 0 8px;font-size:17px;display:flex;align-items:center;gap:6px}
.row{display:flex;gap:8px}
.btn{appearance:none;border:none;border-radius:14px;padding:12px 8px;font:inherit;font-weight:bold;font-size:clamp(13px,4vw,16px);color:#fff;background:var(--orange);white-space:nowrap;box-shadow:0 4px 0 var(--orange-d);cursor:pointer;flex:1;line-height:1.25}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--orange-d)}
.btn small{display:block;font-size:11px;font-weight:normal;opacity:.95}
.btn.g{background:#5bb36a;box-shadow:0 4px 0 #3e8a4c}
.btn.b{background:#4d8fd6;box-shadow:0 4px 0 #2f68a6}
.btn.p{background:var(--pink);box-shadow:0 4px 0 #c24d76}
.btn.k{background:#6a4c93;box-shadow:0 4px 0 #4a3268}
.btn.w{background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.opp{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px}
.opp img{width:48px;height:48px;border-radius:50%;background:#fff;object-fit:cover;border:3px solid #fff}
.hs{margin-top:12px;font-size:12px;text-align:center;opacity:.8}
.foot{font-size:11px;opacity:.6;text-align:center;margin-top:4px}
/* game */
#game{position:relative}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
canvas{display:block;touch-action:none}
#pauseBtn{position:absolute;top:6px;left:50%;transform:translateX(-50%);z-index:20;width:40px;height:40px;border-radius:12px;border:2px solid var(--line);background:#fffaf0;font-size:18px;color:var(--ink);font-weight:bold}
#ctrl{display:flex;gap:6px;padding:6px 8px 10px;justify-content:center}
#ctrl button{flex:1;max-width:82px;height:70px;border-radius:18px;border:none;font-size:30px;font-weight:bold;color:#fff;background:#d98b4a;box-shadow:0 5px 0 #a8642c;touch-action:none;font-family:inherit}
#ctrl button.rot{background:#4d8fd6;box-shadow:0 5px 0 #2f68a6}
#ctrl button.dn{background:#5bb36a;box-shadow:0 5px 0 #3e8a4c}
#ctrl button.act{transform:translateY(4px);box-shadow:0 1px 0 #555}
/* overlay */
#ov{position:fixed;inset:0;background:rgba(74,52,36,.55);display:none;align-items:center;justify-content:center;z-index:3000;padding:16px}
#ov.on{display:flex}
#ovBox{background:var(--panel);border-radius:22px;border:4px solid var(--line);padding:18px 16px;width:100%;max-width:360px;text-align:center;max-height:90dvh;overflow-y:auto}
#ovBox h3{margin:4px 0 10px;font-size:22px;color:var(--orange)}
#ovBox p{margin:6px 0;font-size:15px;line-height:1.6;text-align:left}
#ovBox .big{font-size:28px;font-weight:bold;text-align:center;margin:6px 0}
#ovBox img{width:84px;height:84px;object-fit:cover;border-radius:16px}
#ovBox .btn{margin-top:8px;display:block;width:100%}
/* net */
#net{overflow-y:auto;align-items:center;padding:10px 16px 24px;gap:10px}
.nethead{display:flex;align-items:center;gap:10px;width:100%;max-width:420px}
.nethead .btn{flex:0 0 auto;padding:8px 12px;font-size:14px}
.nethead h2{margin:0;font-size:20px;color:var(--orange)}
.note{margin:0 0 8px;font-size:13px;opacity:.8}
.pick{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:3px solid var(--line);background:#fff;border-radius:14px;padding:6px 2px;font:inherit;font-size:11px;font-weight:bold;color:var(--ink);white-space:nowrap}
.pick img{width:44px;height:44px;border-radius:10px;object-fit:cover}
.pick.on{border-color:var(--orange);background:#fff1dd;box-shadow:0 0 0 2px var(--orange)}
#conn-steps{width:100%;max-width:420px;display:flex;flex-direction:column;gap:10px}
.step{background:var(--panel);border:3px solid var(--line);border-radius:18px;padding:12px}
.step h3{margin:0 0 8px;font-size:16px}
.step .row{margin-top:8px}
.qr{background:#fff;border-radius:12px;padding:10px;display:flex;justify-content:center;min-height:120px}
.status{font-size:13px;margin:8px 0 0;line-height:1.5}
textarea{width:100%;margin-top:8px;font-size:16px;border:2px solid var(--line);border-radius:10px;padding:6px;height:56px;resize:none;user-select:text;-webkit-user-select:text;font-family:monospace;background:#fff;color:var(--ink)}
.spin{display:inline-block;width:14px;height:14px;border:3px solid var(--line);border-top-color:var(--orange);border-radius:50%;animation:sp 1s linear infinite;margin-right:6px;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
#scanner{position:fixed;inset:0;background:#000;z-index:3500;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px}
#scanner.on{display:flex}
#scanner video{width:100%;max-width:480px;border-radius:14px;background:#222}
#scan-msg{color:#fff;font-size:15px;text-align:center}
#scanner .btn{flex:0 0 auto;width:200px}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:rgba(74,52,36,.92);color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;z-index:4000;opacity:0;pointer-events:none;transition:opacity .2s;max-width:86vw;text-align:center}
#toast.on{opacity:1}
.ver{position:fixed;left:6px;bottom:2px;font-size:10px;opacity:.4;pointer-events:none;z-index:5}
</style>
</head>
<body>
<div id="title" class="screen on">
  <div class="logo"><h1>フテ猫<span>れんさパズル</span></h1></div>
  <div class="faces" id="tFaces"></div>
  <div class="box">
    <h2>🐾 ひとりで</h2>
    <div class="row">
      <button class="btn g" data-solo="0">かんたん<small>ゆっくり</small></button>
      <button class="btn" data-solo="1">ふつう<small>4しょく</small></button>
      <button class="btn p" data-solo="2">むずかしい<small>5しょく</small></button>
    </div>
    <div class="hs" id="hsLine"></div>
  </div>
  <div class="box">
    <h2>⚔️ あかりちゃんと たいせん</h2>
    <div class="row">
      <button class="btn p opp" data-vs="0"><img id="oChap" alt="">チャッピー<small>やさしい</small></button>
      <button class="btn k opp" data-vs="1"><img id="oKuro" alt="">クロネコ<small>ふつう</small></button>
      <button class="btn opp" data-vs="2"><img id="oFute" alt="">フテ猫<small>つよい</small></button>
    </div>
  </div>
  <div class="box">
    <h2>📡 2だいで たいせん</h2>
    <div class="row"><button class="btn b" id="netBtn">つうしん たいせん<small>おなじ Wi-Fi の スマホ・パソコンと</small></button></div>
  </div>
  <div class="row" style="width:100%;max-width:420px">
    <button class="btn w" id="howBtn">あそびかた</button>
    <button class="btn w" id="sndBtn">おと：ON</button>
  </div>
  <div class="foot">© 泉正道 / フテ猫実行委員会　<span id="verLbl"></span></div>
</div>

<div id="game" class="screen">
  <div id="stage"><canvas id="cv"></canvas><button id="pauseBtn" aria-label="ていし">Ⅱ</button></div>
  <div id="ctrl">
    <button class="rot" data-k="rl" aria-label="ひだりまわし">↺</button>
    <button data-k="l" aria-label="ひだり">◀</button>
    <button class="dn" data-k="d" aria-label="した">▼</button>
    <button data-k="r" aria-label="みぎ">▶</button>
    <button class="rot" data-k="rr" aria-label="みぎまわし">↻</button>
  </div>
</div>

<div id="net" class="screen">
  <div class="nethead"><button class="btn w" id="netBack">← もどる</button><h2 id="conn-title">つうしんたいせん</h2></div>
  <div class="box"><h2>🐾 じぶんの キャラ</h2><div class="row" id="chPick"></div></div>
  <div class="box" id="roleBox">
    <h2>📡 どっちに する？</h2>
    <p class="note">2だいとも おなじ Wi-Fi に つないでね。ひとりが 親機、もうひとりが 子機。</p>
    <div class="row">
      <button class="btn" id="btnHost">親機に なる<small>さきに QRを だす</small></button>
      <button class="btn b" id="btnGuest">子機に なる<small>QRを よみとる</small></button>
    </div>
  </div>
  <div id="conn-steps"></div>
</div>
<div id="scanner"><video id="scan-video" playsinline muted></video><div id="scan-msg"></div><button class="btn w" id="scan-close">とじる</button></div>
<div id="toast"></div>
<div id="ov"><div id="ovBox"></div></div>

/* ---------- 操作 ---------- */
function move(p, dx) {
  if (p.state !== 'fall' || !p.pair) return false;
  var n = { x: p.pair.x + dx, y: p.pair.y, r: p.pair.r, pc: p.pair.pc, cc: p.pair.cc };
  if (!pairFits(p.g, n)) return false;
  p.pair = n; touchLock(p); if (!p.cpu) SFX.move(); return true;
}
function rotate(p, dir) {
  if (p.state !== 'fall' || !p.pair) return false;
  var n = tryRotate(p.g, p.pair, dir);
  if (!n) {
    if (G.t - p.lastRotFail < 0.45) { n = quickTurn(p.g, p.pair); p.lastRotFail = -9; }
    else { p.lastRotFail = G.t; return false; }
    if (!n) return false;
  }
  if (n.y < p.pair.y) p.fallT = 0;
  p.pair = n; touchLock(p); if (!p.cpu) SFX.rot(); return true;
}
function touchLock(p) { if (p.lockT > 0 && p.lockReset < 8) { p.lockT = 0; p.lockReset++; } }

/* ---------- 更新 ---------- */
function update(dt) {
  if (!G || paused) return;
  if (G.countdown > 0) { G.countdown -= dt; tickFx(dt); return; }
  G.t += dt;
  if (G.mode !== 'solo' && !G.over) {
    var sp = Math.max(260, G.base - Math.max(0, G.t - 60) * 2.5);
    G.players.forEach(function (p) { p.speed = sp; });
  }
  for (var i = 0; i < G.players.length; i++) { var pl = G.players[i]; if (!pl.remote && (!G.over || pl.dead)) stepPlayer(pl, dt); }
  if (G.mode === 'net') tickNet(dt);
  tickFx(dt);
  if (G.over) {
    G.overT += dt;
    if (G.overT > 1.8 && !G.shown) { G.shown = true; showResult(); }
  }
}
function tickFx(dt) {
  G.players.forEach(function (p) {
    if (p.msgT > 0) p.msgT -= dt;
    if (p.faceT > 0) { p.faceT -= dt; if (p.faceT <= 0 && !p.dead) p.face = 'n'; }
    if (p.chainFx) { p.chainFx.t += dt; if (p.chainFx.t > 1.1) p.chainFx = null; }
    for (var i = p.sparks.length - 1; i >= 0; i--) {
      var s = p.sparks[i]; s.t += dt; s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 14 * dt;
      if (s.t > 0.7) p.sparks.splice(i, 1);
    }
    if (p.dead) p.deadT += dt;
    if (p.remote && p.pops) { p.popT += dt; if (p.popT >= 0.5) p.pops = null; }
  });
}
function stepPlayer(p, dt) {
  switch (p.state) {
    case 'spawn': spawn(p); break;
    case 'fall': stepFall(p, dt); break;
    case 'settle':
      p.anim.t += dt;
      var done = true;
      for (var i = 0; i < p.anim.moves.length; i++) { if (animPos(p.anim.moves[i], p.anim.t) < p.anim.moves[i].to) { done = false; break; } }
      if (done) { var nx = p.anim.next; p.anim = null; p.hidden = {}; if (nx === 'chk' || nx === 'oj') { /* 着地 */ } afterSettle(p, nx); }
      break;
    case 'pop':
      p.popT += dt;
      if (p.popT >= 0.5) { clearPops(p.g, p.pops); p.pops = null; startSettle(p, applyGravity(p.g), 'chk'); }
      break;
    default: break;
  }
}
function stepFall(p, dt) {
  if (p.cpu) cpuStep(p, dt);
  var interval = p.soft ? 32 : p.speed;
  p.fallT += dt * 1000;
  while (p.fallT >= interval) {
    var n = { x: p.pair.x, y: p.pair.y + 1, r: p.pair.r, pc: p.pair.pc, cc: p.pair.cc };
    if (pairFits(p.g, n)) { p.pair = n; p.fallT -= interval; p.lockT = 0; if (p.soft && !p.cpu) p.score += 1; }
    else { p.fallT = interval; break; }
  }
  var below = { x: p.pair.x, y: p.pair.y + 1, r: p.pair.r, pc: p.pair.pc, cc: p.pair.cc };
  if (!pairFits(p.g, below)) {
    p.lockT += dt * 1000;
    if (p.lockT >= (p.soft ? 70 : 420)) lockPair(p);
  }
}
function cpuStep(p, dt) {
  var o = p.cpu, ai = p.ai;
  if (!ai.plan) {
    var q = opponent(p);
    ai.plan = aiChoose(p.g, p.pair, G.seq(p.seqIdx), G.nc, o.level, { pending: p.pending, opp: q ? maxHeight(q.g) : 0 }, p.rnd);
    ai.t = -o.step * 1.2;
    p.soft = false;
  }
  ai.t += dt * 1000;
  while (ai.t >= o.step) {
    ai.t -= o.step;
    var pl = ai.plan, pr = p.pair;
    if (!pr) return;
    if (pr.r !== pl.r) {
      var d = ((pl.r - pr.r + 4) % 4) === 3 ? -1 : 1;
      if (!rotate(p, d)) { ai.fails++; if (!rotate(p, d)) ai.fails++; }
    } else if (pr.x !== pl.x) {
      if (!move(p, pl.x > pr.x ? 1 : -1)) ai.fails++;
    } else {
      p.soft = o.level > 0 || pr.y > 3;
    }
    if (ai.fails > 6) p.soft = true;
  }
}

/* ---------- 描画 ---------- */
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function drawPiece(cx, cy, s, c, alpha, popping) {
  var R = s * 0.47;
  ctx.save(); ctx.globalAlpha = alpha == null ? 1 : alpha;
  if (popping) { ctx.translate(cx, cy); ctx.scale(popping, popping); ctx.translate(-cx, -cy); }
  if (c === OJ) {
    var gr = ctx.createRadialGradient(cx - R * 0.3, cy - R * 0.3, R * 0.1, cx, cy, R);
    gr.addColorStop(0, '#f1ece3'); gr.addColorStop(1, '#a9a196');
    ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(cx, cy, R, 0, 7); ctx.fill();
    ctx.strokeStyle = '#7d756a'; ctx.lineWidth = Math.max(1, s * 0.05); ctx.stroke();
    ctx.fillStyle = '#7d756a';
    ctx.beginPath(); ctx.arc(cx, cy + R * 0.18, R * 0.26, 0, 7); ctx.fill();
    for (var i = 0; i < 4; i++) { var a = -2.4 + i * 0.55; ctx.beginPath(); ctx.arc(cx + Math.cos(a) * R * 0.5, cy + R * 0.08 + Math.sin(a) * R * 0.5, R * 0.11, 0, 7); ctx.fill(); }
    ctx.restore(); return;
  }
  var P = PIECE[c];
  ctx.fillStyle = P.col; ctx.beginPath(); ctx.arc(cx, cy, R, 0, 7); ctx.fill();
  var im = IMGS[P.img];
  if (im && im.complete && im.naturalWidth) {
    ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, R * 0.8, 0, 7); ctx.clip();
    ctx.drawImage(im, cx - R * 0.8, cy - R * 0.8, R * 1.6, R * 1.6); ctx.restore();
  }
  ctx.strokeStyle = P.dark; ctx.lineWidth = Math.max(1.2, s * 0.06); ctx.beginPath(); ctx.arc(cx, cy, R, 0, 7); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.beginPath(); ctx.ellipse(cx - R * 0.45, cy - R * 0.62, R * 0.22, R * 0.12, -0.6, 0, 7); ctx.fill();
  ctx.restore();
}
function drawBoard(p) {
  var L = p.lay, s = L.cell, bx = L.bx, by = L.by, W = s * COLS, H = s * (ROWS - 1);
  ctx.save();
  // 枠
  rr(bx - 4, by - 4, W + 8, H + 8, 12); ctx.fillStyle = '#e9cfa3'; ctx.fill();
  rr(bx, by, W, H, 9); ctx.fillStyle = p.dead ? '#d9d2c6' : '#fff8ea'; ctx.fill();
  // 格子
  ctx.save(); rr(bx, by, W, H, 9); ctx.clip();
  ctx.strokeStyle = 'rgba(200,170,120,.18)'; ctx.lineWidth = 1;
  for (var gx = 1; gx < COLS; gx++) { ctx.beginPath(); ctx.moveTo(bx + gx * s, by); ctx.lineTo(bx + gx * s, by + H); ctx.stroke(); }
  // ×マーク（ここが埋まるとまけ）
  ctx.strokeStyle = 'rgba(230,80,80,.35)'; ctx.lineWidth = 3;
  var xx = bx + 2 * s + s / 2, xy = by + s / 2;
  ctx.beginPath(); ctx.moveTo(xx - s * 0.22, xy - s * 0.22); ctx.lineTo(xx + s * 0.22, xy + s * 0.22); ctx.moveTo(xx + s * 0.22, xy - s * 0.22); ctx.lineTo(xx - s * 0.22, xy + s * 0.22); ctx.stroke();
  var sink = p.dead ? Math.min(1, p.deadT / 1.2) * H : 0;
  ctx.translate(0, sink);
  // つながり
  var popSet = {};
  if (p.pops) { p.pops.cells.forEach(function (c) { popSet[c[0] + ',' + c[1]] = 1; }); p.pops.ojama.forEach(function (c) { popSet[c[0] + ',' + c[1]] = 1; }); }
  var y, x, c;
  for (y = 1; y < ROWS; y++) {
    for (x = 0; x < COLS; x++) {
      c = p.g[y][x];
      if (c < 1 || c > 5 || p.hidden[x + ',' + y]) continue;
      ctx.fillStyle = PIECE[c].col;
      if (x + 1 < COLS && p.g[y][x + 1] === c && !p.hidden[(x + 1) + ',' + y]) ctx.fillRect(bx + x * s + s / 2, by + (y - 1) * s + s * 0.28, s, s * 0.44);
      if (y + 1 < ROWS && p.g[y + 1][x] === c && !p.hidden[x + ',' + (y + 1)]) ctx.fillRect(bx + x * s + s * 0.28, by + (y - 1) * s + s / 2, s * 0.44, s);
    }
  }
  for (y = 1; y < ROWS; y++) {
    for (x = 0; x < COLS; x++) {
      c = p.g[y][x];
      if (!c || p.hidden[x + ',' + y]) continue;
      var pp = null, al = 1;
      if (popSet[x + ',' + y]) { var k = p.popT; al = (Math.floor(k * 14) % 2) ? 0.35 : 1; pp = 1 + k * 0.5; }
      drawPiece(bx + x * s + s / 2, by + (y - 1) * s + s / 2, s, c, al, pp);
    }
  }
  if (p.anim) {
    p.anim.moves.forEach(function (m) {
      var py = animPos(m, p.anim.t);
      drawPiece(bx + m.x * s + s / 2, by + (py - 1) * s + s / 2, s, m.c);
    });
  }
  ctx.restore();
  // 操作中ペア（上に少しはみ出してよい）
  if (p.pair && p.state === 'fall') {
    ctx.save(); ctx.beginPath(); ctx.rect(bx, by - s * 0.6, W, H + s * 0.6); ctx.clip();
    var pr = p.pair, o = childOffset(pr.r);
    var below = pairFits(p.g, { x: pr.x, y: pr.y + 1, r: pr.r });
    var off = below ? Math.min(1, p.fallT / (p.soft ? 32 : p.speed)) : 0;
    // ゴースト（おちる場所）
    var gp = { x: pr.x, y: pr.y, r: pr.r };
    while (pairFits(p.g, { x: gp.x, y: gp.y + 1, r: gp.r })) gp.y++;
    if (!p.cpu && !p.remote) {
      ctx.globalAlpha = 0.28;
      ctx.fillStyle = PIECE[pr.pc].col; ctx.beginPath(); ctx.arc(bx + gp.x * s + s / 2, by + (gp.y - 1) * s + s / 2, s * 0.18, 0, 7); ctx.fill();
      ctx.fillStyle = PIECE[pr.cc].col; ctx.beginPath(); ctx.arc(bx + (gp.x + o[0]) * s + s / 2, by + (gp.y + o[1] - 1) * s + s / 2, s * 0.18, 0, 7); ctx.fill();
      ctx.globalAlpha = 1;
    }
    var py = by + (pr.y - 1 + off) * s + s / 2, px = bx + pr.x * s + s / 2;
    drawPiece(px + o[0] * s, py + o[1] * s, s, pr.cc);
    drawPiece(px, py, s, pr.pc);
    // じくの目印
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(px, py, s * 0.5, 0, 7); ctx.stroke();
    ctx.restore();
  }
  // 火花
  p.sparks.forEach(function (sp) {
    ctx.globalAlpha = Math.max(0, 1 - sp.t / 0.7); ctx.fillStyle = sp.col;
    ctx.beginPath(); ctx.arc(bx + sp.x * s, by + (sp.y - 1) * s + s, s * 0.13, 0, 7); ctx.fill();
  });
  ctx.globalAlpha = 1;
  // れんさ表示
  if (p.chainFx) {
    var t = p.chainFx.t, sc = t < 0.15 ? t / 0.15 * 1.25 : (t < 0.3 ? 1.25 - (t - 0.15) / 0.15 * 0.25 : 1);
    ctx.save(); ctx.translate(bx + W / 2, by + H * 0.42 - Math.min(t, 0.6) * 20); ctx.scale(sc, sc);
    ctx.globalAlpha = t > 0.8 ? Math.max(0, 1 - (t - 0.8) / 0.3) : 1;
    var fs = Math.round(s * 1.05);
    ctx.font = 'bold ' + fs + 'px "Hiragino Maru Gothic ProN",sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    var txt = p.chainFx.n + 'れんさ！';
    ctx.lineWidth = 6; ctx.strokeStyle = '#fff'; ctx.strokeText(txt, 0, 0);
    var cols = ['#f08a24', '#ef6f9a', '#4d8fd6', '#7a5aa8', '#e04040'];
    ctx.fillStyle = cols[(p.chainFx.n - 1) % cols.length]; ctx.fillText(txt, 0, 0);
    ctx.restore();
  }
  if (p.dead && p.deadT > 0.4) {
    ctx.font = 'bold ' + Math.round(s * 0.8) + 'px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 5; ctx.strokeStyle = '#fff'; ctx.strokeText('まいった〜', bx + W / 2, by + H * 0.35);
    ctx.fillStyle = '#6a4c93'; ctx.fillText('まいった〜', bx + W / 2, by + H * 0.35);
  }
  ctx.restore();
}
function drawNext(p, x, y, s, idx) {
  var q = G.seq(p.seqIdx + idx);
  drawPiece(x + s / 2, y + s / 2, s, q[1]);
  drawPiece(x + s / 2, y + s * 1.5, s, q[0]);
}
function drawPortrait(p, x, y, sz) {
  var key = CHARS[p.ch][p.face] || CHARS[p.ch].n;
  ctx.save(); rr(x, y, sz, sz, sz * 0.22); ctx.fillStyle = '#fff'; ctx.fill(); ctx.clip();
  var im = IMGS[key]; if (im && im.complete && im.naturalWidth) ctx.drawImage(im, x, y, sz, sz);
  ctx.restore();
  ctx.save(); rr(x, y, sz, sz, sz * 0.22); ctx.strokeStyle = '#e9cfa3'; ctx.lineWidth = 3; ctx.stroke(); ctx.restore();
}
function drawBubble(p, x, y, maxW, align) {
  if (p.msgT <= 0 || !p.msg) return;
  ctx.save(); ctx.globalAlpha = Math.min(1, p.msgT * 3);
  ctx.font = 'bold 12px "Hiragino Maru Gothic ProN",sans-serif';
  var w = Math.min(maxW, ctx.measureText(p.msg).width + 16), h = 24;
  var bx = align === 'right' ? x - w : x;
  rr(bx, y, w, h, 10); ctx.fillStyle = '#fff'; ctx.fill(); ctx.strokeStyle = '#e0c89c'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#4a3424'; ctx.textBaseline = 'middle'; ctx.textAlign = 'center';
  ctx.fillText(p.msg, bx + w / 2, y + h / 2, w - 8);
  ctx.restore();
}
function drawPending(p, x, y, maxW) {
  var n = p.pending, icons = [];
  while (n >= 30 && icons.length < 6) { icons.push(30); n -= 30; }
  while (n >= 6 && icons.length < 6) { icons.push(6); n -= 6; }
  while (n >= 1 && icons.length < 6) { icons.push(1); n -= 1; }
  var cx = x;
  icons.forEach(function (v) {
    var r = v === 30 ? 10 : (v === 6 ? 8 : 5);
    if (v === 30) { ctx.fillStyle = '#e05050'; ctx.beginPath(); ctx.arc(cx + r, y, r, 0, 7); ctx.fill(); ctx.fillStyle = '#fff'; ctx.font = 'bold 10px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('!', cx + r, y + 1); }
    else drawPiece(cx + r, y, r * 2.1, OJ);
    cx += r * 2 + 3;
  });
}
function txt(s, x, y, size, col, align, bold) {
  ctx.font = (bold === false ? '' : 'bold ') + size + 'px "Hiragino Maru Gothic ProN","BIZ UDPGothic",sans-serif';
  ctx.fillStyle = col || '#4a3424'; ctx.textAlign = align || 'left'; ctx.textBaseline = 'middle'; ctx.fillText(s, x, y);
}
function render() {
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  ctx.clearRect(0, 0, LW, LH);
  if (!G) return;
  if (G.mode === 'solo') renderSolo(); else renderVs();
  if (G.countdown > 0) {
    ctx.save(); ctx.fillStyle = 'rgba(255,248,234,.6)'; ctx.fillRect(0, 0, LW, LH);
    var t = G.countdown > 0.8 ? 'よーい' : 'スタート！';
    ctx.font = 'bold 40px "Hiragino Maru Gothic ProN",sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 8; ctx.strokeStyle = '#fff'; ctx.strokeText(t, LW / 2, LH / 2); ctx.fillStyle = '#f08a24'; ctx.fillText(t, LW / 2, LH / 2);
    ctx.restore();
  }
}
function renderSolo() {
  var p = G.players[0];
  txt(['かんたん', 'ふつう', 'むずかしい'][G.lv], 14, 22, 15, '#c9661a');
  txt('レベル ' + (G.level || 1), 14, 44, 13, '#4a3424', 'left', false);
  drawBoard(p);
  var rx = 246;
  txt('つぎ', rx, 72, 13, '#4a3424');
  rr(rx - 4, 82, 54, 86, 10); ctx.fillStyle = '#fffaf0'; ctx.fill(); ctx.strokeStyle = '#e9cfa3'; ctx.lineWidth = 2; ctx.stroke();
  drawNext(p, rx + 6, 89, 34, 0);
  rr(rx + 56, 92, 40, 66, 10); ctx.fillStyle = '#fffaf0'; ctx.fill(); ctx.stroke();
  drawNext(p, rx + 63, 101, 26, 1);
  txt('スコア', rx, 196, 13);
  txt(String(p.score), rx + 100, 218, 20, '#c9661a', 'right');
  txt('さいだい れんさ', rx, 248, 12);
  txt(Math.max(p.maxChain, p.chain) + ' れんさ', rx + 100, 268, 17, '#ef6f9a', 'right');
  txt('ハイスコア', rx, 298, 12);
  txt(String(Math.max(hiscore[G.lv], p.score)), rx + 100, 316, 15, '#4a3424', 'right');
  drawPortrait(p, rx, 360, 100);
  txt('あかりちゃん', rx + 50, 470, 12, '#4a3424', 'center');
  drawBubble(p, rx + 100, 330, 110, 'right');
}
function renderVs() {
  var A = G.players[0], B = G.players[1];
  // 上の帯：顔・名前・つぎ
  drawPortrait(A, 6, 6, 62);
  txt(CHARS[A.ch].name, 74, 16, 12);
  drawNext(A, 76, 28, 22, 0);
  drawNext(A, 102, 40, 16, 1);
  drawPortrait(B, LW - 68, 6, 62);
  txt(CHARS[B.ch].name, LW - 74, 16, 12, '#4a3424', 'right');
  drawNext(B, LW - 98, 28, 22, 0);
  drawNext(B, LW - 118, 40, 16, 1);
  txt('VS', LW / 2, 64, 18, '#e05050', 'center');
  drawBubble(A, 6, 76, 168, 'left');
  drawBubble(B, LW - 6, 76, 168, 'right');
  drawPending(A, 8, 110, 150);
  drawPending(B, 188, 110, 150);
  drawBoard(A); drawBoard(B);
  txt(String(A.score), 6 + 84, 486, 18, '#c9661a', 'center');
  txt(String(B.score), 186 + 84, 486, 18, '#7a5aa8', 'center');
  txt('スコア', LW / 2, 486, 11, '#4a3424', 'center', false);
}

/* ---------- 画面 ---------- */
function show(id) { ['title', 'game', 'net'].forEach(function (s) { document.getElementById(s).classList.toggle('on', s === id); }); }
var ov = document.getElementById('ov'), ovBox = document.getElementById('ovBox');
function openOv(html, binds) {
  ovBox.innerHTML = html; ov.classList.add('on');
  Object.keys(binds || {}).forEach(function (id) {
    var el = document.getElementById(id);
    if (el) el.addEventListener('click', function () { SFX.btn(); binds[id](); });
  });
}
function closeOv() { ov.classList.remove('on'); ovBox.innerHTML = ''; }
function img(k) { return '<img src="' + IMG[k] + '" alt="">'; }
function showResult() {
  if (G.mode === 'net') { netResult(); return; }
  var p = G.players[0];
  if (G.mode === 'solo') {
    openOv('<h3>ゲームオーバー</h3>' + img('akari_s') +
      '<div class="big">' + p.score + ' てん</div>' +
      '<p style="text-align:center">さいだい ' + p.maxChain + ' れんさ' + (G.newHi ? '<br><b style="color:#ef6f9a">ハイスコア こうしん！</b>' : '') + '</p>' +
      '<button class="btn" id="oRetry">もういちど</button><button class="btn w" id="oTitle">タイトルへ</button>',
      { oRetry: function () { closeOv(); startSolo(G.lv); }, oTitle: toTitle });
  } else {
    var win = G.winner === p, q = G.players[1];
    openOv('<h3>' + (win ? 'あかりちゃんの かち！' : CHARS[q.ch].name + 'の かち…') + '</h3>' +
      '<div style="display:flex;gap:10px;justify-content:center">' + img(win ? 'akari_h' : 'akari_s') + img(CHARS[q.ch][win ? 's' : 'h']) + '</div>' +
      '<p style="text-align:center">「' + (win ? CHARS[q.ch].lose : CHARS[q.ch].win) + '」</p>' +
      '<p style="text-align:center">あかりちゃん さいだい ' + p.maxChain + ' れんさ</p>' +
      '<button class="btn" id="oRetry">もういちど</button><button class="btn w" id="oTitle">タイトルへ</button>',
      { oRetry: function () { closeOv(); startVs(G.oi); }, oTitle: toTitle });
  }
}
function toTitle() { closeOv(); G = null; paused = false; show('title'); refreshTitle(); }
function pause() {
  if (!G || G.over || paused) return;
  if (G.mode === 'net') { if (!ov.classList.contains('on')) netPause(); return; }
  paused = true;
  openOv('<h3>ひとやすみ</h3>' + img('fute_s') +
    '<button class="btn g" id="oRes">つづける</button><button class="btn w" id="oQuit">やめてタイトルへ</button>',
    { oRes: function () { closeOv(); paused = false; }, oQuit: toTitle });
}

<script id="net">'use strict';
/* ===== 通信たいせん（WebRTC DataChannel・サーバーなし） =====
   接続のしくみはフテ猫テニスと同じ。SDPを短いコードにして、QRコードかリンクで手わたしする。 */

/* ---------- SDP を短いコードにする ---------- */
const SDPC = (function () {
  const MAGIC = 'FR1';
  const SEP = '~';
  function hexToB64(hex) {
    const parts = hex.split(':');
    let s = '';
    for (const p of parts) s += String.fromCharCode(parseInt(p, 16));
    return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  const MDNS_RE = /^([0-9a-f]{8})-([0-9a-f]{4})-([0-9a-f]{4})-([0-9a-f]{4})-([0-9a-f]{12})\.local$/i;
  function packHost(h) {
    const m = MDNS_RE.exec(h);
    if (!m) return h;
    const hex = (m[1] + m[2] + m[3] + m[4] + m[5]).toLowerCase();
    let bin = '';
    for (let i = 0; i < 32; i += 2) bin += String.fromCharCode(parseInt(hex.substr(i, 2), 16));
    return 'm' + btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  function unpackHost(h) {
    if (h.charAt(0) !== 'm' || h.length !== 23) return h;
    let t = h.slice(1).replace(/-/g, '+').replace(/_/g, '/');
    while (t.length % 4) t += '=';
    let bin;
    try { bin = atob(t); } catch (e) { return h; }
    if (bin.length !== 16) return h;
    let hex = '';
    for (let i = 0; i < 16; i++) hex += bin.charCodeAt(i).toString(16).padStart(2, '0');
    return hex.slice(0, 8) + '-' + hex.slice(8, 12) + '-' + hex.slice(12, 16) + '-' + hex.slice(16, 20) + '-' + hex.slice(20) + '.local';
  }
  function b64ToHex(b64) {
    let t = b64.replace(/-/g, '+').replace(/_/g, '/');
    while (t.length % 4) t += '=';
    const s = atob(t), out = [];
    for (let i = 0; i < s.length; i++) out.push(s.charCodeAt(i).toString(16).padStart(2, '0').toUpperCase());
    return out.join(':');
  }
  function pack(sdp, type) {
    const g = re => { const m = re.exec(sdp); return m ? m[1] : ''; };
    const ufrag = g(/a=ice-ufrag:(\S+)/), pwd = g(/a=ice-pwd:(\S+)/), fp = g(/a=fingerprint:sha-256 (\S+)/i);
    if (!ufrag || !pwd || !fp) throw new Error('せつぞくの じゅんびに しっぱいしました');
    const host = [], srflx = [], seen = {};
    const re = /a=candidate:\S+ (\d+) (udp|UDP) \d+ (\S+) (\d+) typ (host|srflx)/g;
    let m;
    while ((m = re.exec(sdp))) {
      if (m[1] !== '1') continue;
      if (m[3].indexOf(':') >= 0) continue;
      const key = m[3] + ':' + m[4];
      if (seen[key]) continue;
      seen[key] = 1;
      (m[5] === 'srflx' ? srflx : host).push((m[5] === 'srflx' ? 's' : 'h') + packHost(m[3]) + ',' + m[4]);
    }
    const cands = srflx.slice(0, 2).concat(host.slice(0, 3));
    return [MAGIC, type === 'offer' ? 'O' : 'A', ufrag, pwd, hexToB64(fp), cands.join(';')].join(SEP);
  }
  function unpack(code) {
    const c = String(code || '').trim().replace(/\s+/g, '');
    const p = c.split(SEP);
    if (p.length < 6 || p[0] !== MAGIC) throw new Error('このゲームの コードでは ありません');
    const type = p[1] === 'O' ? 'offer' : 'answer';
    const cands = p[5] ? p[5].split(';').filter(Boolean) : [];
    const L = [
      'v=0', 'o=- 4611731400430051336 2 IN IP4 127.0.0.1', 's=-', 't=0 0',
      'a=group:BUNDLE 0', 'a=extmap-allow-mixed', 'a=msid-semantic: WMS',
      'm=application 9 UDP/DTLS/SCTP webrtc-datachannel', 'c=IN IP4 0.0.0.0',
      'a=ice-ufrag:' + p[2], 'a=ice-pwd:' + p[3], 'a=ice-options:trickle',
      'a=fingerprint:sha-256 ' + b64ToHex(p[4]),
      'a=setup:' + (type === 'offer' ? 'actpass' : 'active'),
      'a=mid:0', 'a=sctp-port:5000', 'a=max-message-size:262144'
    ];
    cands.forEach((s, i) => {
      let kind = 'host', body = s;
      const c0 = s.charAt(0);
      if (c0 === 's' || c0 === 'h') { kind = c0 === 's' ? 'srflx' : 'host'; body = s.slice(1); }
      const q = body.split(',');
      if (q.length < 2) return;
      const pri = kind === 'srflx' ? 1686052607 - i : 2130706431 - i;
      L.push('a=candidate:' + (i + 1) + ' 1 udp ' + pri + ' ' + unpackHost(q[0]) + ' ' + q[1] + ' typ ' + kind + (kind === 'srflx' ? ' raddr 0.0.0.0 rport 0' : '') + ' generation 0');
    });
    L.push('a=end-of-candidates');
    return { type: type, sdp: L.join('\r\n') + '\r\n' };
  }
  return { pack: pack, unpack: unpack };
})();

/* ---------- WebRTC ---------- */
const PEER = (function () {
  let pc = null, dc = null;
  const cb = { open: null, msg: null, close: null };
  function reset() {
    try { if (dc) dc.close(); } catch (e) { /* むし */ }
    try { if (pc) pc.close(); } catch (e) { /* むし */ }
    pc = null; dc = null;
  }
  function newPC() {
    const me = new RTCPeerConnection({ iceServers: [{ urls: ['stun:stun.l.google.com:19302', 'stun:stun1.l.google.com:19302'] }], iceCandidatePoolSize: 0 });
    me.onconnectionstatechange = () => {
      if (me !== pc) return;
      const s = me.connectionState;
      if (s === 'failed' || s === 'disconnected' || s === 'closed') { if (cb.close) cb.close(s); }
    };
    pc = me;
    return me;
  }
  function bindDC(ch) {
    dc = ch;
    ch.onopen = () => { if (ch === dc && cb.open) cb.open(); };
    ch.onmessage = e => { if (ch === dc && cb.msg) cb.msg(e.data); };
    ch.onclose = () => { if (ch === dc && cb.close) cb.close('dc'); };
  }
  function gathered(timeout) {
    return new Promise(res => {
      if (pc.iceGatheringState === 'complete') return res();
      let host = 0, srflx = 0, early = 0;
      const p = pc;
      const done = () => {
        clearTimeout(t); clearTimeout(early);
        p.removeEventListener('icegatheringstatechange', h);
        p.removeEventListener('icecandidate', c);
        res();
      };
      const h = () => { if (p.iceGatheringState === 'complete') done(); };
      const c = e => {
        const cand = e.candidate && e.candidate.candidate;
        if (!cand) return;
        if (cand.indexOf(' typ srflx') >= 0) srflx++;
        else if (cand.indexOf(' typ host') >= 0) host++;
        if (host && srflx && !early) early = setTimeout(done, 350);
      };
      p.addEventListener('icegatheringstatechange', h);
      p.addEventListener('icecandidate', c);
      const t = setTimeout(done, timeout || 4200);
    });
  }
  async function createOffer() {
    reset(); newPC();
    bindDC(pc.createDataChannel('game', { ordered: true }));
    await pc.setLocalDescription(await pc.createOffer());
    await gathered();
    return SDPC.pack(pc.localDescription.sdp, 'offer');
  }
  async function acceptOffer(code) {
    const o = SDPC.unpack(code);
    if (o.type !== 'offer') throw new Error('親機の コードでは ありません');
    reset(); newPC();
    pc.ondatachannel = e => bindDC(e.channel);
    await pc.setRemoteDescription(o);
    await pc.setLocalDescription(await pc.createAnswer());
    await gathered();
    return SDPC.pack(pc.localDescription.sdp, 'answer');
  }
  async function acceptAnswer(code) {
    const a = SDPC.unpack(code);
    if (a.type !== 'answer') throw new Error('子機の コードでは ありません');
    if (!pc) throw new Error('もういちど「親機になる」から やりなおしてね');
    await pc.setRemoteDescription(a);
  }
  function send(s) { try { if (dc && dc.readyState === 'open') dc.send(s); } catch (e) { /* むし */ } }
  function isOpen() { return !!dc && dc.readyState === 'open'; }
  function on(k, f) { cb[k] = f; }
  return { createOffer: createOffer, acceptOffer: acceptOffer, acceptAnswer: acceptAnswer, send: send, isOpen: isOpen, on: on, close: reset };
})();

/* ---------- QRコード ---------- */
const QR_QUIET = 4;
function qrCanvas(text, avail) {
  const q = qrcode(0, 'M');
  q.addData(text);
  q.make();
  const n = q.getModuleCount(), total = n + QR_QUIET * 2;
  const room = Math.max(160, Math.min(avail || 300, 340));
  let mod = Math.max(2, Math.floor(room / total));
  if (total * (mod + 1) <= room + 8) mod++;
  const dpr = Math.max(1, Math.min(3, Math.round(window.devicePixelRatio || 1)));
  const cssSize = total * mod;
  const cv2 = document.createElement('canvas');
  cv2.width = cv2.height = cssSize * dpr;
  cv2.style.width = cv2.style.height = cssSize + 'px';
  cv2.setAttribute('role', 'img'); cv2.setAttribute('aria-label', 'QRコード');
  const c = cv2.getContext('2d');
  c.fillStyle = '#ffffff'; c.fillRect(0, 0, cv2.width, cv2.height);
  c.fillStyle = '#000000';
  const s = mod * dpr;
  for (let r = 0; r < n; r++) for (let col = 0; col < n; col++) if (q.isDark(r, col)) c.fillRect((col + QR_QUIET) * s, (r + QR_QUIET) * s, s, s);
  return cv2;
}
function renderQRs() {
  $$('#conn-steps .qr[data-code]').forEach(el => {
    const code = decodeURIComponent(el.getAttribute('data-code'));
    el.textContent = '';
    try {
      const w = Math.round(el.getBoundingClientRect().width) - 20;
      el.appendChild(qrCanvas(code, w > 40 ? w : 300));
    } catch (e) {
      el.textContent = 'QRを つくれませんでした。下の コードを コピーして おくってね。';
    }
  });
}

/* ---------- カメラで QR を よむ ---------- */
const SCAN = (function () {
  let stream = null, raf = 0, cb = null;
  const vid = $('#scan-video');
  const off = document.createElement('canvas');
  const octx = off.getContext('2d', { willReadFrequently: true });
  async function open(onResult) {
    cb = onResult;
    $('#scanner').classList.add('on');
    $('#scan-msg').textContent = 'カメラを じゅんびちゅう…';
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
    } catch (e) {
      $('#scan-msg').textContent = 'カメラが つかえません。「コードを はりつける」を つかってね。';
      return;
    }
    vid.srcObject = stream;
    vid.setAttribute('playsinline', '');
    try { await vid.play(); } catch (e) { /* むし */ }
    $('#scan-msg').textContent = 'あいての QRコードに カメラを むけてね';
    tick();
  }
  function tick() {
    raf = requestAnimationFrame(tick);
    if (!vid.videoWidth) return;
    const s = Math.min(1, 520 / Math.max(vid.videoWidth, vid.videoHeight));
    off.width = Math.round(vid.videoWidth * s); off.height = Math.round(vid.videoHeight * s);
    octx.drawImage(vid, 0, 0, off.width, off.height);
    let img;
    try { img = octx.getImageData(0, 0, off.width, off.height); } catch (e) { return; }
    const res = (typeof jsQR === 'function') ? jsQR(img.data, img.width, img.height, { inversionAttempts: 'dontInvert' }) : null;
    if (res && res.data) {
      const code = codeFromText(res.data);
      if (code) { const fn = cb; close(); if (fn) fn(code); }
    }
  }
  function close() {
    cancelAnimationFrame(raf); raf = 0;
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    vid.srcObject = null;
    $('#scanner').classList.remove('on');
  }
  return { open: open, close: close };
})();
/* QRやはりつけた文字から コードを とりだす（リンクごと はりつけても OK） */
function codeFromText(t) {
  t = String(t || '').trim();
  var m = /#[ja]=([^\s]+)/.exec(t);
  if (m) { try { t = decodeURIComponent(m[1]); } catch (e) { t = m[1]; } }
  t = t.replace(/\s+/g, '');
  return t.indexOf('FR1~') === 0 ? t : '';
}

  show('net');
}
function leaveNet() {
  SCAN.close();
  NET.connected = false; NET.state = null;
  PEER.close();
  show('title'); refreshTitle();
}
async function beginHost() {
  NET.role = 'host'; NET.state = 'host-make';
  $('#roleBox').style.display = 'none';
  $('#conn-title').textContent = '親機';
  setConn(stepWait('じゅんびちゅう…'));
  var code;
  try { code = await PEER.createOffer(); } catch (e) {
    setConn('<div class="step"><p class="status">つなぐ じゅんびに しっぱいしました。<br>' + (e.message || '') + '</p></div>');
    return;
  }
  if (NET.role !== 'host') return;
  NET.state = 'host-wait-answer';
  setConn(stepQR('① この QRを 子機で よみとってもらう', code, '', 'j') + stepScan('② 子機に でた QRを よみとる', 'よみとると すぐに はじまるよ'));
}
function beginGuest() {
  NET.role = 'guest'; NET.state = 'guest-wait-offer';
  $('#roleBox').style.display = 'none';
  $('#conn-title').textContent = '子機';
  setConn(stepScan('① 親機の QRを よみとる'));
}
async function handleCode(raw) {
  var code = codeFromText(raw);
  if (!code) { toast('コードが よみとれませんでした'); return; }
  try {
    if (NET.state === 'guest-wait-offer') {
      setConn(stepWait('へんじを つくっています…'));
      var ans = await PEER.acceptOffer(code);
      NET.state = 'guest-wait-open';
      setConn(stepQR('② この QRを 親機で よみとってもらう', ans, 'つながるまで まってね', 'a'));
    } else if (NET.state === 'host-wait-answer') {
      await PEER.acceptAnswer(code);
      NET.state = 'host-wait-open';
      setConn(stepWait('つないでいます…'));
    }
  } catch (e) {
    toast(e.message || 'コードが よみとれませんでした');
    if (NET.state === 'guest-wait-offer') setConn(stepScan('① 親機の QRを よみとる'));
  }
}
function readShared() {
  var m = /^#([ja])=(.+)$/.exec(location.hash || '');
  if (!m) return null;
  var code;
  try { code = decodeURIComponent(m[2]); } catch (e) { code = m[2]; }
  return { kind: m[1], code: code.trim() };
}
function clearHash() { try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { location.hash = ''; } }
async function useSharedCode() {
  var sh = readShared();
  if (!sh) return;
  clearHash();
  if (sh.kind === 'j') { openNet(); beginGuest(); await handleCode(sh.code); return; }
  if (NET.state === 'host-wait-answer') { await handleCode(sh.code); return; }
  toast('この リンクは 親機の がめんで ひらいてね');
}
window.addEventListener('hashchange', function () { useSharedCode(); });

$('#conn-steps').addEventListener('click', function (e) {
  var b = e.target.closest('button');
  if (!b) return;
  audio(); SFX.btn();
  if (b.hasAttribute('data-share')) shareUrl(decodeURIComponent(b.getAttribute('data-share')));
  else if (b.hasAttribute('data-copy')) copyText(decodeURIComponent(b.getAttribute('data-copy')));
  else if (b.hasAttribute('data-scan')) SCAN.open(handleCode);
  else if (b.hasAttribute('data-paste')) {
    var v = ($('#paste') || {}).value || '';
    if (v.trim()) handleCode(v.trim()); else toast('コードを はりつけてね');
  }
});
$('#scan-close').addEventListener('click', function () { SCAN.close(); });
$('#netBtn').addEventListener('click', function () { audio(); SFX.btn(); openNet(); });
$('#netBack').addEventListener('click', function () { SFX.btn(); leaveNet(); });
$('#btnHost').addEventListener('click', function () { audio(); SFX.btn(); beginHost(); });
$('#btnGuest').addEventListener('click', function () { audio(); SFX.btn(); beginGuest(); });

/* ---------- 対戦中の やりとり ---------- */
function netSend(o) { PEER.send(JSON.stringify(o)); }
function netOn() { return !!G && G.mode === 'net'; }
PEER.on('open', function () {
  SCAN.close();
  NET.connected = true;
  toast('つながりました！');
  netSend({ t: 'hello', ch: NET.myCh, v: VERSION });
});
PEER.on('msg', function (data) {
  var m;
  try { m = JSON.parse(data); } catch (e) { return; }
  onNetMessage(m);
});
PEER.on('close', function () {
  if (!NET.connected) return;
  NET.connected = false;
  toast('あいてとの つうしんが きれました', 3600);
  netLeaveToTitle();
});
function netLeaveToTitle() {
  PEER.close();
  NET.state = null;
  G = null; paused = false;
  closeOv(); show('title'); refreshTitle();
}
function onNetMessage(m) {
  switch (m.t) {
    case 'hello':
      NET.oppCh = NET_CHARS.indexOf(m.ch) >= 0 ? m.ch : 'kuro';
      if (m.v !== VERSION) toast('あいてと バージョンが ちがいます。ページを よみこみなおしてね', 4000);
      if (NET.role === 'host') hostStart();
      break;
    case 'start': if (NET.role === 'guest') startNet(m.seed); break;
    case 'snap': applySnap(m); break;
    case 'atk': recvAttack(m.n); break;
    case 'chain': remoteChain(m); break;
    case 'say': if (netOn()) say(G.players[1], String(m.m || '').slice(0, 30), m.f, true); break;
    case 'dead': remoteDead(); break;
    case 'again': NET.oppReady = true; tryRematch(); break;
    case 'bye':
      NET.connected = false;
      toast('あいてが やめました', 3000);
      netLeaveToTitle();
      break;
    default: break;
  }
}
function hostStart() {
  var seed = (Date.now() ^ Math.floor(Math.random() * 0x7fffffff)) & 0x7fffffff;
  netSend({ t: 'start', seed: seed });
  startNet(seed);
}
function startNet(seed) {
  closeOv();
  NET.ready = false; NET.oppReady = false;
  G = { mode: 'net', nc: 4, seq: makeSeq(seed, 4), t: 0, over: false, overT: 0, base: 600, snapT: 0,
    players: [
      makePlayer({ ch: NET.myCh, speed: 600, seed: seed, lay: { bx: 6, by: 124, cell: 28, side: 'L' } }),
      makePlayer({ ch: NET.oppCh, speed: 600, seed: seed + 1, lay: { bx: 186, by: 124, cell: 28, side: 'R' } })] };
  G.players[1].remote = true;
  G.players[1].state = 'wait';
  beginGame();
}
function tickNet(dt) {
  if (!netOn() || G.countdown > 0) return;
  G.snapT += dt;
  if (G.snapT < 1 / 15) return;
  G.snapT = 0;
  var p = G.players[0];
  if (p.dead) return;
  var s = '';
  for (var y = 0; y < ROWS; y++) for (var x = 0; x < COLS; x++) s += p.g[y][x];
  var pr = p.pair && p.state === 'fall' ? [p.pair.x, p.pair.y, p.pair.r, p.pair.pc, p.pair.cc] : 0;
  netSend({ t: 'snap', g: s, p: pr, s: p.score, pe: p.pending, q: p.seqIdx, f: p.face, mc: p.maxChain });
}
function applySnap(m) {
  if (!netOn()) return;
  var q = G.players[1];
  if (q.dead || typeof m.g !== 'string' || m.g.length !== ROWS * COLS) return;
  var k = 0;
  for (var y = 0; y < ROWS; y++) for (var x = 0; x < COLS; x++) {
    var c = m.g.charCodeAt(k++) - 48;
    q.g[y][x] = (c >= 0 && c <= 5) || c === OJ ? c : 0;
  }
  q.pair = m.p ? { x: m.p[0], y: m.p[1], r: m.p[2], pc: m.p[3], cc: m.p[4] } : null;
  q.state = q.pair ? 'fall' : 'wait';
  q.score = m.s | 0; q.pending = m.pe | 0; q.seqIdx = m.q | 0; q.maxChain = m.mc | 0;
  if (CHARS[q.ch][m.f]) q.face = m.f;
}
function sendChain(p, pops) {
  if (!netOn() || p.remote) return;
  netSend({ t: 'chain', n: p.chain, c: pops.cells.concat(pops.ojama) });
}
function remoteChain(m) {
  if (!netOn()) return;
  var q = G.players[1];
  q.pops = { cells: m.c || [], ojama: [] }; q.popT = 0;
  q.chainFx = { n: m.n | 0, t: 0 };
  q.pops.cells.forEach(function (c) {
    var v = q.g[c[1]] ? q.g[c[1]][c[0]] : 0;
    addSpark(q, c[0], c[1], v >= 1 && v <= 5 ? PIECE[v] : null);
  });
  if ((m.n | 0) >= 2) tone(330 + m.n * 40, 0.1, 'sine', 0.06);
}
function sendAttack(n) { netSend({ t: 'atk', n: n }); }
function recvAttack(n) {
  if (!netOn() || G.over) return;
  n = Math.max(0, Math.min(200, n | 0));
  var p = G.players[0];
  p.pending += n;
  if (n >= 12) say(p, CHARS[p.ch].hurt, 'a');
}
function localDeadNet(p) {
  G.over = true; G.overT = 0;
  if (G.players[1].dead) G.draw = true; else G.winner = G.players[1];
  say(p, CHARS[p.ch].lose, 's');
  SFX.lose();
  netSend({ t: 'dead' });
}
function remoteDead() {
  if (!netOn()) return;
  var q = G.players[1], me = G.players[0];
  q.dead = true; q.deadT = 0; q.pair = null; q.state = 'dead';
  if (me.dead) { G.draw = true; G.winner = null; return; }
  if (G.over) return;
  G.over = true; G.overT = 0; G.winner = me;
  say(me, CHARS[me.ch].win, 'h'); say(q, CHARS[q.ch].lose, 's', true);
  SFX.win();
}
function netResult() {
  var me = G.players[0], q = G.players[1];
  var win = !G.draw && G.winner === me;
  var head = G.draw ? 'ひきわけ！' : (win ? 'あなたの かち！' : 'あいての かち…');
  openOv('<h3>' + head + '</h3>'
    + '<div style="display:flex;gap:10px;justify-content:center">' + img(CHARS[me.ch][win || G.draw ? 'h' : 's']) + img(CHARS[q.ch][win ? 's' : 'h']) + '</div>'
    + '<p style="text-align:center">あなた ' + me.score + ' てん（さいだい ' + Math.max(me.maxChain, me.chain) + ' れんさ）<br>あいて ' + q.score + ' てん</p>'
    + '<button class="btn" id="oAgain">もういちど</button><button class="btn w" id="oBye">やめる</button>',
    { oAgain: netAgain, oBye: netQuit });
}
function netAgain() {
  NET.ready = true;
  netSend({ t: 'again' });
  var b = $('#oAgain');
  if (b) { b.textContent = 'あいてを まっています…'; b.disabled = true; b.style.opacity = '.6'; }
  tryRematch();
}
function tryRematch() {
  if (NET.ready && NET.oppReady && NET.role === 'host') hostStart();
}
function netQuit() {
  netSend({ t: 'bye' });
  NET.connected = false;
  setTimeout(netLeaveToTitle, 120);
}
function netPause() {
  openOv('<h3>つうしんたいせん</h3><p style="text-align:center">ゲームは とまらないよ。<br>やめると あいての かちに なります。</p>'
    + '<button class="btn g" id="oRes">つづける</button><button class="btn w" id="oQuit">やめる</button>',
    { oRes: closeOv, oQuit: netQuit });
}

useSharedCode();
window.__N = { NET: NET, PEER: PEER, SDPC: SDPC, handleCode: handleCode };
</script>
