#rotate button{margin-top:18px;background:rgba(255,255,255,.25);border:2px solid #fff;color:#fff;border-radius:12px;padding:6px 14px;font-size:13px;font-family:inherit}
@media (orientation:portrait) and (pointer:coarse) and (max-width:900px){body:not(.rotok) #rotate{display:flex}}
/* panel */
#panelWrap{position:fixed;inset:0;z-index:3100;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:10px}
#panel{background:#fff8e6;border:4px solid #7a5230;border-radius:18px;width:min(560px,96vw);max-height:92vh;display:flex;flex-direction:column;box-shadow:0 6px 0 rgba(0,0,0,.3)}
#panel h2{margin:0;padding:10px 14px;font-size:19px;background:#7a5230;color:#fff;border-radius:12px 12px 0 0;display:flex;align-items:center;gap:8px}
#panel h2 .x{margin-left:auto;background:#fff;color:#7a5230;border:none;border-radius:10px;font-size:16px;font-weight:bold;width:36px;height:32px}
#pbody{padding:10px 12px;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.tabs{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.tab{padding:6px 12px;border-radius:10px;border:2px solid #c9a27a;background:#f5e6cc;font-weight:bold;font-size:14px}
.tab.on{background:#f08c1a;color:#fff;border-color:#f08c1a}
.row{display:flex;align-items:center;gap:8px;padding:7px 6px;border-bottom:1px dashed #d9c3a3;font-size:14px}
.row .ic{font-size:22px;width:30px;text-align:center}
.row .nm{flex:1;font-weight:bold}
.row .nm small{display:block;font-weight:normal;color:#8a6a4a;font-size:11px}
.row .pr{font-weight:bold;color:#b0620a;white-space:nowrap}
.sbtn{padding:6px 10px;border-radius:10px;border:2px solid #b0620a;background:#ffd36b;font-weight:bold;font-size:13px;white-space:nowrap}
.sbtn:disabled{opacity:.4}
.sbtn.g{background:#a8e08a;border-color:#4f9a45}
.msg{background:#fff;border:2px solid #e3cfae;border-radius:12px;padding:8px 10px;margin-bottom:8px;font-size:14px;display:flex;gap:8px;align-items:center}
.msg .who{font-size:28px}
.stars{color:#f0a000;letter-spacing:1px}
.need{font-size:11px;color:#8a6a4a}
.need .ng{color:#d33}
.forge{text-align:center}
.fbar{position:relative;height:34px;background:linear-gradient(90deg,#555,#777,#555);border-radius:10px;margin:14px 4px;overflow:hidden;border:3px solid #333}
.fzone{position:absolute;top:0;bottom:0;background:rgba(255,200,0,.55)}
.fzone2{position:absolute;top:0;bottom:0;background:rgba(255,80,0,.85)}
.fneedle{position:absolute;top:-2px;bottom:-2px;width:6px;background:#fff;box-shadow:0 0 6px #fff;margin-left:-3px}
.hits{font-size:22px;min-height:30px}
#mapCv{width:100%;image-rendering:pixelated;border-radius:10px;border:3px solid #7a5230}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:14px}
.statgrid div{background:#fff;border-radius:10px;padding:6px 10px;border:2px solid #e3cfae}
@media (max-width:640px){#stat{min-width:140px;padding:4px 8px}#info{max-width:calc(100vw - 175px);flex-wrap:wrap;justify-content:flex-end}.chip{font-size:12px;padding:3px 8px}.ib{width:38px;height:38px;font-size:18px}#toast div{font-size:13px}#banner{font-size:21px}}
.decoB{background:rgba(220,120,60,.95)!important}
#editBar{position:fixed;left:0;right:0;bottom:0;z-index:2100;background:rgba(255,248,230,.97);border-top:4px solid #7a5230;padding:6px 8px calc(6px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px}
.ebtns{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
#editBar.garden [data-e=wall],#editBar.garden [data-e=floor],#editBar.garden [data-e=rot]{display:none}
.ebtns button{padding:7px 12px;border-radius:12px;border:3px solid #7a5230;background:#fff3d6;font-weight:bold;font-size:14px}
.ebtns button.done{background:#a8e08a;border-color:#4f9a45}
#eList{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x;padding-bottom:2px;min-height:62px}
.ei{flex:0 0 auto;width:74px;border-radius:12px;border:3px solid #c9a27a;background:#fff;font-size:11px;font-weight:bold;padding:3px;display:flex;flex-direction:column;align-items:center;line-height:1.15}
.ei span{font-size:22px}
.ei.on{border-color:#f08c1a;background:#fff0c8;box-shadow:0 0 0 3px #ffd36b}
#editHint{color:#5a3010;font-size:13px;font-weight:bold;text-align:center}
body.panelOpen #toast{bottom:auto!important;top:calc(6px + env(safe-area-inset-top))}
body.panelOpen #toast div{font-size:12px;padding:5px 12px}
body.editing #toast{bottom:auto;top:calc(110px + env(safe-area-inset-top))}
@media (max-width:640px){.ebtns button{padding:5px 8px;font-size:12px}.ei{width:64px}}
.sw{display:inline-block;width:44px;height:30px;border-radius:6px;border:2px solid #7a5230;vertical-align:middle}
#fade{position:fixed;inset:0;background:#000;z-index:2700;opacity:0;pointer-events:none;transition:opacity .6s;display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px;font-weight:bold}
.sailfx{position:fixed;inset:0;z-index:9998;background:linear-gradient(#9fd8ff,#4aa3df 55%,#2a7ab8);overflow:hidden;animation:lgfade 2.6s forwards}
.sailfx .sea{position:absolute;left:-50%;right:-50%;bottom:0;height:45%;background:repeating-linear-gradient(90deg,rgba(255,255,255,.35) 0 30px,transparent 30px 80px);animation:sea 1.2s linear infinite;opacity:.6}
.sailfx .boat{position:absolute;bottom:38%;left:-10%;font-size:90px;animation:boat 2.6s ease-in-out forwards}
.sailfx .sl{position:absolute;top:22%;width:100%;text-align:center;color:#fff;font-size:24px;font-weight:bold;text-shadow:0 2px 4px rgba(0,0,0,.4)}
@keyframes sea{to{transform:translateX(80px)}}@keyframes boat{0%{left:-15%;transform:translateY(0)}25%{transform:translateY(-8px)}50%{transform:translateY(0)}75%{transform:translateY(-8px)}100%{left:105%;transform:translateY(0)}}
.legendfx{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;pointer-events:auto;animation:lgfade 4.2s forwards}
.lgray{position:absolute;inset:-50%;background:repeating-conic-gradient(from 0deg,rgba(255,80,80,.35) 0 10deg,rgba(255,220,80,.35) 10deg 20deg,rgba(80,255,120,.35) 20deg 30deg,rgba(80,180,255,.35) 30deg 40deg,rgba(200,100,255,.35) 40deg 50deg,transparent 50deg 60deg);animation:lgspin 4s linear infinite}
.lgbox{position:relative;text-align:center;background:rgba(20,10,40,.85);border:4px solid #fff;border-radius:22px;padding:18px 30px;color:#fff;box-shadow:0 0 40px #fff,0 0 80px #ffd700;animation:lgpop .6s cubic-bezier(.2,1.6,.4,1)}
.lgst{font-size:30px;letter-spacing:4px;background:linear-gradient(90deg,#f55,#fd5,#5f8,#5bf,#c6f,#f55);background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:lgrb 1.2s linear infinite}
.lgic{font-size:64px;animation:lgbob 1s ease-in-out infinite}.lgt{font-size:20px;font-weight:bold;color:#ffe680}.lgn{font-size:24px;font-weight:bold;margin:4px 0}.lgs{font-size:13px;opacity:.85}
.r5{animation:lgrbb 1.5s linear infinite}
@keyframes lgspin{to{transform:rotate(360deg)}}@keyframes lgpop{from{transform:scale(.2)}to{transform:scale(1)}}@keyframes lgbob{50%{transform:translateY(-8px) scale(1.08)}}
@keyframes lgrb{to{background-position:200%}}@keyframes lgfade{0%,85%{opacity:1}100%{opacity:0}}@keyframes lgrbb{0%{box-shadow:0 0 6px #f55}25%{box-shadow:0 0 6px #fd5}50%{box-shadow:0 0 6px #5f8}75%{box-shadow:0 0 6px #5bf}100%{box-shadow:0 0 6px #f55}}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud" class="hidden">
  <div id="stat">
    <div class="nm"><span class="lv" id="hLv">Lv1</span><span id="hName">なまえ</span></div>
    <div class="bar"><i id="hHp"></i><b id="hHpT">40/40</b></div>

    <button class="ib fsBtn" id="fsBtn" title="ぜんがめん">⛶</button>
    <button class="ib" id="helpBtn">❓</button>
    <button class="ib" id="mapBtn">🗺️</button>
    <button class="ib" id="menuBtn">☰</button>
  </div>
  <div id="goal" class="hidden"></div>

      <button class="sb hidden" id="mpBtn" style="background:rgba(60,110,210,.92)">🔷MP</button>
      <button class="sb hidden" id="stampBtn" style="background:rgba(70,120,200,.92)">💬<br>チャット</button>
      <button class="sb decoB hidden" id="decoBtn">🛋️<br>もようがえ</button>
    </div>
    <div class="side mag">
      <button class="sb" id="spellBtn" style="background:rgba(120,70,190,.92);min-width:62px;height:34px;font-size:11px">⇄ まほう</button>
      <button id="magBtn">🔥<br><small>3</small></button>
    </div>
    <button id="actBtn">こうげき</button>
  </div>
</div>
<div id="editBar" class="hidden">
  <div id="editHint"></div>
  <div class="ebtns"><button data-e="rot">↻ まわす</button><button data-e="store">📦 しまう</button><button data-e="wall">🧱 かべがみ</button><button data-e="floor">🟫 ゆか</button><button data-e="done" class="done">✅ おわる</button></div>
  <div id="eList"></div>
</div>
<div id="joyBase" class="hidden"><div id="joyKnob"></div></div>
<div id="bossBar" class="hidden"><div id="bossName"></div><div class="bbar"><i id="bossHp"></i></div></div>
<div id="chatDock" class="hidden">
  <div id="dockLog"></div>
  <div class="dockRow"><input id="dockIn" maxlength="40" placeholder="チャット（40もじまで）" enterkeyhint="send" autocomplete="off"><button id="dockSend">おくる</button><button id="dockMore" title="スタンプ・りれき">😊</button><button id="dockClose" title="とじる">▼</button></div>
</div>
<button id="dockOpen">💬</button>
<div id="roster" class="hidden"></div>
<div id="chatTicker"></div>
<div id="toast"></div>
<div id="banner"></div>
<div id="help" class="hidden"></div>
<div id="keybar"><span><kbd class="k">↑↓←→</kbd>/<kbd class="k">WASD</kbd> いどう</span><span><kbd class="k">スペース</kbd> ボタン</span><span><kbd class="k">E</kbd> まほう</span><span><kbd class="k">Q</kbd> タネ</span><span><kbd class="k">1</kbd>/<kbd class="k">2</kbd> くすり</span><span><kbd class="k">M</kbd> ちず</span><span><kbd class="k">Esc</kbd> メニュー</span><span><kbd class="k">H</kbd> ヘルプ</span><button class="x" id="keybarX" title="かくす">×</button></div>
<div id="fade"></div>

<!-- title -->
<div id="title" class="screen tscreen">
  <div class="tart" role="img" aria-label="フテ猫ワールド そだてて、つくって、ぼうけんしよう！"></div>
  <div class="tpanel">
    <div class="tph"><span>🐾</span>あそぶデータを<br>えらぼう<span>🐾</span></div>

    <div class="tver" id="verT"></div>
  </div>
</div>

</div>

let AC=null, soundOn=true, bgmOn=true, bgmTimer=null, bgmStep=0, bgmNext=0;
function initAudio(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;}}
  if(AC&&AC.state==='suspended')AC.resume();
  if(AC&&!bgmTimer)startBgm();
}
function tone(f,d,type,v,slide,delay){
  if(!AC||!soundOn)return;
  const t=AC.currentTime+(delay||0);
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.linearRampToValueAtTime(Math.max(30,f+slide),t+d);
  g.gain.setValueAtTime(v||0.08,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+0.02);
}
let noiseBuf=null;
function noise(d,v,ff){
  if(!AC||!soundOn)return;
  if(!noiseBuf){noiseBuf=AC.createBuffer(1,AC.sampleRate*0.5,AC.sampleRate);const a=noiseBuf.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;}
  const t=AC.currentTime,s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=noiseBuf;f.type='lowpass';f.frequency.value=ff||2000;
  g.gain.setValueAtTime(v||0.1,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);
  s.connect(f);f.connect(g);g.connect(AC.destination);s.start(t);s.stop(t+d+0.02);
}

function musInit(){
  if(MUS.unlocked)return;MUS.unlocked=true;
  for(const k in MUS.tracks){const a=new Audio();a.src=MUS.tracks[k].src;a.loop=true;a.preload=k==='farm'?'auto':'metadata';if(location.protocol.startsWith('http'))a.crossOrigin='anonymous';a.setAttribute('playsinline','');MUS.el[k]=a;

    MUS.gain[k]=g;if(!g)a.volume=0;
    const p=a.play();if(p&&p.then)p.then(()=>{if(MUS.cur!==k)a.pause();}).catch(()=>{});}
}
function musVol(k,v,sec){const g=MUS.gain[k],a=MUS.el[k];if(!a)return;
  if(g&&AC){const t=AC.currentTime;g.gain.cancelScheduledValues(t);g.gain.setValueAtTime(g.gain.value,t);g.gain.linearRampToValueAtTime(v,t+sec);}
  else{const from=a.volume,st=performance.now();const step=()=>{const r=Math.min(1,(performance.now()-st)/(sec*1000));try{a.volume=Math.max(0,Math.min(1,from+(v-from)*r));}catch(e){}if(r<1)requestAnimationFrame(step);};step();}}
function musSet(k){
  const on=bgmOn&&soundOn&&!document.hidden;const target=on?k:null;
  if(target===MUS.cur)return;
  const old=MUS.cur;MUS.cur=target;
  if(old&&MUS.el[old]){const a=MUS.el[old];musVol(old,0,1.2);setTimeout(()=>{if(MUS.cur!==old)a.pause();},1300);}
  if(target&&MUS.el[target]){const a=MUS.el[target];if(target==='battle'&&old!=='battle'&&a.currentTime>0&&a.paused)a.currentTime=0;
    const p=a.play();if(p&&p.catch)p.catch(()=>{MUS.cur=null;});musVol(target,MUS.tracks[target].vol,1.2);}
}

  for(const k of Object.keys(S.inv)){const nk=ren(k);if(nk!==k){S.inv[nk]=(S.inv[nk]||0)+S.inv[k];delete S.inv[k];}}
  for(const k of Object.keys(S.invHold)){const nk=ren(k);if(nk!==k){S.invHold[nk]=(S.invHold[nk]||0)+S.invHold[k];delete S.invHold[k];}}
  ['w','a'].forEach(s2=>{if(S.eq[s2])S.eq[s2]=ren(S.eq[s2]);});
  // items that exist again come back / unknown items are kept hidden
  for(const k of Object.keys(S.invHold)){if(ITEMS[baseOf(k)]){S.inv[k]=(S.inv[k]||0)+S.invHold[k];delete S.invHold[k];notes.push('back');}}
  for(const k of Object.keys(S.inv)){if(!ITEMS[baseOf(k)]){S.invHold[k]=(S.invHold[k]||0)+S.inv[k];delete S.inv[k];}}
  ['w','a'].forEach(s2=>{const k=S.eq[s2];if(k&&!S.inv[k])S.eq[s2]=null;});
  if(S.seed&&!S.inv[S.seed])S.seed=null;
  // v1.0 farm
  let legacyFarm=false;
  if(!S.plants){S.plants={};S.weeds={};S.digs={};if(S.farm)for(const k in S.farm){const f=S.farm[k];if(f.c)S.plants[k]={k:'veg',id:f.c,st:0,w:false};}delete S.farm;S.geo=0;legacyFarm=true;}
  // positions -> current map
  const conv=o=>{o=o||{};if(S.geo)return o;const r={};for(const k in o){const i=+k;r[(i%LEGACY_MW)+','+Math.floor(i/LEGACY_MW)]=o[k];}return r;};
  const P=conv(S.plants),Wd=conv(S.weeds),Dg=conv(S.digs),Sl=conv(S.soil);
  S.plants={};S.weeds={};S.digs={};S.soil={};let refunded=0;
  for(const k in P){const [x,y]=k.split(',').map(Number);const p=P[k];if(!p||!p.k)continue;
    if((p.k==='tree'&&!FRUITS[p.id])||(p.k==='veg'&&!CROPS[p.id])||(p.k==='flower'&&(!FLOWERS[p.id]||!FCOL[p.col]))){const it=refundPlant(p);if(it)holdOrAdd(it,1);continue;}
    if(plantTileOk(x,y)&&!S.plants[idx(x,y)])S.plants[idx(x,y)]=p;else{const it=refundPlant(p);if(it){holdOrAdd(it,1);refunded++;}}}
  for(const k in Wd){const [x,y]=k.split(',').map(Number);if(plantTileOk(x,y)&&!S.plants[idx(x,y)])S.weeds[idx(x,y)]=1;}
  for(const k in Dg){const [x,y]=k.split(',').map(Number);if(inMap(x,y)&&tiles[idx(x,y)]===T.GRASS&&!objs[idx(x,y)]&&bldGrid[idx(x,y)]<0)S.digs[idx(x,y)]=1;}
  for(const k in Sl){const [x,y]=k.split(',').map(Number);if(plantTileOk(x,y)&&inRect(x,y,LAND))S.soil[idx(x,y)]=1;}
  for(const k in S.plants){if(S.plants[k].k==='veg')S.soil[k]=1;}
  S.geo=1;
  if(refunded)notes.push('refund:'+refunded);
  if(!FRUITS[S.native])S.native=Object.keys(FRUITS)[irnd(0,Object.keys(FRUITS).length-1)];
  if(legacyFarm||isNew)initLand();
  // defaults for new fields
  const def=newState(S.name,S.ch);
  for(const k in def){if(S[k]===undefined)S[k]=def[k];}
  for(const k in def.st){if(S.st[k]===undefined)S.st[k]=def.st[k];}
  S.bossDay=S.bossDay||{};delete S.bossAt;
  if(!S.room||!Array.isArray(S.room.items))S.room=def.room;
  if(!S.farmDay)S.farmDay=S.lastDate||jst().key;
  if(!S.dmg||typeof S.dmg!=='object')S.dmg={};
  if(S.own&&!(S.own.room&&Array.isArray(S.own.room.items)&&typeof S.own.plot==='number'))delete S.own;
  if(S.own){S.own.room.items=S.own.room.items.filter(it=>FURN[it.id]);S.own.h=clamp(S.own.h|0,1,HOUSES.length-1);}
  if(!Array.isArray(S.walls)||!S.walls.length)S.walls=['plain'];if(!Array.isArray(S.floors)||!S.floors.length)S.floors=['wood'];
  // furniture renamed / removed
  S.room.items=S.room.items.filter(it=>{if(FURN_ALIASES[it.id])it.id=FURN_ALIASES[it.id];if(FURN[it.id])return true;S.invHold[it.id]=(S.invHold[it.id]||0)+1;return false;});
  if(!FRUITS[S.native])S.native=Object.keys(FRUITS)[0];
  if(!Array.isArray(S.quests)||S.quests.some(q=>!ITEMS[q.id]))S.quests=[];
  S.house=clamp(S.house|0,0,HOUSES.length-1);
  S.lv=Math.max(1,S.lv|0);S.gold=Math.max(0,+S.gold||0);
  if(!(S.time>=0&&S.time<=1440))S.time=0;
  S.schema=SCHEMA;
  return notes;
}

function landFree(tx,ty){
  if(!inRect(tx,ty,LAND))return false;const i=idx(tx,ty);
  if(tiles[i]!==T.GRASS||objs[i]||bldGrid[i]>=0)return false;
  if(S.plants[i]||S.weeds[i]||S.digs[i])return false;
  if(ty===32&&tx>=12&&tx<=16)return false;
  {const gk=!G.landOf&&gardenAt(tx,ty);if(gk&&gk!=='g_bed')return false;}
  return true;
}
function spawnWeeds(n){
  const cur=Object.keys(S.weeds).length;let add=Math.min(n,14-cur);
  for(let t=0;t<200&&add>0;t++){const x=irnd(LAND.x,LAND.x+LAND.w-1),y=irnd(LAND.y,LAND.y+LAND.h-1);if(landFree(x,y)){S.weeds[idx(x,y)]=1;add--;}}
}
function spawnDigs(n){
  let add=Math.min(n,5-Object.keys(S.digs).length);
  for(let t=0;t<300&&add>0;t++){const R=Math.random()<0.6?LAND:MEADOW;const x=irnd(R.x,R.x+R.w-1),y=irnd(R.y,R.y+R.h-1);const i=idx(x,y);
    if(tiles[i]===T.GRASS&&!objs[i]&&bldGrid[i]<0&&!S.plants[i]&&!S.weeds[i]&&!S.digs[i]&&!(S.soil&&S.soil[i])&&!inRect(x,y,FIELD)){S.digs[i]=1;add--;}}
}

function spawnMob(type,x,y,zone,opt){
  const d=MOB[type];opt=opt||{};const mul=opt.elite?1.7:1;
  const m={type,x,y,hp:Math.round(d.hp*mul),maxHp:Math.round(d.hp*mul),zone,state:'idle',tx:x,ty:y,timer:rnd(0,2),flash:0,dir:1,kbx:0,kby:0,cd:0,t:rnd(0,10),hpShow:0,elite:!!opt.elite,mul,minion:opt.minion||null};
  m.id=mobId();
  if(d.boss){m.home={x,y};m.skillT=2;m.act=null;m.jumpH=0;}
  G.monsters.push(m);return m;
}
function nearLair(tx,ty,r){return BOSSES.find(b=>(tx-b.x)**2+(ty-b.y)**2<=r*r);}
function spawnBoss(b){if(G.monsters.some(m=>m.type===b.id))return;spawnMob(b.id,b.x*TS+16,b.y*TS+24,b.zone);}
function noWild(tx,ty){if(inOld(tx,ty))return true;for(const r of TOWNS)if(inRect(tx,ty,{x:r.x-5,y:r.y-5,w:r.w+10,h:r.h+10}))return true;return inRect(tx,ty,MIST)||inRect(tx,ty,DEMON)||inRect(tx,ty,CAVE)||inRect(tx,ty,MAZE)||inRect(tx,ty,PORT);}
function wildNear(z){const L=(G.plist&&G.plist.length?G.plist:[G.player]).filter(q=>q&&!q.inside&&inRect(Math.floor(q.x/TS),Math.floor(q.y/TS),{x:z.x-12,y:z.y-12,w:z.w+24,h:z.h+24}));return L;}
function trySpawn(zk){
  const z=ZONES[zk];let near=null;if(z.wide){const L=wildNear(z);if(!L.length)return;near=L[irnd(0,L.length-1)];}
  for(let n=0;n<20;n++){
    const tx=near?irnd(Math.floor(near.x/TS)-19,Math.floor(near.x/TS)+19):irnd(z.x,z.x+z.w-1),ty=near?irnd(Math.floor(near.y/TS)-14,Math.floor(near.y/TS)+14):irnd(z.y,z.y+z.h-1);
    if(near&&(!inRect(tx,ty,z)||noWild(tx,ty)))continue;

function footOf(it){const d=FURN[it.id];return (it.r%2)?[d.h,d.w]:[d.w,d.h];}
function rebuildOcc(){
  const [W,H]=roomSize();G.occ=new Int16Array(W*H);
  curHome().items.forEach((it,n)=>{if(FURN[it.id].rug)return;const [fw,fh]=footOf(it);for(let y=it.y;y<it.y+fh;y++)for(let x=it.x;x<it.x+fw;x++)if(x<W&&y<H)G.occ[y*W+x]=n+1;});
}
function doorX(){return Math.floor(roomSize()[0]/2);}
function fitsAt(id,r,tx,ty,ignore,list){
  const [W,H]=roomSize();const d=FURN[id];const fw=(r%2)?d.h:d.w,fh=(r%2)?d.w:d.h;
  if(tx<0||ty<0||tx+fw>W||ty+fh>H)return false;
  const items=list||RM().items;const dx=doorX();
  const ptx=G.scene==='in'&&!list?Math.floor(G.player.x/TS):-9,pty=G.scene==='in'&&!list?Math.floor((G.player.y-4)/TS):-9;
  for(let y=ty;y<ty+fh;y++)for(let x=tx;x<tx+fw;x++){
    if(reservedIn(x,y))return false;
    if(!d.rug&&x===ptx&&y===pty)return false;
    for(let n=0;n<items.length;n++){if(n===ignore)continue;const o=items[n];const od=FURN[o.id];if(!!od.rug!==!!d.rug)continue;const [ow,oh]=footOf(o);
      if(x>=o.x&&x<o.x+ow&&y>=o.y&&y<o.y+oh)return false;}
  }
  return true;
}
function itemAt(tx,ty){
  let rug=-1;
  const IT=curHome().items;for(let n=IT.length-1;n>=0;n--){const o=IT[n];const [ow,oh]=footOf(o);if(tx>=o.x&&tx<o.x+ow&&ty>=o.y&&ty<o.y+oh){if(!FURN[o.id].rug)return n;if(rug<0)rug=n;}}
  return rug;
}
function isSolidIn(tx,ty){
  const [W,H]=roomSize();if(!(G.rix|0)&&ty===H&&tx===doorX())return false;
  if(tx<0||tx>=W){for(const q of portals())if(q.k==='door')for(const a of q.t)if(a[0]===tx&&a[1]===ty)return false;}
  if(tx<0||ty<0||tx>=W||ty>=H)return true;
  return G.occ[ty*W+tx]>0;
}

const PIANO=[60,64,67,72,67,64,60];
function findActionIn(){
  const p=G.player,[dx,dy]=DIRV[p.dir];
  const tx=Math.floor((p.x+dx*24)/TS),ty=Math.floor((p.y-8+dy*26)/TS);
  const [W,H]=roomSize();
  if(tx>=0&&ty>=0&&tx<W&&ty<H){
    const n=itemAt(tx,ty);
    if(n>=0){const it=curHome().items[n],d=FURN[it.id];
      if(G.visit&&(d.use==='craft'))return {l:'みる',f:()=>toast(d.ic+' '+d.n+'だ。')};
      if(d.use==='bed')return {l:'ねる',f:openHome};
      if(d.use==='craft')return {l:'DIY',f:openDIY};
      if(d.use==='sit')return {l:'すわる',f:()=>{toast(d.n+'に すわって ひとやすみ…');SFX.plant();}};
      if(d.use==='lamp')return {l:it.on===false?'つける':'けす',f:()=>{it.on=it.on===false;SFX.open();}};
      if(d.use==='piano')return {l:'ひく',f:()=>{PIANO.forEach((m,k)=>tone(mtof(m),0.35,'triangle',0.09,0,k*0.18));floatText(p.x,p.y-60,'♪♫','#fff',18);}};
      if(d.use==='clock')return {l:'みる',f:()=>{toast('いまは '+Math.floor(S.time/60)%24+'じ '+Math.floor(S.time%60)+'ふん だよ');}};

function editTap(cx,cy){
  const e=G.edit;if(e.garden){gardenTap(cx,cy);return;}const wx=G.icam.x+cx/G.izoom,wy=G.icam.y+cy/G.izoom;
  const tx=Math.floor(wx/TS),ty=Math.floor(wy/TS);const [W,H]=roomSize();
  if(e.hold){
    const d=FURN[e.hold];const fw=(e.rot%2)?d.h:d.w,fh=(e.rot%2)?d.w:d.h;
    const px=clamp(tx,0,W-fw),py=clamp(ty,0,H-fh);
    if(!PCK&&!(e.hover&&clamp(e.hover[0],0,W-fw)===px&&clamp(e.hover[1],0,H-fh)===py)){e.hover=[px,py];SFX.open();renderEditBar();return;}

      if(!S.inv[e.hold])e.hold=null;}

function hurtPlayer(raw,fx,fy){
  const p=G.player;if(p.inv>0||G.dead)return;
  const dmg=Math.max(1,Math.round((raw-defv()*0.6)*rnd(0.85,1.15)));
  S.hp-=dmg;p.inv=0.7;G.lastHit=performance.now();const ang=Math.atan2(p.y-fy,p.x-fx);p.kbx=Math.cos(ang)*220;p.kby=Math.sin(ang)*220;
  SFX.hurt();floatText(p.x,p.y-55,'-'+dmg,'#ff5050',16);updateHud(true);
  if(S.hp<=0){S.hp=0;die();}
}

    else if(a.k==='dash'){const nx=m.x+a.vx*dt,ny=m.y+a.vy*dt;if(Math.hypot(nx-m.home.x,ny-m.home.y)<LEASH)moveEnt(m,a.vx*dt,a.vy*dt,d.r*0.5);if(Math.random()<0.5)G.parts.push({x:m.x,y:m.y-4,vx:0,vy:-20,life:.4,col:'rgba(220,220,220,.6)',sz:5,g:0,smoke:1});if(a.t<=0)m.act=null;}
    else if(a.k==='jump'){const pr=1-Math.max(0,a.t)/a.max;m.x=a.sx+(a.tx-a.sx)*pr;m.y=a.sy+(a.ty-a.sy)*pr;m.jumpH=Math.sin(pr*Math.PI)*70;
      if(a.t<=0){m.jumpH=0;m.act=null;burst(m.x,m.y,'#9fd0ff',20);noise(.25,.25,400);if(collide(m.x,m.y,d.r*0.5)){m.x=a.sx;m.y=a.sy;}}}
  }else{
    let spd=d.spd*(enr?1.25:1);if(m.slow>0){m.slow-=dt;spd*=0.55;}if(d.base==='slime')spd*=Math.max(0,Math.sin(m.t*5))*1.8;
    if(dist>d.r+14){const vx=(p.x-m.x)/dist,vy=(p.y-m.y)/dist;const nx=m.x+vx*spd*dt,ny=m.y+vy*spd*dt;
      if(Math.hypot(nx-m.home.x,ny-m.home.y)<LEASH)moveEnt(m,vx*spd*dt,vy*spd*dt,d.r*0.5);}
    m.skillT-=dt;

  }
}

const NET={lands:{},landKey:'',houses:{},houseKey:'',reg:{},regKey:'',regT:0,okAt:0,rb:'',ws:null,cx:[],ok:false,bi:0,buf:new Uint8Array(0),others:{},sendT:0,hbT:0,pingT:0,retryT:0,last:'',ek:0,tries:0,

const te=new TextEncoder(),td=new TextDecoder();
function hashStr(t){let h=2166136261;for(const ch of t){h^=ch.codePointAt(0);h=Math.imul(h,16777619)>>>0;}return h.toString(36);}
function roomBase(){return (S&&S.worldCode?NET.base+'k/'+hashStr(S.worldCode)+'/':NET.base)+'m5/';}
function mqStr(s){const b=te.encode(s);const o=new Uint8Array(b.length+2);o[0]=b.length>>8;o[1]=b.length&255;o.set(b,2);return o;}
function mqPkt(h,parts){let len=0;parts.forEach(p=>len+=p.length);const rl=[];let x=len;do{let d=x%128;x=Math.floor(x/128);if(x>0)d|=128;rl.push(d);}while(x>0);
  const o=new Uint8Array(1+rl.length+len);o[0]=h;o.set(rl,1);let i=1+rl.length;parts.forEach(p=>{o.set(p,i);i+=p.length;});return o;}
function mqSendTo(c,b){try{if(c.ws&&c.ws.readyState===1)c.ws.send(b);}catch(e){}}
function mqSend(b){for(const c of NET.cx)if(c.ok)mqSendTo(c,b);}
function mqPub(topic,msg,retain){if(!retain&&msg&&msg[0]==='{'&&msg.length>2)msg='{"_q":'+((Math.random()*1e9)|0)+','+msg.slice(1);mqSend(mqPkt(0x30|(retain?1:0),[mqStr(topic),te.encode(msg)]));}
function netOpen(url){
  if(!S||!S.online)return;if(NET.cx.some(c=>c.url===url))return;
  let ws;try{ws=new WebSocket(url,['mqtt']);}catch(e){return;}
  const c={url,ws,ok:false,buf:new Uint8Array(0)};NET.cx.push(c);ws.binaryType='arraybuffer';
  ws.onopen=()=>{const cid='fw_'+S.pid+'_'+Math.random().toString(36).slice(2,6);NET.rb=roomBase();const will=NET.rb+'p/'+S.pid;
    const vh=new Uint8Array([0,4,77,81,84,84,4,0x02|0x04,0,30]);mqSendTo(c,mqPkt(0x10,[vh,mqStr(cid),mqStr(will),mqStr('{"bye":1}')]));};
  ws.onmessage=ev=>{const d=new Uint8Array(ev.data);const nb=new Uint8Array(c.buf.length+d.length);nb.set(c.buf);nb.set(d,c.buf.length);c.buf=nb;mqParse(c);};
  ws.onclose=()=>{const k=NET.cx.indexOf(c);if(k>=0)NET.cx.splice(k,1);if(!NET.cx.some(x=>x.ok)&&NET.ok){NET.ok=false;NET.others={};updateNetChip();}};
  ws.onerror=()=>{try{ws.close();}catch(e){}};
}
function netStart(){if(!S||!S.online)return;NET.ws=NET.ws||{multi:1};for(const u of NET.BROKERS)netOpen(u);}

function mqSplit(buf,cb){
  for(;;){
    if(buf.length<2)return buf;
    let mul=1,len=0,i=1,dg;do{if(i>=buf.length)return buf;dg=buf[i++];len+=(dg&127)*mul;mul*=128;}while(dg&128);
    if(buf.length<i+len)return buf;
    const h=buf[0],body=buf.subarray(i,i+len);buf=buf.slice(i+len);cb(h,body);
  }
}
function mqPubParse(h,body){const tl=(body[0]<<8)|body[1];const topic=td.decode(body.subarray(2,2+tl));let off=2+tl;if((h>>1)&3)off+=2;return [topic,td.decode(body.subarray(off))];}
function mqSubPkt(topics){const parts=[new Uint8Array([0,1])];topics.forEach(t=>{parts.push(mqStr(t));parts.push(new Uint8Array([0]));});return mqPkt(0x82,parts);}
function netSubList(){return [NET.rb+'p/+',NET.rb+'chat',NET.rb+'reg/+',NET.rb+'house/+',NET.rb+'help/'+S.pid+'/+',NET.rb+'mobs',NET.rb+'hit',NET.rb+'kill',NET.rb+'fx',NET.rb+'act',NET.rb+'world/state',NET.rb+'wop',NET.rb+'plot/+'];}
function netDup(topic,msg){if(topic.startsWith(NET.rb+'p/')||topic===NET.rb+'mobs')return false;const now=Date.now();const k=topic+'\n'+msg;NET.seen=NET.seen||new Map();const t=NET.seen.get(k);NET.seen.set(k,now);
  if(NET.seen.size>800){for(const [kk,tt] of NET.seen)if(now-tt>10000)NET.seen.delete(kk);}return t!==undefined&&now-t<10000;}
function mqParse(c){
  c.buf=mqSplit(c.buf,(h,body)=>{
    const type=h>>4;

/* ================= PASSWORD & CLOUD SAVE ================= */
function sha256(ascii){
  function rr(v,a){return (v>>>a)|(v<<(32-a));}
  const maxWord=Math.pow(2,32);let result='';const words=[];const bitLen=ascii.length*8;
  const hash=[],k=[];let pc=0;const comp={};
  for(let c=2;pc<64;c++){if(!comp[c]){for(let i=0;i<313;i+=c)comp[i]=c;hash[pc]=(Math.pow(c,.5)*maxWord)|0;k[pc++]=(Math.pow(c,1/3)*maxWord)|0;}}
  ascii+='\x80';while(ascii.length%64-56)ascii+='\x00';
  for(let i=0;i<ascii.length;i++){const j=ascii.charCodeAt(i);if(j>>8)return '';words[i>>2]|=j<<((3-i)%4)*8;}
  words[words.length]=((bitLen/maxWord)|0);words[words.length]=bitLen;
  for(let j=0;j<words.length;){const w=words.slice(j,j+=16);const old=hash.slice(0,8);let h=hash.slice(0,8);
    for(let i=0;i<64;i++){const w15=w[i-15],w2=w[i-2];const a=h[0],e=h[4];
      const t1=h[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&h[5])^((~e)&h[6]))+k[i]+(w[i]=(i<16)?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
      const t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&h[1])^(a&h[2])^(h[1]&h[2]));
      h.unshift((t1+t2)|0);h[4]=(h[4]+t1)|0;}
    for(let i=0;i<8;i++)hash[i]=(h[i]+old[i])|0;}
  for(let i=0;i<8;i++)for(let j=3;j+1;j--){const b=(hash[i]>>(j*8))&255;result+=((b<16)?0:'')+b.toString(16);}
  return result;}

function pwHash(pw,salt){let h=unescape(encodeURIComponent(salt+':'+pw));for(let i=0;i<3000;i++)h=sha256(h+salt);return h;}

const CRYPTO_OK=!!(window.crypto&&crypto.subtle&&window.isSecureContext!==false);
const b64e=u8=>{let s='';for(let i=0;i<u8.length;i+=8192)s+=String.fromCharCode.apply(null,u8.subarray(i,i+8192));return btoa(s);};
const b64d=t=>{const s=atob(t);const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u;};
async function deriveKey(pw,pid){

  return crypto.subtle.deriveKey({name:'PBKDF2',salt:te.encode('futeworld-save:'+pid),iterations:60000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);

      }catch(e){msg.textContent='データを ひらけなかったよ（パスワードが かわった かも）';}
    });

function hitMob(m,dmg,ang,kb,col,slow){if(m.hp<=0)return;dealDamage(m,dmg,ang,kb,{col,slow});}
function magDmg(m,mult){const d=MOB[m.type];return Math.max(1,(mag()*mult-d.def*0.3)*rnd(0.9,1.1));}
function aimTarget(range){
  const p=G.player;let best=null,bd=1e9;
  for(const m of G.monsters){const dd=Math.hypot(m.x-p.x,m.y-p.y);if(dd<range&&dd<bd){bd=dd;best=m;}}
  return best;
}
function curSpell(){const kn=knownSpells();if(!kn.length)return null;S.spell=clamp(S.spell|0,0,kn.length-1);return kn[S.spell];}
function cycleSpell(){const kn=knownSpells();S.spell=((S.spell|0)+1)%kn.length;SFX.open();const sp=curSpell();toast(sp.ic+' '+sp.n+'（MP'+sp.mp+'）：'+sp.d);updateHud(true);}
function castSpell(){
  if(!G.playing||G.paused||G.dead)return;
  const p=G.player;const sp=curSpell();if(!sp)return;
  if(G.scene==='in'&&sp.id!=='heal'){toast('家の中では まほうは つかえないよ');return;}
  if(p.mcd>0)return;
  if(S.mp<sp.mp){toast('MPが たりないよ（'+sp.n+'は MP'+sp.mp+'）');SFX.bad();return;}
  S.mp-=sp.mp;p.mcd=sp.cd;p.atkT=0.25;
  const tgt=aimTarget(300);const [fx,fy]=DIRV[p.dir];
  const ang=tgt?Math.atan2((tgt.y-10)-(p.y-24),tgt.x-p.x):Math.atan2(fy,fx);

const MOBK=Object.keys(MOB),ZONEK=Object.keys(ZONES);

function nearestTo(x,y,maxD,rect){let b=null,bd=maxD||1e9;for(const q of G.plist||[]){if(rect&&!inRect(Math.floor(q.x/TS),Math.floor(q.y/TS),rect))continue;const d=Math.hypot(q.x-x,q.y-y);if(d<bd){bd=d;b=q;}}return b;}

}
function applyHit(m,dmg,ang,kb,slow,from){
  if(m.hp<=0)return;const d=MOB[m.type];

/* host simulation (monsters, bosses, spawning) */
function worldSim(dt){
  const P=G.plist;

    const d=MOB[m.type];m.t+=dt;m.flash=Math.max(0,m.flash-dt);m.cd=Math.max(0,(m.cd||0)-dt);m.hpShow=Math.max(0,m.hpShow-dt);
    if(d.raid){updateRaid(m,dt);continue;}
    if(d.boss){updateBoss(m,dt);continue;}
    const z=ZONES[m.zone]||ZONES.forest;
    const tp=nearestTo(m.x,m.y,1e9,{x:z.x-1,y:z.y-1,w:z.w+2,h:z.h+2});
    const dist=tp?Math.hypot(tp.x-m.x,tp.y-m.y):1e9;
    if(m.kbx||m.kby){moveEnt(m,m.kbx*dt,m.kby*dt,d.r*0.6);m.kbx*=Math.pow(0.002,dt);m.kby*=Math.pow(0.002,dt);if(Math.abs(m.kbx)<5){m.kbx=m.kby=0;}}
    if(tp&&dist<d.aggro){m.state='chase';}
    else if(m.state==='chase'&&(!tp||dist>d.aggro*1.8))m.state='idle';
    let vx=0,vy=0;
    if(m.castT>0)m.castT-=dt;
    if(m.state==='chase'&&tp){vx=(tp.x-m.x)/dist;vy=(tp.y-m.y)/dist;if(d.caster&&dist<190){m.dir=vx>0?1:-1;vx=vy=0;m.cd2=(m.cd2||1)-dt;if(m.cd2<=0){m.cd2=rnd(2,2.8);m.castT=0.5;const a=Math.atan2(tp.y-14-(m.y-20),tp.x-m.x);for(const o of (d.shots===1?[0]:[-0.18,0,0.18]))shot(m.x,m.y-22,a+o,165,{col:d.scol||'#b06aff',r:8,dmg:d.atk*(m.mul||1)*0.75,life:2.2});}}}
    else{m.timer-=dt;if(m.timer<=0){m.timer=rnd(1.5,4);m.tx=m.x+rnd(-80,80);m.ty=m.y+rnd(-80,80);}
      const dd=Math.hypot(m.tx-m.x,m.ty-m.y);if(dd>6){vx=(m.tx-m.x)/dd*0.5;vy=(m.ty-m.y)/dd*0.5;}}
    let spd=d.spd;if(d.base==='slime'||m.type==='slime'){spd*=Math.max(0,Math.sin(m.t*5))*1.8;}
    if(m.slow>0){m.slow-=dt;spd*=0.4;}
    if(vx||vy){const nx=m.x+vx*spd*dt,ny=m.y+vy*spd*dt;const ntx=Math.floor(nx/TS),nty=Math.floor(ny/TS);
      if(inRect(ntx,nty,z)){moveEnt(m,vx*spd*dt,vy*spd*dt,d.r*0.6);}else{m.tx=m.x;m.ty=m.y;}
      if(Math.abs(vx)>0.1)m.dir=vx>0?1:-1;}
  }
  G.monsters=G.monsters.filter(m=>m.hp>0);
  G.spawnT-=dt;
  if(G.spawnT<=0){G.spawnT=4;{const P=(G.plist&&G.plist.length?G.plist:[G.player]);G.monsters=G.monsters.filter(m=>{const z=ZONES[m.zone];if(!z||!z.wide||m.minion||m.state==='chase')return true;return P.some(q=>Math.hypot(q.x-m.x,q.y-m.y)<44*TS);});}
    for(const zk2 in ZONES){if(ZONES[zk2].wide){const c=G.monsters.filter(m=>m.zone===zk2).length;if(c<ZONES[zk2].max){trySpawn(zk2);if(c+1<ZONES[zk2].max)trySpawn(zk2);}continue;}const c=G.monsters.filter(m=>m.zone===zk2&&!MOB[m.type].boss&&!m.minion).length;if(c<ZONES[zk2].max)trySpawn(zk2);}
    BOSSES.forEach(b=>{if((S.bossDay[b.id]===undefined||S.day>S.bossDay[b.id])&&!(G.plist||[]).some(q=>Math.hypot(q.x-b.x*TS,q.y-b.y*TS)<TS*12))spawnBoss(b);});}
}

window.addEventListener('keydown',e=>{
  if(document.activeElement&&document.activeElement.tagName==='INPUT')return;
  initAudio();
  if(panelState){
    if(e.key==='Escape'){closePanel();}
    else if(panelState&&((/^[mM]$/.test(e.key)&&panelState.title.includes('ちず'))||(/^[hH?]$/.test(e.key)&&panelState.title.includes('あそびかた')))){e.preventDefault();closePanel();}
    else if((e.key===' '||e.key==='Enter')&&forge&&!forge.done){e.preventDefault();hammer();}
    return;
  }
  if(!G.playing)return;
  if(G.edit){if(e.key==='Escape'||e.key==='Enter')editCmd('done');if(e.key==='r'||e.key==='R')editCmd('rot');if(e.key==='Delete'||e.key==='Backspace')editCmd('store');return;}
  G.keys[e.key]=true;
  if(e.key===' '||e.key==='Enter'||e.key==='j'||e.key==='J'){e.preventDefault();if(!e.repeat){doAction();G.held=true;G.heldT=0.4;}}
  if(e.key==='q'||e.key==='Q')cycleSeed();
  if(e.key==='1')quickHeal();
  if(e.key==='2')quickMp();
  if(e.key==='e'||e.key==='E')castSpell();
  if(e.key==='r'||e.key==='R')cycleSpell();
  if(e.key==='t'||e.key==='T'){e.preventDefault();if(S&&!S.dockOpen)setDock(true);const i=$('dockIn');if(i&&!i.disabled)i.focus();else openChat();}
  if(e.key==='m'||e.key==='M'){e.preventDefault();showMap();}
  if(e.key==='Escape'||e.key==='Tab'){e.preventDefault();openMenu();}
  if(e.key==='h'||e.key==='H'||e.key==='?'){e.preventDefault();openHelp();}
  if(e.key.startsWith('Arrow'))e.preventDefault();
});
