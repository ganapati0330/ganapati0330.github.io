@media (orientation:portrait) and (pointer:coarse) and (max-width:900px){body:not(.rotok) #rotate{display:flex}}
/* panel */
#panelWrap{position:fixed;inset:0;z-index:3100;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:10px}
#panel{background:#fff8e6;border:4px solid #7a5230;border-radius:18px;width:min(560px,96vw);max-height:92vh;display:flex;flex-direction:column;box-shadow:0 6px 0 rgba(0,0,0,.3)}
#panel h2{margin:0;padding:10px 14px;font-size:19px;background:#7a5230;color:#fff;border-radius:12px 12px 0 0;display:flex;align-items:center;gap:8px}
#panel h2 .x{margin-left:auto;background:#fff;color:#7a5230;border:none;border-radius:10px;font-size:16px;font-weight:bold;width:36px;height:32px}
#pbody{padding:10px 12px;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.tabs{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.tab{padding:6px 12px;border-radius:10px;border:2px solid #c9a27a;background:#f5e6cc;font-weight:bold;font-size:14px}
.tab.on{background:#f08c1a;color:#fff;border-color:#f08c1a}
.row{display:flex;align-items:center;gap:8px;padding:7px 6px;border-bottom:1px dashed #d9c3a3;font-size:14px}
.row .ic{font-size:22px;width:30px;text-align:center}
.row .nm{flex:1;font-weight:bold}
.row .nm small{display:block;font-weight:normal;color:#8a6a4a;font-size:11px}
.row .pr{font-weight:bold;color:#b0620a;white-space:nowrap}
.sbtn{padding:6px 10px;border-radius:10px;border:2px solid #b0620a;background:#ffd36b;font-weight:bold;font-size:13px;white-space:nowrap}
.sbtn:disabled{opacity:.4}
.sbtn.g{background:#a8e08a;border-color:#4f9a45}
.msg{background:#fff;border:2px solid #e3cfae;border-radius:12px;padding:8px 10px;margin-bottom:8px;font-size:14px;display:flex;gap:8px;align-items:center}
.msg .who{font-size:28px}
.stars{color:#f0a000;letter-spacing:1px}
.need{font-size:11px;color:#8a6a4a}
.need .ng{color:#d33}
.forge{text-align:center}
.fbar{position:relative;height:34px;background:linear-gradient(90deg,#555,#777,#555);border-radius:10px;margin:14px 4px;overflow:hidden;border:3px solid #333}
.fzone{position:absolute;top:0;bottom:0;background:rgba(255,200,0,.55)}
.fzone2{position:absolute;top:0;bottom:0;background:rgba(255,80,0,.85)}
.fneedle{position:absolute;top:-2px;bottom:-2px;width:6px;background:#fff;box-shadow:0 0 6px #fff;margin-left:-3px}
.hits{font-size:22px;min-height:30px}
#mapCv{width:100%;image-rendering:pixelated;border-radius:10px;border:3px solid #7a5230}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:14px}
.statgrid div{background:#fff;border-radius:10px;padding:6px 10px;border:2px solid #e3cfae}
@media (max-width:640px){#stat{min-width:140px;padding:4px 8px}#info{max-width:calc(100vw - 175px);flex-wrap:wrap;justify-content:flex-end}.chip{font-size:12px;padding:3px 8px}.ib{width:38px;height:38px;font-size:18px}#toast div{font-size:13px}#banner{font-size:21px}}
.decoB{background:rgba(220,120,60,.95)!important}
#editBar{position:fixed;left:0;right:0;bottom:0;z-index:2100;background:rgba(255,248,230,.97);border-top:4px solid #7a5230;padding:6px 8px calc(6px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px}
.ebtns{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.ebtns button{padding:7px 12px;border-radius:12px;border:3px solid #7a5230;background:#fff3d6;font-weight:bold;font-size:14px}
.ebtns button.done{background:#a8e08a;border-color:#4f9a45}
#eList{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x;padding-bottom:2px;min-height:62px}
.ei{flex:0 0 auto;width:74px;border-radius:12px;border:3px solid #c9a27a;background:#fff;font-size:11px;font-weight:bold;padding:3px;display:flex;flex-direction:column;align-items:center;line-height:1.15}
.ei span{font-size:22px}
.ei.on{border-color:#f08c1a;background:#fff0c8;box-shadow:0 0 0 3px #ffd36b}
#editHint{color:#5a3010;font-size:13px;font-weight:bold;text-align:center}
body.panelOpen #toast{bottom:auto!important;top:calc(6px + env(safe-area-inset-top))}
body.panelOpen #toast div{font-size:12px;padding:5px 12px}
body.editing #toast{bottom:auto;top:calc(110px + env(safe-area-inset-top))}
@media (max-width:640px){.ebtns button{padding:5px 8px;font-size:12px}.ei{width:64px}}
.sw{display:inline-block;width:44px;height:30px;border-radius:6px;border:2px solid #7a5230;vertical-align:middle}
#fade{position:fixed;inset:0;background:#000;z-index:2700;opacity:0;pointer-events:none;transition:opacity .6s;display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px;font-weight:bold}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud" class="hidden">
  <div id="stat">
    <div class="nm"><span class="lv" id="hLv">Lv1</span><span id="hName">なまえ</span></div>
    <div class="bar"><i id="hHp"></i><b id="hHpT">40/40</b></div>
    <div class="bar mp"><i id="hMp"></i><b id="hMpT">10/10</b></div>
    <div class="bar exp"><i id="hExp"></i></div>
  </div>
  <div id="info">
    <div class="chip" id="hGold">💰 0</div>
    <div class="chip" id="hTime">1日め 6:00</div>
    <button class="chip" id="netBtn" style="cursor:pointer">🌐…</button>
    <button class="ib fsBtn" id="fsBtn" title="ぜんがめん">⛶</button>
    <button class="ib" id="helpBtn">❓</button>
    <button class="ib" id="mapBtn">🗺️</button>
    <button class="ib" id="menuBtn">☰</button>
  </div>
  <div id="goal" class="hidden"></div>
  <div id="btns">
    <div class="side">
      <button class="sb" id="seedBtn">🌱タネ</button>
      <button class="sb hidden" id="healBtn">🧪HP</button>
      <button class="sb hidden" id="mpBtn" style="background:rgba(60,110,210,.92)">🔷MP</button>
      <button class="sb hidden" id="stampBtn" style="background:rgba(70,120,200,.92)">💬<br>チャット</button>
      <button class="sb decoB hidden" id="decoBtn">🛋️<br>もようがえ</button>
    </div>
    <div class="side mag">
      <button class="sb" id="spellBtn" style="background:rgba(120,70,190,.92);min-width:62px;height:34px;font-size:11px">⇄ まほう</button>
      <button id="magBtn">🔥<br><small>3</small></button>
    </div>
    <button id="actBtn">こうげき</button>
  </div>
</div>
<div id="editBar" class="hidden">
  <div id="editHint"></div>
  <div class="ebtns"><button data-e="rot">↻ まわす</button><button data-e="store">📦 しまう</button><button data-e="wall">🧱 かべがみ</button><button data-e="floor">🟫 ゆか</button><button data-e="done" class="done">✅ おわる</button></div>
  <div id="eList"></div>
</div>
<div id="joyBase" class="hidden"><div id="joyKnob"></div></div>
<div id="bossBar" class="hidden"><div id="bossName"></div><div class="bbar"><i id="bossHp"></i></div></div>
<div id="chatDock" class="hidden">
  <div id="dockLog"></div>
  <div class="dockRow"><input id="dockIn" maxlength="40" placeholder="チャット（40もじまで）" enterkeyhint="send" autocomplete="off"><button id="dockSend">おくる</button><button id="dockMore" title="スタンプ・りれき">😊</button><button id="dockClose" title="とじる">▼</button></div>
</div>
<button id="dockOpen">💬</button>
<div id="roster" class="hidden"></div>
<div id="chatTicker"></div>
<div id="toast"></div>
<div id="banner"></div>
<div id="help" class="hidden"></div>
<div id="keybar"><span><kbd class="k">↑↓←→</kbd>/<kbd class="k">WASD</kbd> いどう</span><span><kbd class="k">スペース</kbd> ボタン</span><span><kbd class="k">E</kbd> まほう</span><span><kbd class="k">Q</kbd> タネ</span><span><kbd class="k">1</kbd>/<kbd class="k">2</kbd> くすり</span><span><kbd class="k">M</kbd> ちず</span><span><kbd class="k">Esc</kbd> メニュー</span><span><kbd class="k">H</kbd> ヘルプ</span><button class="x" id="keybarX" title="かくす">×</button></div>
<div id="fade"></div>

<!-- title -->
<div id="title" class="screen tscreen">
  <div class="tart" role="img" aria-label="フテ猫ワールド そだてて、つくって、ぼうけんしよう！"></div>
  <div class="tpanel">
    <div class="tph"><span>🐾</span>あそぶデータを<br>えらぼう<span>🐾</span></div>
    <div class="tslots" id="slots"></div>
    <div class="tsep"></div>
    <div class="tbtns" id="tbtns"></div>
    <div class="tver" id="verT"></div>
  </div>
</div>
<div id="rotate"><div class="rph">📱</div><b>スマホを よこむきに してね</b><small>よこに すると ひろい がめんで あそべるよ</small><button id="rotSkip">たてのまま つづける</button><small style="font-size:12px;opacity:.85">（がめんの どこを タップしても すすめます）<br>よこにしても かわらないときは、スマホの「画面の向きのロック」を はずしてね</small></div>

<!-- char select -->
<div id="charsel" class="screen hidden">
  <div class="logo" style="font-size:clamp(26px,6vw,40px)">キャラクターをえらぼう</div>
  <div class="card-grid" id="cards"></div>
  <div class="box">
    <span style="font-weight:bold">ログインなまえ：</span>
    <input id="nameIn" maxlength="8" placeholder="なまえ">
    <button class="big" id="startBtn">はじめる！</button>
    <button class="big gray" id="backBtn">もどる</button>
  </div>
</div>

<div id="panelWrap" class="hidden"><div id="panel"><h2><span id="ptitle"></span><button class="x" id="pclose">✕</button></h2><div id="pbody"></div></div></div>

<div id="errBox" style="display:none;position:fixed;left:6px;bottom:6px;z-index:9999;background:#c0392b;color:#fff;font-size:11px;padding:4px 8px;border-radius:6px;max-width:90vw;pointer-events:none"></div>
<script>
window.addEventListener('error',function(e){var b=document.getElementById('errBox');if(b){b.style.display='block';b.textContent='エラー: '+(e.message||'')+' ('+(e.lineno||'')+')';}});
</script>

let AC=null, soundOn=true, bgmOn=true, bgmTimer=null, bgmStep=0, bgmNext=0;
function initAudio(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;}}
  if(AC&&AC.state==='suspended')AC.resume();
  if(AC&&!bgmTimer)startBgm();

function tone(f,d,type,v,slide,delay){
  if(!AC||!soundOn)return;
  const t=AC.currentTime+(delay||0);
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.linearRampToValueAtTime(Math.max(30,f+slide),t+d);
  g.gain.setValueAtTime(v||0.08,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+0.02);
}
let noiseBuf=null;
function noise(d,v,ff){
  if(!AC||!soundOn)return;
  if(!noiseBuf){noiseBuf=AC.createBuffer(1,AC.sampleRate*0.5,AC.sampleRate);const a=noiseBuf.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;}
  const t=AC.currentTime,s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=noiseBuf;f.type='lowpass';f.frequency.value=ff||2000;
  g.gain.setValueAtTime(v||0.1,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);
  s.connect(f);f.connect(g);g.connect(AC.destination);s.start(t);s.stop(t+d+0.02);
}

function musInit(){
  if(MUS.unlocked)return;MUS.unlocked=true;
  for(const k in MUS.tracks){const a=new Audio();a.src=MUS.tracks[k].src;a.loop=true;a.preload=k==='farm'?'auto':'metadata';if(location.protocol.startsWith('http'))a.crossOrigin='anonymous';a.setAttribute('playsinline','');MUS.el[k]=a;
    let g=null;try{if(AC&&location.protocol.startsWith('http')){const n=AC.createMediaElementSource(a);g=AC.createGain();g.gain.value=0;n.connect(g);g.connect(AC.destination);}}catch(e){g=null;}
    MUS.gain[k]=g;if(!g)a.volume=0;
    const p=a.play();if(p&&p.then)p.then(()=>{if(MUS.cur!==k)a.pause();}).catch(()=>{});}
}
function musVol(k,v,sec){const g=MUS.gain[k],a=MUS.el[k];if(!a)return;
  if(g&&AC){const t=AC.currentTime;g.gain.cancelScheduledValues(t);g.gain.setValueAtTime(g.gain.value,t);g.gain.linearRampToValueAtTime(v,t+sec);}
  else{const from=a.volume,st=performance.now();const step=()=>{const r=Math.min(1,(performance.now()-st)/(sec*1000));try{a.volume=Math.max(0,Math.min(1,from+(v-from)*r));}catch(e){}if(r<1)requestAnimationFrame(step);};step();}}
function musSet(k){
  const on=bgmOn&&soundOn&&!document.hidden;const target=on?k:null;
  if(target===MUS.cur)return;
  const old=MUS.cur;MUS.cur=target;
  if(old&&MUS.el[old]){const a=MUS.el[old];musVol(old,0,1.2);setTimeout(()=>{if(MUS.cur!==old)a.pause();},1300);}
  if(target&&MUS.el[target]){const a=MUS.el[target];if(target==='battle'&&old!=='battle'&&a.currentTime>0&&a.paused)a.currentTime=0;
    const p=a.play();if(p&&p.catch)p.catch(()=>{MUS.cur=null;});musVol(target,MUS.tracks[target].vol,1.2);}
}

const qOf=k=>{const i=k.indexOf('@');return i<0?0:+k.slice(i+1);};

function cnt(id){let n=0;for(const k in S.inv){if(k===id||k.startsWith(id+'@'))n+=S.inv[k];}return n;}
function addItem(k,n){S.inv[k]=(S.inv[k]||0)+(n===undefined?1:n);if(S.inv[k]<=0)delete S.inv[k];}
function avail(k){return (S.inv[k]||0)-((S.eq.w===k||S.eq.a===k)?1:0);}
function takeItem(id,n){
  const keys=Object.keys(S.inv).filter(k=>k===id||k.startsWith(id+'@')).sort((a,b)=>qOf(a)-qOf(b));
  for(const k of keys){const a=avail(k);const t=Math.min(n,a);if(t>0){addItem(k,-t);n-=t;}if(n<=0)break;}

}

  const cat=k.slice(1);
  const keys=Object.keys(S.inv).filter(x=>ITEMS[baseOf(x)].cat===cat).sort((a,b)=>sellPrice(a)-sellPrice(b));

function jst(){const d=new Date(Date.now()+9*3600000);return {min:d.getUTCHours()*60+d.getUTCMinutes()+d.getUTCSeconds()/60,key:d.toISOString().slice(0,10),m:d.getUTCMonth()+1,dd:d.getUTCDate(),w:'日月火水木金土'[d.getUTCDay()]};}

function checkDate(silent){
  const j=jst();
  if(!S.lastDate){S.lastDate=j.key;return;}
  if(S.lastDate===j.key)return;
  const days=Math.round((Date.parse(j.key)-Date.parse(S.lastDate))/86400000);
  S.lastDate=j.key;
  if(days<=0)return;
  for(let i=0;i<Math.min(days,7);i++)newDay(i>0);
  if(days>7)S.day+=days-7;
  if(!silent&&G.playing)banner((S.rain?'☔ ':'☀️ ')+'あたらしい日（'+j.m+'月'+j.dd+'日）');
  if(G.playing){BOSSES.forEach(b=>{if(S.bossDay[b.id]!==undefined&&S.day>S.bossDay[b.id])spawnBoss(b);});saveGame(true);}
}

function toXY(o){const r={};for(const k in o){const i=+k;r[(i%MW)+','+Math.floor(i/MW)]=o[k];}return r;}

function refundPlant(p){
  if(p.k==='tree')return p.id;

  if(p.k==='veg'){const cr=CROPS[p.id];return cr&&p.st>=cr.days?p.id:p.id+'_seed';}

function holdOrAdd(k,n){if(ITEMS[baseOf(k)])addItem(k,n);else S.invHold[k]=(S.invHold[k]||0)+n;}
function normalizeSave(isNew){
  const notes=[];
  if(!Array.isArray(S.tutQ)){
    if(typeof S.tut==='number')S.tutQ=S.tut<TUT_OLD.length?TUT_OLD.slice(S.tut):[];
    else S.tutQ=isNew?TUT_HOME.concat(TUT_BASE,TUT_PATHS.chair):((S.st&&S.st.harv>0)||(S.day||1)>3?[]:TUT_BASE.concat(TUT_PATHS.chair));
    delete S.tut;
    S.combatIntro=!S.tutQ.length||!TUT_HOME.concat(TUT_BASE,['sell','buyfurn','place']).includes(S.tutQ[0]);
  }
  S.tutQ=S.tutQ.filter(k=>typeof k==='string'&&TUT_ALL.includes(k));
  S.inv=S.inv||{};S.invHold=S.invHold||{};S.st=Object.assign({kill:0,harv:0,craft:0,earn:0},S.st||{});S.eq=S.eq||{w:null,a:null};
  // item renames
  const ren=k=>{const b=baseOf(k);const nb=ITEM_ALIASES[b]||FURN_ALIASES[b];return nb?nb+k.slice(b.length):k;};
  for(const k of Object.keys(S.inv)){const nk=ren(k);if(nk!==k){S.inv[nk]=(S.inv[nk]||0)+S.inv[k];delete S.inv[k];}}
  for(const k of Object.keys(S.invHold)){const nk=ren(k);if(nk!==k){S.invHold[nk]=(S.invHold[nk]||0)+S.invHold[k];delete S.invHold[k];}}
  ['w','a'].forEach(s2=>{if(S.eq[s2])S.eq[s2]=ren(S.eq[s2]);});
  // items that exist again come back / unknown items are kept hidden
  for(const k of Object.keys(S.invHold)){if(ITEMS[baseOf(k)]){S.inv[k]=(S.inv[k]||0)+S.invHold[k];delete S.invHold[k];notes.push('back');}}
  for(const k of Object.keys(S.inv)){if(!ITEMS[baseOf(k)]){S.invHold[k]=(S.invHold[k]||0)+S.inv[k];delete S.inv[k];}}
  ['w','a'].forEach(s2=>{const k=S.eq[s2];if(k&&!S.inv[k])S.eq[s2]=null;});
  if(S.seed&&!S.inv[S.seed])S.seed=null;
  // v1.0 farm
  let legacyFarm=false;
  if(!S.plants){S.plants={};S.weeds={};S.digs={};if(S.farm)for(const k in S.farm){const f=S.farm[k];if(f.c)S.plants[k]={k:'veg',id:f.c,st:0,w:false};}delete S.farm;S.geo=0;legacyFarm=true;}
  // positions -> current map
  const conv=o=>{o=o||{};if(S.geo)return o;const r={};for(const k in o){const i=+k;r[(i%LEGACY_MW)+','+Math.floor(i/LEGACY_MW)]=o[k];}return r;};
  const P=conv(S.plants),Wd=conv(S.weeds),Dg=conv(S.digs),Sl=conv(S.soil);
  S.plants={};S.weeds={};S.digs={};S.soil={};let refunded=0;
  for(const k in P){const [x,y]=k.split(',').map(Number);const p=P[k];if(!p||!p.k)continue;
    if((p.k==='tree'&&!FRUITS[p.id])||(p.k==='veg'&&!CROPS[p.id])||(p.k==='flower'&&(!FLOWERS[p.id]||!FCOL[p.col]))){const it=refundPlant(p);if(it)holdOrAdd(it,1);continue;}
    if(plantTileOk(x,y)&&!S.plants[idx(x,y)])S.plants[idx(x,y)]=p;else{const it=refundPlant(p);if(it){holdOrAdd(it,1);refunded++;}}}
  for(const k in Wd){const [x,y]=k.split(',').map(Number);if(plantTileOk(x,y)&&!S.plants[idx(x,y)])S.weeds[idx(x,y)]=1;}
  for(const k in Dg){const [x,y]=k.split(',').map(Number);if(inMap(x,y)&&tiles[idx(x,y)]===T.GRASS&&!objs[idx(x,y)]&&bldGrid[idx(x,y)]<0)S.digs[idx(x,y)]=1;}
  for(const k in Sl){const [x,y]=k.split(',').map(Number);if(plantTileOk(x,y)&&inRect(x,y,LAND))S.soil[idx(x,y)]=1;}
  for(const k in S.plants){if(S.plants[k].k==='veg')S.soil[k]=1;}
  S.geo=1;
  if(refunded)notes.push('refund:'+refunded);
  if(!FRUITS[S.native])S.native=Object.keys(FRUITS)[irnd(0,Object.keys(FRUITS).length-1)];
  if(legacyFarm||isNew)initLand();
  // defaults for new fields
  const def=newState(S.name,S.ch);
  for(const k in def){if(S[k]===undefined)S[k]=def[k];}
  for(const k in def.st){if(S.st[k]===undefined)S.st[k]=def.st[k];}
  S.bossDay=S.bossDay||{};delete S.bossAt;
  if(!S.room||!Array.isArray(S.room.items))S.room=def.room;
  if(!S.farmDay)S.farmDay=S.lastDate||jst().key;
  if(S.own&&!(S.own.room&&Array.isArray(S.own.room.items)&&typeof S.own.plot==='number'))delete S.own;
  if(S.own){S.own.room.items=S.own.room.items.filter(it=>FURN[it.id]);S.own.h=clamp(S.own.h|0,1,HOUSES.length-1);}
  if(!Array.isArray(S.walls)||!S.walls.length)S.walls=['plain'];if(!Array.isArray(S.floors)||!S.floors.length)S.floors=['wood'];
  // furniture renamed / removed
  S.room.items=S.room.items.filter(it=>{if(FURN_ALIASES[it.id])it.id=FURN_ALIASES[it.id];if(FURN[it.id])return true;S.invHold[it.id]=(S.invHold[it.id]||0)+1;return false;});
  if(!FRUITS[S.native])S.native=Object.keys(FRUITS)[0];
  if(!Array.isArray(S.quests)||S.quests.some(q=>!ITEMS[q.id]))S.quests=[];
  S.house=clamp(S.house|0,0,HOUSES.length-1);
  S.lv=Math.max(1,S.lv|0);S.gold=Math.max(0,+S.gold||0);
  if(!(S.time>=0&&S.time<=1440))S.time=0;
  S.schema=SCHEMA;
  return notes;
}

function unstuck(){
  const p=G.player;if(!G.playing||G.scene!=='out'||!collide(p.x,p.y,8))return;
  const tx=Math.floor(p.x/TS),ty=Math.floor(p.y/TS);
  for(let r=1;r<=5;r++)for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){if(Math.max(Math.abs(dx),Math.abs(dy))!==r)continue;const x=(tx+dx)*TS+16,y=(ty+dy)*TS+20;if(!collide(x,y,8)){p.x=x;p.y=y;toast('木が 大きく なったので すこし うごいたよ');return;}}

function farmGrow(rain){
  for(const k in S.plants){const p=S.plants[k];
    if(p.k==='veg'){if(p.w&&p.st<CROPS[p.id].days)p.st++;}
    else if(p.k==='flower'){if(p.st<3)p.st++;}
    else if(p.k==='tree'){if(p.st<4){p.st++;if(p.st===4){p.rg=1;p.fr=0;}}else if(p.fr<3){p.rg--;if(p.rg<=0)p.fr=3;}}
  }
  setTimeout(unstuck,0);
  // flower hybrids
  const born=[];
  for(const k in S.plants){const p=S.plants[k];if(p.k!=='flower'||p.st<3||!p.w)continue;const i=+k,x=i%MW,y=Math.floor(i/MW);
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;const q=S.plants[idx(x+dx,y+dy)];
      if(q&&q.k==='flower'&&q.id===p.id&&q.st>=3&&q.w&&+k<idx(x+dx,y+dy)&&Math.random()<0.18){
        const spots=[];for(let j=-1;j<=1;j++)for(let ii=-1;ii<=1;ii++){if(landFree(x+ii,y+j)&&!born.includes(idx(x+ii,y+j)))spots.push(idx(x+ii,y+j));}
        if(spots.length){const sp=spots[irnd(0,spots.length-1)];born.push(sp);S.plants[sp]={k:'flower',id:p.id,col:mixCol(p.col,q.col),st:3,w:false,nw:1};}
      }}}
  for(const k in S.plants){S.plants[k].w=false;}
  if(rain)for(const k in S.plants){if(S.plants[k].k!=='tree')S.plants[k].w=true;}
  spawnWeeds(4);spawnDigs(2);
  if(born.length)setTimeout(()=>toast('🌸 あたらしい花が さいたみたい！'),1500);
}
function mixCol(a,b){
  const key=[a,b].sort().join('+');const r=Math.random();
  const tbl={'red+white':'pink','red+yellow':'orange','white+white':r<0.35?'purple':'white','pink+purple':r<0.3?'blue':'purple','purple+purple':r<0.25?'blue':'purple','orange+purple':r<0.2?'blue':'orange'};
  return tbl[key]||(r<0.5?a:b);
}
function isTilled(i,L){const so=(L||landView()).soil||{};return !!so[i]||inRect(i%MW,Math.floor(i/MW),FIELD);}
function isVegSeed(k){const it=k&&ITEMS[baseOf(k)];return !!(it&&it.cat==='seed'&&it.crop);}
function tillAt(i,tx,ty){S.soil=S.soil||{};S.soil[i]=1;useTool('hoe',tx,ty);SFX.till();dust(tx,ty,'#8b5a2b');floatText(tx*TS+16,ty*TS-2,'🟫','#fff',14);if(!S.tilledOnce){S.tilledOnce=1;toast('たがやした！ ここが はたけに なったよ。野菜の タネを うえよう');}}
function landFree(tx,ty){
  if(!inRect(tx,ty,LAND))return false;const i=idx(tx,ty);
  if(tiles[i]!==T.GRASS||objs[i]||bldGrid[i]>=0)return false;
  if(S.plants[i]||S.weeds[i]||S.digs[i])return false;
  if(ty===32&&tx>=12&&tx<=16)return false;
  return true;
}
function spawnWeeds(n){
  const cur=Object.keys(S.weeds).length;let add=Math.min(n,14-cur);
  for(let t=0;t<200&&add>0;t++){const x=irnd(LAND.x,LAND.x+LAND.w-1),y=irnd(LAND.y,LAND.y+LAND.h-1);if(landFree(x,y)){S.weeds[idx(x,y)]=1;add--;}}
}
function spawnDigs(n){
  let add=Math.min(n,5-Object.keys(S.digs).length);
  for(let t=0;t<300&&add>0;t++){const R=Math.random()<0.6?LAND:MEADOW;const x=irnd(R.x,R.x+R.w-1),y=irnd(R.y,R.y+R.h-1);const i=idx(x,y);
    if(tiles[i]===T.GRASS&&!objs[i]&&bldGrid[i]<0&&!S.plants[i]&&!S.weeds[i]&&!S.digs[i]&&!(S.soil&&S.soil[i])&&!inRect(x,y,FIELD)){S.digs[i]=1;add--;}}
}

/* ================= ENTITIES ================= */
function spawnMob(type,x,y,zone,opt){
  const d=MOB[type];opt=opt||{};const mul=opt.elite?1.7:1;
  const m={type,x,y,hp:Math.round(d.hp*mul),maxHp:Math.round(d.hp*mul),zone,state:'idle',tx:x,ty:y,timer:rnd(0,2),flash:0,dir:1,kbx:0,kby:0,cd:0,t:rnd(0,10),hpShow:0,elite:!!opt.elite,mul,minion:opt.minion||null};
  m.id=mobId();
  if(d.boss){m.home={x,y};m.skillT=2;m.act=null;m.jumpH=0;}
  G.monsters.push(m);return m;
}
function nearLair(tx,ty,r){return BOSSES.find(b=>(tx-b.x)**2+(ty-b.y)**2<=r*r);}
function spawnBoss(b){if(G.monsters.some(m=>m.type===b.id))return;spawnMob(b.id,b.x*TS+16,b.y*TS+24,b.zone);}
function trySpawn(zk){
  const z=ZONES[zk];
  for(let n=0;n<20;n++){
    const tx=irnd(z.x,z.x+z.w-1),ty=irnd(z.y,z.y+z.h-1);
    if(isSolid(tx,ty)||tiles[idx(tx,ty)]===T.PATH)continue;
    const x=tx*TS+16,y=ty*TS+20;
    if((G.plist&&G.plist.length?G.plist:[G.player]).some(q=>Math.hypot(x-q.x,y-q.y)<TS*9))continue;
    if(nearLair(tx,ty,6))continue;
    const e=ENTR[zk];const depth=Math.hypot(tx-e[0],ty-e[1])/Math.hypot(z.w,z.h);
    const elite=Math.random()<clamp((depth-0.3)*1.1,0,0.5);
    spawnMob(z.mobs[irnd(0,z.mobs.length-1)],x,y,zk,{elite});return;
  }
}
function initWorld(){
  G.monsters=[];G.parts=[];G.floats=[];G.respawn=[];G.objHits={};
  for(const k in ZONES){for(let i=0;i<ZONES[k].max;i++)trySpawn(k);}
  G.shots=[];G.warns=[];G.pshots=[];G.fx=[];G.fxOut={s:[],w:[]};G.plist=[];G.wasHost=undefined;S.bossDay=S.bossDay||{};
  BOSSES.forEach(b=>{if(S.bossDay[b.id]===undefined||S.day>S.bossDay[b.id])spawnBoss(b);});
  G.npcs=[];
  const npcCols=[{skin:'#f6d3b0',hair:'#8a5a2a',shirt:'#5bb85b',leg:'#555',shoe:'#333',scale:1,style:'short'},{skin:'#f3cfa8',hair:'#c0c0c0',shirt:'#a0522d',leg:'#444',shoe:'#333',scale:1,style:'short',glasses:1},{skin:'#f9dcc2',hair:'#e0a020',shirt:'#6fa8ff',leg:'#ff8ac0',shoe:'#c0506a',scale:0.9,style:'tails',skirt:1}];
  if(npcCols.length<4)npcCols.push({skin:'#f6d3b0',hair:'#5a3a1a',shirt:'#d8a040',leg:'#333',shoe:'#333',scale:0.95,style:'short'});
  npcCols.forEach((p,i)=>{const key='npc'+i;HUMANS[key]=p;G.npcs.push({kind:key,x:(60+i*7)*TS,y:(31+(i%3)*2)*TS,tx:0,ty:0,timer:0,dir:'down',moving:false,t:0,tip:i});});
}
function collide(x,y,r){
  if(G.scene==='in'){const f=isSolidIn;return f(Math.floor((x-r)/TS),Math.floor((y-r)/TS))||f(Math.floor((x+r)/TS),Math.floor((y-r)/TS))||f(Math.floor((x-r)/TS),Math.floor(y/TS))||f(Math.floor((x+r)/TS),Math.floor(y/TS));}
  return isSolid(Math.floor((x-r)/TS),Math.floor((y-r)/TS))||isSolid(Math.floor((x+r)/TS),Math.floor((y-r)/TS))||isSolid(Math.floor((x-r)/TS),Math.floor(y/TS))||isSolid(Math.floor((x+r)/TS),Math.floor(y/TS));
}
function moveEnt(e,dx,dy,r){
  if(dx&&!collide(e.x+dx,e.y,r))e.x+=dx;
  if(dy&&!collide(e.x,e.y+dy,r))e.y+=dy;
}

/* ================= ACTIONS ================= */
const DIRV={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
function targetTile(){
  const p=G.player,[dx,dy]=DIRV[p.dir];
  return [Math.floor((p.x+dx*24)/TS),Math.floor((p.y-8+dy*26)/TS)];
}
function nearestMob(range){
  const p=G.player;let best=null,bd=1e9;
  for(const m of G.monsters){const d=Math.hypot(m.x-p.x,(m.y-8)-(p.y-14));if(d<range+MOB[m.type].r&&d<bd){bd=d;best=m;}}
  return best;
}
function findAction(){
  const p=G.player;
  const m=nearestMob(40);
  if(m)return {l:'こうげき',f:()=>{faceTo(m.x,m.y);swing();}};
  const [tx,ty]=targetTile();const ptx=Math.floor(p.x/TS),pty=Math.floor(p.y/TS);
  for(const b of BLD){
    const dx=b.x+Math.floor(b.w/2),dy=b.y+b.h-1;
    if((tx===dx&&ty===dy)||(ptx===dx&&pty===dy+1&&p.dir==='up')){
      if(b.deco)return {l:'ノック',f:()=>toast('るすのようだ…')};
      if(b.id==='home'&&G.landOf){const lo=G.landOf;return {l:'おじゃまする',f:()=>visitHouse(lo)};}
      const fn={home:enterHouse,shop:openShop,carp:openCarp,smith:openSmith,guild:openGuild,furn:openFurn}[b.id];
      return {l:b.id==='home'?'いえにはいる':'はいる',f:fn};
    }
  }
  {const pn=plotAtTile(tx,ty);if(pn>=0){const [dx,dy]=plotDoor(pn);if(tx===dx&&ty===dy){const o=plotOwner(pn);
    if(!o)return {l:'あきち',f:()=>openPlot(pn)};if(o.o===S.pid)return {l:'いえにはいる',f:enterOwn};return {l:'おじゃまする',f:()=>visitHouse(o.o)};}}}
  for(const n of G.npcs){if(Math.hypot(n.x-(p.x+DIRV[p.dir][0]*20),n.y-(p.y+DIRV[p.dir][1]*20))<26)return {l:'はなす',f:()=>{SFX.open();toast('「'+NPC_TIPS[(n.tip+S.day)%NPC_TIPS.length]+'」');}};}
  if(!inMap(tx,ty))return p.farm?farmIdle():{l:'こうげき',f:swing};
  const i=idx(tx,ty),o=objs[i];
  if(o===O.SIGN)return {l:'よむ',f:()=>{SFX.open();toast(SIGNS[i]);}};
  if(o===O.POST)return {l:'ポスト',f:openVisit};
  if(o===O.CHEST)return {l:'あける',f:()=>openChest(i,tx,ty)};
  if(o===O.STONE)return {l:'しらべる',f:()=>{SFX.open();toast(['ふるい いしの はしら。ねこの もようが ほってある…','こけむした いし。むかしの ひとの めじるし かな？','いしに てを あてると、すこし あたたかい。'][(tx+ty)%3]);}};
  if(o===O.ARCHP)return {l:'しらべる',f:()=>{SFX.open();toast('ねこの もんしょうが ある ふるい もん。この さきに なにか いる…！');}};
  if(o===O.BENCH)return {l:'すわる',f:()=>{SFX.open();toast('ベンチで ひとやすみ…　ふぅ。');G.myEmote={e:1,t:performance.now()};}};
  if(o===O.TREE)return {l:'きをきる',f:()=>hitObj(tx,ty)};
  if(o===O.ROCK||o===O.IRON||o===O.MITH)return {l:'いわをわる',f:()=>hitObj(tx,ty)};
  if(tiles[i]===T.WATER&&!o)return p.farm?farmIdle():{l:'こうげき',f:swing};
  if(G.landOf&&inRect(tx,ty,LAND)){
    const L=NET.lands[G.landOf];if(!L)return {l:'…',f:()=>{}};const fp=L.plants[i];
    if(fp){
      if(fp.k!=='tree'&&!fp.w)return {l:'みずやり',f:()=>helpWater(tx,ty)};
      const nm=fp.k==='veg'?ITEMS[fp.id].n:fp.k==='flower'?FCOL[fp.col].n+FLOWERS[fp.id].n:ITEMS[fp.id].n+'の木';
      const rest=fp.k==='veg'?CROPS[fp.id].days-fp.st:fp.k==='flower'?3-fp.st:4-fp.st;
      return {l:'みる',f:()=>toast(L.n+'の '+nm+(rest>0?'（あと '+rest+'日）':'（できあがり！）')+(fp.w?' 💧水やりずみ':''))};
    }
    if(L.weeds[i])return {l:'くさをぬく',f:()=>helpWeed(i,tx,ty)};
    return {l:'…',f:()=>{}};
  }
  const pl=S.plants[i];
  if(pl){
    if(pl.k==='tree'){
      if(pl.st>=4)return {l:'ゆする',f:()=>shakeTree(i,tx,ty)};
      return {l:'そだってる',f:()=>toast(ITEMS[pl.id].n+'の木が そだっているよ。あと '+(4-pl.st)+'日で 大きくなるよ')};
    }
    if(pl.k==='flower'){
      const nm=FCOL[pl.col].n+FLOWERS[pl.id].n;
      if(pl.st>=3&&!pl.w)return {l:'みずやり',f:()=>{water(tx,ty);toast('となりにも おなじ花があると、あたらしい色の花が さくかも！');}};
      if(pl.st>=3)return {l:'つむ',f:()=>{const k='flw_'+pl.id+'_'+pl.col;const wasT=myTut(pl);addItem(k);tutEv('pick',{tut:wasT,key:k});delete S.plants[i];SFX.harvest();floatText(tx*TS+16,ty*TS,FLOWERS[pl.id].ic,'#fff',18);burst(tx*TS+16,ty*TS+16,FCOL[pl.col].c,10);toast(nm+' をつんだ！');}};
      if(!pl.w)return {l:'みずやり',f:()=>water(tx,ty)};
      return {l:'そだってる',f:()=>toast(FLOWERS[pl.id].n+'が そだっているよ。あと '+(3-pl.st)+'日で さくよ')};
    }
    const cr=CROPS[pl.id];
    if(pl.st>=cr.days)return {l:'しゅうかく',f:()=>{const wasTut=myTut(pl);const n=wasTut?3:cr.yld+(Math.random()<0.25?1:0);addItem(pl.id,n);S.st.harv+=n;if(wasTut)setTimeout(()=>toast('まほうの タネだから 3こも とれた！'),300);tutEv('harvest',{tut:wasTut});
      if(cr.regrow){pl.st=cr.days-cr.regrow;}else delete S.plants[i];
      SFX.harvest();floatText(tx*TS+16,ty*TS,cr.ic+'×'+n,'#fff',16);burst(tx*TS+16,ty*TS+16,'#ffe14d',10);sparkle(tx*TS+16,ty*TS+8);gainExp(2);}};
    if(!pl.w)return {l:'みずやり',f:()=>water(tx,ty)};
    return {l:'そだってる',f:()=>toast(ITEMS[pl.id].n+'が そだっているよ。あと '+(cr.days-pl.st)+'日'+(S.rain?'':'（あしたも水をあげてね）'))};
  }
  if(S.weeds[i])return {l:'くさをぬく',f:()=>{delete S.weeds[i];addItem('kusa');useTool('hand',tx,ty);SFX.till();burst(tx*TS+16,ty*TS+18,'#6fb04a',8);floatText(tx*TS+16,ty*TS,'🌾','#fff',15);}};
  if(S.digs[i])return {l:'ほる',f:()=>digUp(i,tx,ty)};
  const sel=curPlantable();
  if(inRect(tx,ty,LAND)&&landFree(tx,ty)){
    if(sel&&isVegSeed(sel)&&!isTilled(i))return {l:'たがやす',f:()=>tillAt(i,tx,ty)};
    if(sel)return {l:'うえる',f:()=>plantAt(sel,i,tx,ty)};
    if(p.farm&&!isTilled(i))return {l:'たがやす',f:()=>tillAt(i,tx,ty)};
  }
  if(p.farm)return farmIdle();
  return {l:'こうげき',f:swing};
}

/* ================= SHARED WORLD (みんなの家と畑 v1.33) ================= */
const WS={synced:false,waitT:0,syncF:{},homeKey:'',snapT:0,diffT:0,lastSnapKey:''};
function farmAuth(){return !(S&&S.online&&NET.ok)||(WS.synced&&amHost());}
const PFIELDS=['k','id','st','w','col','fr','rg','sk','tut','nw'];
function pStr(p){const o={};for(const f of PFIELDS)if(p[f]!==undefined&&p[f]!==false&&p[f]!==0||f==='st'||f==='k'||f==='id')o[f]=p[f];return JSON.stringify(o);}
function farmMap(){const m={};for(const k in S.plants)m['p'+k]=pStr(S.plants[k]);for(const k in S.weeds)m['w'+k]='1';for(const k in (S.soil||{}))m['s'+k]='1';for(const k in S.digs)m['d'+k]='1';return m;}
function homeObj(){return {h:S.house,r:S.roof,w:S.room.wall,f:S.room.floor,it:S.room.items.map(i=>[i.id,i.x,i.y,i.r|0])};}
function applyHome(o){if(!o||typeof o!=='object')return;const oh=S.house,orf=S.roof;
  S.house=clamp(o.h|0,0,HOUSES.length-1);S.roof=(o.r|0);if(WALLS[o.w])S.room.wall=o.w;if(FLOORS[o.f])S.room.floor=o.f;
  if(Array.isArray(o.it))S.room.items=o.it.slice(0,200).filter(a=>Array.isArray(a)&&FURN[a[0]]).map(a=>({id:a[0],x:clamp(a[1]|0,0,20),y:clamp(a[2]|0,0,20),r:(a[3]|0)&3}));
  if(oh!==S.house||orf!==S.roof){BLD[0].cv=makeBuilding(BLD[0]);G.fhc={};}
  if(G.scene==='in'&&!G.visit&&!G.inOwn&&!G.edit)rebuildOcc();
  WS.homeKey=JSON.stringify(homeObj());}
function applyKey(key,val){const c=key[0],i=+key.slice(1);if(!(i>=0&&i<MW*MH))return;
  if(c==='p'){if(val===null){delete S.plants[i];}else{try{const o=JSON.parse(val);if(!o||!['veg','flower','tree'].includes(o.k))return;const old=S.plants[i];S.plants[i]=o;if(old&&old.shake)o.shake=old.shake;}catch(e){return;}}}
  else{const tb=c==='w'?S.weeds:c==='s'?(S.soil=S.soil||{}):c==='d'?S.digs:null;if(!tb)return;if(val===null)delete tb[i];else tb[i]=1;}
  if(val===null)delete WS.syncF[key];else WS.syncF[key]=val;}
function wsSnapObj(){return {i:S.pid,t:Date.now(),fd:S.farmDay,rn:S.rain?1:0,f:farmMap(),home:homeObj()};}
function wsPublishSnap(force){const o=wsSnapObj();const key=JSON.stringify([o.fd,o.rn,o.f,o.home]);if(!force&&key===WS.lastSnapKey)return;WS.lastSnapKey=key;mqPub(NET.rb+'world/state',JSON.stringify(o),true);}
function wsRecvSnap(msg){
  if(!msg)return;let o;try{o=JSON.parse(msg);}catch(e){return;}if(!o||typeof o.f!=='object')return;
  if(o.i===S.pid&&WS.synced)return;
  if(WS.synced&&amHost()&&o.i!==hostPid())return;
  const first=!WS.synced;
  S.plants={};S.weeds={};S.soil={};S.digs={};WS.syncF={};
  for(const k in o.f){applyKey(k,o.f[k]);}
  if(o.fd)S.farmDay=o.fd;S.rain=!!o.rn;applyHome(o.home);
  WS.synced=true;WS.lastSnapKey='';
  if(first&&G.playing){toast('🏡 みんなの 家と はたけに つながったよ');}
}
function wsRecvOp(msg){
  if(!WS.synced)return;let o;try{o=JSON.parse(msg);}catch(e){return;}if(!o||o.i===S.pid)return;
  if(Array.isArray(o.o))o.o.slice(0,400).forEach(a=>{if(Array.isArray(a)&&typeof a[0]==='string')applyKey(a[0],a[1]===null?null:String(a[1]));});
  if(o.h)applyHome(o.h);
  if(o.rn!==undefined)S.rain=!!o.rn;
}
function wsTick(dt){
  if(!S||!NET.ok||!S.online)return;
  if(!WS.synced){WS.waitT-=dt;if(WS.waitT<=0){WS.synced=true;WS.syncF=farmMap();WS.homeKey=JSON.stringify(homeObj());wsPublishSnap(true);}return;}
  WS.diffT-=dt;if(WS.diffT<=0){WS.diffT=0.4;
    const cur=farmMap();const ops=[];for(const k in cur)if(cur[k]!==WS.syncF[k])ops.push([k,cur[k]]);for(const k in WS.syncF)if(!(k in cur))ops.push([k,null]);WS.syncF=cur;
    const hk=JSON.stringify(homeObj());const hc=hk!==WS.homeKey;WS.homeKey=hk;
    for(let a=0;a<ops.length||(a===0&&hc);a+=300){const m={i:S.pid,o:ops.slice(a,a+300)};if(a===0&&hc)m.h=homeObj();mqPub(NET.rb+'wop',JSON.stringify(m));if(!ops.length)break;}}
  if(amHost()){
    const today=jst().key;if(S.farmDay&&S.farmDay<today){const days=Math.max(1,Math.round((Date.parse(today)-Date.parse(S.farmDay))/86400000));for(let k=0;k<Math.min(days,7);k++){S.rain=Math.random()<0.2;farmGrow(S.rain);}S.farmDay=today;mqPub(NET.rb+'wop',JSON.stringify({i:S.pid,o:[],rn:S.rain?1:0}));wsPublishSnap(true);}
    WS.snapT-=dt;if(WS.snapT<=0){WS.snapT=6;wsPublishSnap(false);}
  }
}
/* ----- 空き地と じぶんの家 ----- */
const PLOTS=[{x:97,y:35},{x:103,y:35},{x:97,y:43},{x:103,y:43},{x:113,y:45},{x:119,y:46}];const PLOT_W=5,PLOT_H=4,PLOT_G=3000,PLOT_LV=2;
function plotOwner(n){const o=NET.plots&&NET.plots[n];if(o)return o;if(S&&S.own&&S.own.plot===n)return {o:S.pid,n:S.name,c:S.ch,h:S.own.h,r:S.own.r};return null;}
function plotAtTile(tx,ty){for(let n=0;n<PLOTS.length;n++){const p=PLOTS[n];if(tx>=p.x&&tx<p.x+PLOT_W&&ty>=p.y&&ty<p.y+PLOT_H)return n;}return -1;}
function plotDoor(n){const p=PLOTS[n];return [p.x+2,p.y+PLOT_H-1];}
function plotSolid(tx,ty){const n=plotAtTile(tx,ty);if(n<0)return false;if(plotOwner(n))return true;const [dx,dy]=plotDoor(n);return tx===dx&&ty===dy;}
function plotData(){const o=S.own;return {o:S.pid,n:S.name,c:S.ch,h:o.h,r:o.r==null?-1:o.r,t:o.t||Date.now()};}
function plotRecv(n,msg){if(!(n>=0&&n<PLOTS.length))return;NET.plots=NET.plots||{};
  if(!msg){delete NET.plots[n];return;}let o;try{o=JSON.parse(msg);}catch(e){return;}if(!o||typeof o.o!=='string')return;
  NET.plots[n]={o:o.o.slice(0,24),n:String(o.n||'').slice(0,8),c:o.c,h:clamp(o.h|0,1,HOUSES.length-1),r:o.r|0,t:+o.t||0};G.pcv=null;
  if(S.own&&S.own.plot===n&&o.o!==S.pid&&(+o.t||0)<=(S.own.t||Date.now())){addItem&&0;S.gold+=PLOT_G;const lost=S.own;delete S.own;if(G.inOwn)exitHouse();toast('ざんねん、その あきちは さきに '+NET.plots[n].n+' が たてていたよ（'+PLOT_G+'G もどったよ）');saveGame(true);}}
function plotKeep(){if(!S.own||!NET.ok||!WS.synced)return;const cur=NET.plots&&NET.plots[S.own.plot];const d=plotData();
  if(!cur||cur.o!==S.pid||cur.h!==d.h||cur.r!==d.r||cur.n!==d.n){if(cur&&cur.o!==S.pid)return;mqPub(NET.rb+'plot/'+S.own.plot,JSON.stringify(d),true);NET.plots[S.own.plot]={o:S.pid,n:d.n,c:d.c,h:d.h,r:d.r,t:d.t};G.pcv=null;}}
function plotCv(n){G.pcv=G.pcv||{};const o=plotOwner(n);const key=n+'|'+(o?o.h+'|'+o.r:'');if(!G.pcv[key]){const p=PLOTS[n];G.pcv[key]=makeBuilding({id:'home',x:p.x,y:p.y,w:PLOT_W,h:PLOT_H},o.h,o.r);}return G.pcv[key];}
function openPlot(n){
  const o=plotOwner(n);SFX.open();
  openPanel('🏗️ あきち '+(n+1)+'ばん',()=>{
    let h=`<div class="msg"><span class="who">👷</span><div>ここは 家を たてられる あきち だよ。たてた 家は きみ だけの 家に なって、すきな 家具で かざれるよ。ともだちも あそびに これる！</div></div>`;
    if(o)return h+`<div class="msg">ここには もう ${esc(o.n)} の 家が あるよ。</div>`;
    if(S.own)return h+`<div class="msg">きみは もう ${S.own.plot+1}ばんの あきちに 家を もっているよ（1人 1けん まで）。</div>`;
    if(!(S.online&&NET.ok))return h+`<div class="msg">🌐 オンラインの ときだけ たてられるよ（だれの あきちか サーバーで きめるため）。</div>`;
    h+=`<div class="row"><span class="ic">🏠</span><span class="nm">${HOUSES[PLOT_LV].n}を たてる<small>へや ${HOUSES[PLOT_LV].room[0]}×${HOUSES[PLOT_LV].room[1]}・もっている ${S.gold}G</small></span><span class="pr">${PLOT_G}G</span><button class="sbtn" data-act="buildplot:${n}" ${S.gold<PLOT_G?'disabled':''}>たてる</button></div>`;
    return h;});
}
function buildPlot(n){
  if(plotOwner(n)||S.own||S.gold<PLOT_G||!NET.ok){SFX.bad();return;}
  S.gold-=PLOT_G;S.own={plot:n,h:PLOT_LV,r:-1,t:Date.now(),room:{items:[],wall:'wood',floor:'wood'}};
  NET.plots[n]=plotData();mqPub(NET.rb+'plot/'+n,JSON.stringify(plotData()),true);netHouse(true);G.pcv=null;
  closePanel();SFX.lvl();const p=PLOTS[n];sparkle((p.x+2.5)*TS,(p.y+1)*TS,1.8);banner('🏠 じぶんの 家が たった！');toast('とびらの 前で「いえにはいる」→ もようがえで かざろう');saveGame(true);
}
function enterOwn(){
  if(!S.own)return;G.visit=null;G.inOwn=true;SFX.open();G.shots=[];G.warns=[];G.scene='in';S.inside=false;rebuildOcc();placeAtEntry();
  G.monsters.forEach(m=>{m.state='idle';});banner('🏠 '+S.name+' の '+HOUSES[S.own.h].n);showInHud(true);updateHud(true);netSend(true);
}
function farmIdle(){
  if(!plantables().length)return {l:'タネなし',f:()=>{SFX.bad();toast('うえる タネが ないよ。まちの どうぐやで かえるよ');}};
  return {l:'…',f:()=>toast('ここには うえられないよ。草はらの マスに むかってね')};
}
function isPlantable(k){const c=ITEMS[baseOf(k)]&&ITEMS[baseOf(k)].cat;return c==='seed'||c==='fruit'||c==='flower';}
function plantables(){return Object.keys(S.inv).filter(k=>isPlantable(k)&&avail(k)>0);}
function curPlantable(){if(S.seed&&S.inv[S.seed]&&isPlantable(S.seed))return S.seed;return null;}
function plantAt(key,i,tx,ty){
  const it=ITEMS[baseOf(key)];
  if(isVegSeed(key)&&!isTilled(i)){toast('野菜は たがやした はたけに うえよう');SFX.bad();return;}
  if(it.cat==='fruit'){
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!inMap(tx+dx,ty+dy))continue;const j=idx(tx+dx,ty+dy);if(bldGrid[j]>=0){toast('家や お店の すぐそばには 木を うえられないよ');SFX.bad();return;}}
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){if(!inMap(tx+dx,ty+dy))continue;const j=idx(tx+dx,ty+dy);const o=objs[j];const q=S.plants[j];
      if(o===O.TREE||o===O.BIG||(q&&q.k==='tree')){toast('木と 木は 上下左右に くっつけて うえられないよ（ななめなら OK）');SFX.bad();return;}}
    S.plants[i]={k:'tree',id:key,st:0,fr:0,rg:0,sk:0};
  }else if(it.cat==='flower')S.plants[i]={k:'flower',id:it.sp,col:it.col,st:3,w:false};
  else if(it.flower)S.plants[i]={k:'flower',id:it.flower,col:['red','white','yellow'][irnd(0,2)],st:0,w:S.rain};
  else S.plants[i]={k:'veg',id:it.crop,st:0,w:S.rain};
  addItem(key,-1);useTool(S.plants[i].k==='tree'||it.cat==='flower'?'plant':'seed',tx,ty);SFX.plant();dust(tx,ty,'#8b5a2b');
  {const pn=S.plants[i].k==='veg'?ITEMS[S.plants[i].id].n:S.plants[i].k==='tree'?ITEMS[S.plants[i].id].n+'の木':(FLOWERS[S.plants[i].id]||{n:'花'}).n;
   floatText(tx*TS+16,ty*TS-2,'🌱','#c8ff9a',18);toast('🌱 '+pn+'を うえた！');burst(tx*TS+16,ty*TS+20,'#8fe06a',12);G.tileFx=G.tileFx||[];G.tileFx.push({tx,ty,t:1});
   if(S.plants[i].k==='veg'&&!S.plants[i].w)setTimeout(()=>{if(S&&S.plants[i]&&!S.plants[i].w&&!tutOn())toast('💧 水を あげると あした そだつよ');},900);}
  tutEv('plant',{key,i});
  if(!S.inv[key]){const l=plantables();S.seed=l[0]||null;}
  updateHud(true);
}
function water(tx,ty){
  let n=0;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const p=S.plants[idx(tx+dx,ty+dy)];if(p&&p.k!=='tree'&&!p.w){p.w=true;n++;splash(tx+dx,ty+dy);}}
  useTool('water',tx,ty);SFX.water();
  if(n)floatText(tx*TS+16,ty*TS-2,'💧','#9fe0ff',16);
  tutEv('water');
}
function shakeTree(i,tx,ty){
  const p=S.plants[i];useTool('hand',tx,ty);SFX.chop();p.shake=0.5;

function swing(){
  const p=G.player;p.atkT=0.25;p.tool='sword';p.toolT=p.toolMax=0.32;SFX.swing();
  const [dx,dy]=DIRV[p.dir];const cx=p.x+dx*18,cy=p.y-14+dy*16;
  let hit=false;
  for(const m of G.monsters){
    const d=MOB[m.type];const dist=Math.hypot(m.x-cx,(m.y-8)-cy);
    if(dist<28+d.r){
      hit=true;const crit=Math.random()<0.1;
      let dmg=Math.max(1,Math.round((atk()-d.def*(m.elite?0.65:0.5))*rnd(0.85,1.15)*(crit?1.6:1)));
      const ang=Math.atan2(m.y-p.y,m.x-p.x);burst(m.x,m.y-10,'#fff',5);
      dealDamage(m,dmg,ang,180,{crit});
    }
  }
  if(hit)SFX.hit();
  netAct({k:'s',d:['up','down','left','right'].indexOf(p.dir)});
  G.monsters=G.monsters.filter(m=>m.hp>0);
}
function killMob(m){
  const d=MOB[m.type];m.hp=0;
  const hitters=Object.keys(m.hitters||{});if(!hitters.length)hitters.push(S.pid);
  if(coopActive())mqPub(NET.rb+'kill',JSON.stringify({h:S.pid,id:m.id,ty:m.type,x:Math.round(m.x),y:Math.round(m.y),e:m.elite?1:0,w:hitters}));
  if(d.boss)G.monsters.forEach(o=>{if(o.minion===m.type)o.hp=0;});
  onKill(m.type,m.x,m.y,m.elite,hitters.includes(S.pid));
}
function onKill(type,x,y,elite,mine){
  const d=MOB[type];if(!d)return;

  if(!mine){if(d.boss){banner('🏆 '+d.n+' が たおされた！');}return;}
  SFX.kill();S.st.kill++;tutEv('kill');
  const g=irnd(d.g[0],d.g[1])*(elite?2:1);gainGold(g);floatText(x,y-40,'+'+g+'G','#ffd700');

  updateHud(true);
}

/* ================= INTERIOR ================= */
function footOf(it){const d=FURN[it.id];return (it.r%2)?[d.h,d.w]:[d.w,d.h];}
function rebuildOcc(){
  const [W,H]=roomSize();G.occ=new Int16Array(W*H);
  curHome().items.forEach((it,n)=>{if(FURN[it.id].rug)return;const [fw,fh]=footOf(it);for(let y=it.y;y<it.y+fh;y++)for(let x=it.x;x<it.x+fw;x++)if(x<W&&y<H)G.occ[y*W+x]=n+1;});
}
function doorX(){return Math.floor(roomSize()[0]/2);}
function fitsAt(id,r,tx,ty,ignore,list){
  const [W,H]=roomSize();const d=FURN[id];const fw=(r%2)?d.h:d.w,fh=(r%2)?d.w:d.h;
  if(tx<0||ty<0||tx+fw>W||ty+fh>H)return false;
  const items=list||RM().items;const dx=doorX();
  const ptx=G.scene==='in'&&!list?Math.floor(G.player.x/TS):-9,pty=G.scene==='in'&&!list?Math.floor((G.player.y-4)/TS):-9;
  for(let y=ty;y<ty+fh;y++)for(let x=tx;x<tx+fw;x++){
    if(x===dx&&y===H-1)return false;
    if(!d.rug&&x===ptx&&y===pty)return false;
    for(let n=0;n<items.length;n++){if(n===ignore)continue;const o=items[n];const od=FURN[o.id];if(!!od.rug!==!!d.rug)continue;const [ow,oh]=footOf(o);
      if(x>=o.x&&x<o.x+ow&&y>=o.y&&y<o.y+oh)return false;}
  }
  return true;
}
function itemAt(tx,ty){
  let rug=-1;
  const IT=curHome().items;for(let n=IT.length-1;n>=0;n--){const o=IT[n];const [ow,oh]=footOf(o);if(tx>=o.x&&tx<o.x+ow&&ty>=o.y&&ty<o.y+oh){if(!FURN[o.id].rug)return n;if(rug<0)rug=n;}}
  return rug;
}
function isSolidIn(tx,ty){
  const [W,H]=roomSize();if(ty===H&&tx===doorX())return false;
  if(tx<0||ty<0||tx>=W||ty>=H)return true;
  return G.occ[ty*W+tx]>0;
}

const PIANO=[60,64,67,72,67,64,60];
function findActionIn(){
  const p=G.player,[dx,dy]=DIRV[p.dir];
  const tx=Math.floor((p.x+dx*24)/TS),ty=Math.floor((p.y-8+dy*26)/TS);
  const [W,H]=roomSize();
  if(tx>=0&&ty>=0&&tx<W&&ty<H){
    const n=itemAt(tx,ty);
    if(n>=0){const it=curHome().items[n],d=FURN[it.id];
      if(G.visit&&(d.use==='craft'))return {l:'みる',f:()=>toast(d.ic+' '+d.n+'だ。')};
      if(d.use==='bed')return {l:'ねる',f:openHome};
      if(d.use==='craft')return {l:'DIY',f:openDIY};
      if(d.use==='sit')return {l:'すわる',f:()=>{toast(d.n+'に すわって ひとやすみ…');SFX.plant();}};
      if(d.use==='lamp')return {l:it.on===false?'つける':'けす',f:()=>{it.on=it.on===false;SFX.open();}};
      if(d.use==='piano')return {l:'ひく',f:()=>{PIANO.forEach((m,k)=>tone(mtof(m),0.35,'triangle',0.09,0,k*0.18));floatText(p.x,p.y-60,'♪♫','#fff',18);}};
      if(d.use==='clock')return {l:'みる',f:()=>{toast('いまは '+Math.floor(S.time/60)%24+'じ '+Math.floor(S.time%60)+'ふん だよ');}};
      if(d.use==='teddy')return {l:'だっこ',f:()=>{tone(880,.1,'sine',.1);tone(660,.15,'sine',.1,0,.1);floatText(p.x,p.y-60,'💕','#fff',18);}};
      if(!d.rug)return {l:'みる',f:()=>toast(d.ic+' '+d.n+'だ。')};
    }
  }
  if(G.visit)return {l:'…',f:()=>{}};
  return {l:'もようがえ',f:startEdit};
}

function renderEditBar(){
  const e=G.edit;if(!e)return;

  $('eList').innerHTML=keys.length?keys.map(k=>`<button class="ei ${e.hold===k?'on':''}" data-f="${k}"><span>${FURN[k].ic}</span>${FURN[k].n}<br>×${S.inv[k]}</button>`).join(''):'<div style="font-size:13px;padding:8px">しまってある家具はないよ。さぎょうだいで つくるか、かぐやで かってね。</div>';

}
function editTap(cx,cy){
  const e=G.edit;const wx=G.icam.x+cx/G.izoom,wy=G.icam.y+cy/G.izoom;
  const tx=Math.floor(wx/TS),ty=Math.floor(wy/TS);const [W,H]=roomSize();
  if(e.hold){
    const d=FURN[e.hold];const fw=(e.rot%2)?d.h:d.w,fh=(e.rot%2)?d.w:d.h;
    const px=clamp(tx,0,W-fw),py=clamp(ty,0,H-fh);
    if(!PCK&&!(e.hover&&clamp(e.hover[0],0,W-fw)===px&&clamp(e.hover[1],0,H-fh)===py)){e.hover=[px,py];SFX.open();renderEditBar();return;}
    if(fitsAt(e.hold,e.rot,px,py,-1)){RM().items.push({id:e.hold,x:px,y:py,r:e.rot});const pid=e.hold;addItem(e.hold,-1);SFX.plant();rebuildOcc();tutEv('place',{id:pid});
      if(!S.inv[e.hold])e.hold=null;}
    else{SFX.bad();toast('そこには おけないよ');}
    renderEditBar();return;
  }
  if(tx<0||ty<0||tx>=W||ty>=H){e.sel=-1;renderEditBar();return;}
  const n=itemAt(tx,ty);
  if(e.sel>=0&&n!==e.sel){
    const it=RM().items[e.sel];const [fw,fh]=footOf(it);const px=clamp(tx,0,W-fw),py=clamp(ty,0,H-fh);
    if(n<0||FURN[RM().items[n].id].rug!==FURN[it.id].rug){
      if(fitsAt(it.id,it.r,px,py,e.sel)){it.x=px;it.y=py;SFX.plant();rebuildOcc();}else{SFX.bad();toast('そこには うごかせないよ');}
      renderEditBar();return;
    }
  }
  e.sel=(n===e.sel)?-1:n;if(n>=0)SFX.open();renderEditBar();
}
function editCmd(c){
  const e=G.edit;if(!e)return;
  if(c==='done'){endEdit();return;}
  if(c==='wall'||c==='floor'){openWF(c);return;}
  if(c==='rot'){
    if(e.hold){e.rot=(e.rot+1)%4;}
    else if(e.sel>=0){const it=RM().items[e.sel];const nr=(it.r+1)%4;if(fitsAt(it.id,nr,it.x,it.y,e.sel)){it.r=nr;rebuildOcc();}else{SFX.bad();toast('ここでは まわせないよ');}}
    SFX.open();
  }
  if(c==='store'&&e.sel>=0){const it=RM().items.splice(e.sel,1)[0];addItem(it.id);e.sel=-1;rebuildOcc();SFX.open();}
  renderEditBar();
}

/* drawing */
function shade(hex,f){let h=hex.replace('#','');if(h.length===3)h=h.split('').map(x=>x+x).join('');const n=parseInt(h,16);const r=Math.round(((n>>16)&255)*f),g=Math.round(((n>>8)&255)*f),b=Math.round((n&255)*f);return 'rgb('+Math.min(255,r)+','+Math.min(255,g)+','+Math.min(255,b)+')';}
function box(c,x,y,w,d,h,top,front){c.fillStyle=front;c.fillRect(x,y+d-h,w,h);c.fillStyle=top;c.fillRect(x,y-h,w,d);c.strokeStyle='rgba(0,0,0,.28)';c.lineWidth=1;c.strokeRect(x+.5,y-h+.5,w-1,d+h-1);}
function drawFurn(c,id,r,X,Y,fw,fh,on){
  const d=FURN[id],c0=d.c[0],c1=d.c[1],W=fw*TS,D=fh*TS,t=G.t;
  c.fillStyle='rgba(0,0,0,.16)';if(!d.rug){c.fillRect(X+3,Y+D-8,W-6,7);}
  switch(d.k){
  case 'bed':{
    box(c,X+3,Y+6,W-6,D-8,10,shade(c0,1.1),c0);
    const mx=X+6,my=Y-2,mw=W-12,mh=D-12;c.fillStyle=c1;rr(c,mx,my,mw,mh,4);
    c.fillStyle=d.c[2];
    if(r===0){rr(c,mx,my+mh*0.38,mw,mh*0.62,4);c.fillStyle='#fff';rr(c,mx+4,my+3,mw-8,10,4);}

function netProbe(base,opts,cb){

  const to=setTimeout(()=>fin(false),4000);
  try{ws=new WebSocket(NET.BROKERS[NET.bi%NET.BROKERS.length],['mqtt']);}catch(e){fin(false);return;}
  ws.binaryType='arraybuffer';
  ws.onopen=()=>{ws.send(mqPkt(0x10,[new Uint8Array([0,4,77,81,84,84,4,2,0,30]),mqStr('fwq_'+Math.random().toString(36).slice(2,10))]));};

    buf=mqSplit(nb,(h,body)=>{const t=h>>4;

        if(opts&&opts.clear){[].concat(opts.clear).forEach(t=>ws.send(mqPkt(0x31,[mqStr(t),new Uint8Array(0)])));setTimeout(()=>fin(true),500);return;}
        if(opts&&opts.topics){ws.send(mqSubPkt(opts.topics));setTimeout(()=>fin(true),opts.ms||1800);return;}

const CHAT={log:[],unread:0,lastSend:0,rate:{}};

function chatClean(t){

  if(/(https?:|www\.|\.com|\.jp|\.net|@|＠|line\s*id|ライン\s*ID)/i.test(t))return '（このメッセージは おくれません）';
  if(/\d[\d\-\s]{5,}\d/.test(t))return '（このメッセージは おくれません）';
  NG_WORDS.forEach(w=>{t=t.split(w).join('＊'.repeat(w.length));});
  return t;
}

function sha256(ascii){
  function rr(v,a){return (v>>>a)|(v<<(32-a));}
  const maxWord=Math.pow(2,32);let result='';const words=[];const bitLen=ascii.length*8;
  const hash=[],k=[];let pc=0;const comp={};
  for(let c=2;pc<64;c++){if(!comp[c]){for(let i=0;i<313;i+=c)comp[i]=c;hash[pc]=(Math.pow(c,.5)*maxWord)|0;k[pc++]=(Math.pow(c,1/3)*maxWord)|0;}}
  ascii+='\x80';while(ascii.length%64-56)ascii+='\x00';
  for(let i=0;i<ascii.length;i++){const j=ascii.charCodeAt(i);if(j>>8)return '';words[i>>2]|=j<<((3-i)%4)*8;}
  words[words.length]=((bitLen/maxWord)|0);words[words.length]=bitLen;
  for(let j=0;j<words.length;){const w=words.slice(j,j+=16);const old=hash.slice(0,8);let h=hash.slice(0,8);
    for(let i=0;i<64;i++){const w15=w[i-15],w2=w[i-2];const a=h[0],e=h[4];
      const t1=h[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&h[5])^((~e)&h[6]))+k[i]+(w[i]=(i<16)?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
      const t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&h[1])^(a&h[2])^(h[1]&h[2]));
      h.unshift((t1+t2)|0);h[4]=(h[4]+t1)|0;}
    for(let i=0;i<8;i++)hash[i]=(h[i]+old[i])|0;}
  for(let i=0;i<8;i++)for(let j=3;j+1;j--){const b=(hash[i]>>(j*8))&255;result+=((b<16)?0:'')+b.toString(16);}
  return result;}

const b64e=u8=>{let s='';for(let i=0;i<u8.length;i+=8192)s+=String.fromCharCode.apply(null,u8.subarray(i,i+8192));return btoa(s);};

        if(n<0)for(let i=0;i<3;i++){if(!loadSlot(i)){n=i;break;}}

    });

}

function aimTarget(range){
  const p=G.player;let best=null,bd=1e9;
  for(const m of G.monsters){const dd=Math.hypot(m.x-p.x,m.y-p.y);if(dd<range&&dd<bd){bd=dd;best=m;}}
  return best;
}
function curSpell(){const kn=knownSpells();if(!kn.length)return null;S.spell=clamp(S.spell|0,0,kn.length-1);return kn[S.spell];}
function cycleSpell(){const kn=knownSpells();S.spell=((S.spell|0)+1)%kn.length;SFX.open();const sp=curSpell();toast(sp.ic+' '+sp.n+'（MP'+sp.mp+'）：'+sp.d);updateHud(true);}
function castSpell(){
  if(!G.playing||G.paused||G.dead)return;
  const p=G.player;const sp=curSpell();if(!sp)return;
  if(G.scene==='in'&&sp.id!=='heal'){toast('家の中では まほうは つかえないよ');return;}
  if(p.mcd>0)return;
  if(S.mp<sp.mp){toast('MPが たりないよ（'+sp.n+'は MP'+sp.mp+'）');SFX.bad();return;}
  S.mp-=sp.mp;p.mcd=sp.cd;p.atkT=0.25;
  const tgt=aimTarget(300);const [fx,fy]=DIRV[p.dir];
  const ang=tgt?Math.atan2((tgt.y-10)-(p.y-24),tgt.x-p.x):Math.atan2(fy,fx);
  if(tgt)faceTo(tgt.x,tgt.y);
  const sx=p.x,sy=p.y-24;
  burst(sx,sy,{fire:'#ff9a2a',heal:'#7fe07f',ice:'#9fe0ff',thunder:'#fff36b',wind:'#d8f0ff',meteor:'#ff6a2a'}[sp.id],8);
  switch(sp.id){
  case 'fire':G.pshots.push({x:sx,y:sy,vx:Math.cos(ang)*330,vy:Math.sin(ang)*330,life:1.1,r:9,col:'#ff8a1a',dmg:1.6,hit:[]});tone(300,.18,'sawtooth',.06,400);noise(.15,.1,1500);break;
  case 'heal':{const h=Math.round(20+mag()*2);const got=Math.min(h,maxHp()-S.hp);S.hp+=got;floatText(p.x,p.y-60,'+'+got,'#6f6',18);
    for(let i=0;i<14;i++)G.parts.push({x:p.x+rnd(-14,14),y:p.y-rnd(0,40),vx:0,vy:-rnd(30,70),life:rnd(.5,1),col:'#9ff59f',sz:3,g:-20});[523,659,784].forEach((f,i)=>tone(f,.2,'sine',.08,0,i*.08));break;}
  case 'ice':for(let i=-1;i<=1;i++)G.pshots.push({x:sx,y:sy,vx:Math.cos(ang+i*0.22)*300,vy:Math.sin(ang+i*0.22)*300,life:0.9,r:7,col:'#9fe0ff',dmg:1.0,slow:1,hit:[]});tone(1400,.15,'triangle',.06,-600);break;
  case 'thunder':{const list=G.monsters.filter(m=>Math.hypot(m.x-p.x,m.y-p.y)<220).sort((a,b)=>Math.hypot(a.x-p.x,a.y-p.y)-Math.hypot(b.x-p.x,b.y-p.y)).slice(0,4);
    if(!list.length){G.fx.push({k:'bolt',x:p.x+fx*80,y:p.y+fy*60,t:0.35});}
    list.forEach(m=>{G.fx.push({k:'bolt',x:m.x,y:m.y-10,t:0.35});hitMob(m,magDmg(m,2.2),0,0,'#fff36b');});
    noise(.4,.3,3000);tone(90,.3,'square',.08,-40);break;}
  case 'wind':G.fx.push({k:'ring',x:p.x,y:p.y-10,t:0.5,max:0.5});
    G.monsters.forEach(m=>{const dd=Math.hypot(m.x-p.x,m.y-p.y);if(dd<100){const a=Math.atan2(m.y-p.y,m.x-p.x);hitMob(m,magDmg(m,0.9),a,420,'#d8f0ff');}});noise(.5,.2,700);break;
  case 'meteor':{const tx=tgt?tgt.x:p.x+fx*110,ty=tgt?tgt.y:p.y+fy*90;G.fx.push({k:'meteor',x:tx,y:ty,t:0.8,max:0.8,done:0});G.warns.push({x:tx,y:ty,r:105,t:0.8,max:0.8,dmg:0,col:'255,150,40',mine:1});tone(200,.8,'sawtooth',.05,-150);break;}
  }
  netAct({k:'m',sp:sp.id,a:+ang.toFixed(2),tx:Math.round(tgt?tgt.x:p.x+fx*110),ty:Math.round(tgt?tgt.y:p.y+fy*90)});
  G.monsters=G.monsters.filter(m=>m.hp>0);updateHud(true);
}
function updateMagic(dt){
  for(const s of G.pshots){
    s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;
    if(s.cos){if(Math.random()<0.5)G.parts.push({x:s.x,y:s.y,vx:0,vy:0,life:.25,col:s.col,sz:3,g:0});continue;}
    if(Math.random()<0.6)G.parts.push({x:s.x,y:s.y,vx:rnd(-15,15),vy:rnd(-15,15),life:.3,col:s.col,sz:3,g:0});
    if(isSolid(Math.floor(s.x/TS),Math.floor((s.y+16)/TS))){s.life=0;burst(s.x,s.y,s.col,6);continue;}
    for(const m of G.monsters){if(m.hp<=0||s.hit.includes(m))continue;const d=MOB[m.type];
      if(Math.hypot(m.x-s.x,(m.y-10)-s.y)<s.r+d.r){hitMob(m,magDmg(m,s.dmg),Math.atan2(s.vy,s.vx),120,s.col,s.slow);s.hit.push(m);burst(s.x,s.y,s.col,8);s.life=0;break;}}
  }
  G.pshots=G.pshots.filter(s=>s.life>0);
  for(const f of G.fx){f.t-=dt;
    if(f.k==='meteor'&&!f.done&&f.t<=0&&f.cos){f.done=1;burst(f.x,f.y,'#ff9a2a',30);noise(.4,.2,500);}
    if(f.k==='meteor'&&!f.done&&f.t<=0){f.done=1;burst(f.x,f.y,'#ff9a2a',30);burst(f.x,f.y,'#ffd23f',20);noise(.6,.35,500);
      G.monsters.forEach(m=>{if(Math.hypot(m.x-f.x,m.y-f.y)<110)hitMob(m,magDmg(m,4),Math.atan2(m.y-f.y,m.x-f.x),200,'#ffb04a');});}}
  G.fx=G.fx.filter(f=>f.t>-0.3);
  G.monsters=G.monsters.filter(m=>m.hp>0);
}
function drawMagic(c){

    else if(f.k==='meteor'){if(f.t>0){const pr=1-f.t/f.max;const mx=f.x+(1-pr)*120,my=f.y-(1-pr)*300;
        c.fillStyle='rgba(255,140,40,.35)';c.beginPath();c.arc(mx+10,my-14,26,0,7);c.fill();c.fillStyle='#7a4a2a';c.beginPath();c.arc(mx,my,16,0,7);c.fill();c.fillStyle='#ffb04a';c.beginPath();c.arc(mx-4,my-4,7,0,7);c.fill();}
      else{const a=Math.max(0,1+f.t/0.3);c.fillStyle='rgba(255,170,60,'+a*0.5+')';c.beginPath();c.ellipse(f.x,f.y,110,80,0,0,7);c.fill();}}
  }
}

/* ================= CO-OP: shared monsters ================= */
const MOBK=Object.keys(MOB),ZONEK=Object.keys(ZONES);
let MOBSEQ=0;
function mobId(){return (S&&S.pid?S.pid.slice(0,5):'x')+'.'+(++MOBSEQ).toString(36);}
function coopActive(){return !!(S&&S.online&&NET.ok&&Object.keys(NET.others).length);}
function hostPid(){
  if(!NET.ok)return S.pid;
  let bp=S.pid,bs=NET.st||0;
  for(const k in NET.others){const st=NET.others[k].st||9e15;if(st<bs||(st===bs&&k<bp)){bp=k;bs=st;}}
  return bp;
}
function amHost(){return !coopActive()||hostPid()===S.pid;}
function buildPlist(){
  const L=[];if(G.scene==='out'&&!G.dead)L.push({x:G.player.x,y:G.player.y,me:1});
  if(coopActive())for(const k in NET.others){const o=NET.others[k];if(!o.inside)L.push({x:o.x,y:o.y,pid:k});}
  G.plist=L;
}
function nearestTo(x,y,maxD,rect){let b=null,bd=maxD||1e9;for(const q of G.plist||[]){if(rect&&!inRect(Math.floor(q.x/TS),Math.floor(q.y/TS),rect))continue;const d=Math.hypot(q.x-x,q.y-y);if(d<bd){bd=d;b=q;}}return b;}
function dealDamage(m,dmg,ang,kb,o){
  o=o||{};const d=MOB[m.type];dmg=Math.max(1,Math.round(dmg));
  m.flash=0.15;m.hpShow=3;floatText(m.x,m.y-30-d.r,(o.crit?'!':'')+dmg,o.col||(o.crit?'#ffe14d':'#fff'),o.crit?18:15);
  if(amHost())applyHit(m,dmg,ang,kb,o.slow,S.pid);
  else{m.hp=Math.max(1,m.hp-dmg);if(o.slow)m.slow=3;if(m.id)mqPub(NET.rb+'hit',JSON.stringify({i:S.pid,id:m.id,d:dmg,a:+(ang||0).toFixed(2),k:kb|0,s:o.slow?1:0}));}
}
function applyHit(m,dmg,ang,kb,slow,from){
  if(m.hp<=0)return;const d=MOB[m.type];
  m.hp-=dmg;m.state='chase';m.hitters=m.hitters||{};m.hitters[from]=1;
  if(kb&&!(d.boss&&m.act)){const k=d.boss?Math.min(kb,40):kb;m.kbx=Math.cos(ang)*k;m.kby=Math.sin(ang)*k;}
  if(slow)m.slow=3;
  if(m.hp<=0)killMob(m);
}
/* host simulation (monsters, bosses, spawning) */
function worldSim(dt){
  const P=G.plist;
  for(const m of G.monsters){
    const d=MOB[m.type];m.t+=dt;m.flash=Math.max(0,m.flash-dt);m.cd=Math.max(0,(m.cd||0)-dt);m.hpShow=Math.max(0,m.hpShow-dt);
    if(d.boss){updateBoss(m,dt);continue;}
    const z=ZONES[m.zone]||ZONES.forest;
    const tp=nearestTo(m.x,m.y,1e9,{x:z.x-1,y:z.y-1,w:z.w+2,h:z.h+2});
    const dist=tp?Math.hypot(tp.x-m.x,tp.y-m.y):1e9;
    if(m.kbx||m.kby){moveEnt(m,m.kbx*dt,m.kby*dt,d.r*0.6);m.kbx*=Math.pow(0.002,dt);m.kby*=Math.pow(0.002,dt);if(Math.abs(m.kbx)<5){m.kbx=m.kby=0;}}
    if(tp&&dist<d.aggro){m.state='chase';}
    else if(m.state==='chase'&&(!tp||dist>d.aggro*1.8))m.state='idle';
    let vx=0,vy=0;
    if(m.state==='chase'&&tp){vx=(tp.x-m.x)/dist;vy=(tp.y-m.y)/dist;}
    else{m.timer-=dt;if(m.timer<=0){m.timer=rnd(1.5,4);m.tx=m.x+rnd(-80,80);m.ty=m.y+rnd(-80,80);}
      const dd=Math.hypot(m.tx-m.x,m.ty-m.y);if(dd>6){vx=(m.tx-m.x)/dd*0.5;vy=(m.ty-m.y)/dd*0.5;}}
    let spd=d.spd;if(d.base==='slime'||m.type==='slime'){spd*=Math.max(0,Math.sin(m.t*5))*1.8;}
    if(m.slow>0){m.slow-=dt;spd*=0.4;}
    if(vx||vy){const nx=m.x+vx*spd*dt,ny=m.y+vy*spd*dt;const ntx=Math.floor(nx/TS),nty=Math.floor(ny/TS);
      if(inRect(ntx,nty,z)){moveEnt(m,vx*spd*dt,vy*spd*dt,d.r*0.6);}else{m.tx=m.x;m.ty=m.y;}
      if(Math.abs(vx)>0.1)m.dir=vx>0?1:-1;}
  }
  G.monsters=G.monsters.filter(m=>m.hp>0);
  G.spawnT-=dt;
  if(G.spawnT<=0){G.spawnT=4;for(const zk2 in ZONES){const c=G.monsters.filter(m=>m.zone===zk2&&!MOB[m.type].boss&&!m.minion).length;if(c<ZONES[zk2].max)trySpawn(zk2);}
    BOSSES.forEach(b=>{if((S.bossDay[b.id]===undefined||S.day>S.bossDay[b.id])&&!(G.plist||[]).some(q=>Math.hypot(q.x-b.x*TS,q.y-b.y*TS)<TS*12))spawnBoss(b);});}
}
/* client: smooth replicated monsters */
function clientSim(dt){
  for(const m of G.monsters){m.t+=dt;m.flash=Math.max(0,m.flash-dt);m.cd=Math.max(0,(m.cd||0)-dt);m.hpShow=Math.max(0,m.hpShow-dt);
    if(m.rx!==undefined){const f=Math.min(1,dt*10);const ox=m.x;m.x+=(m.rx-m.x)*f;m.y+=(m.ry-m.y)*f;}}
}
function contactDamage(){
  G.bossNear=null;if(G.dead||G.scene!=='out')return;
  const p=G.player;let bd=1e9;
  for(const m of G.monsters){if(m.hp<=0)continue;const d=MOB[m.type];const dist=Math.hypot(p.x-m.x,p.y-m.y);
    if(d.boss&&m.state==='chase'&&dist<TS*12&&dist<bd){bd=dist;G.bossNear=m;}
    if(dist<d.r+12&&(m.cc||0)<=0&&p.inv<=0&&(m.jumpH||0)<10){m.cc=1.0;hurtPlayer(d.atk*(m.mul||1)*(m.act&&m.act.k==='dash'?1.4:1),m.x,m.y);}
  }
}
function coopTick(dt){
  // host role changes
  const h=amHost();
  if(G.wasHost!==undefined&&h!==G.wasHost){
    if(h){G.monsters.forEach(m=>{m.timer=m.timer||0;m.tx=m.x;m.ty=m.y;m.kbx=m.kby=0;m.cd=0;m.state=m.state||'idle';m.hitters=m.hitters||{};delete m.rx;delete m.ry;
        if(MOB[m.type].boss){if(!m.home){const B=BOSSES.find(b=>b.id===m.type);m.home=B?{x:B.x*TS+16,y:B.y*TS+24}:{x:m.x,y:m.y};}m.act=null;m.skillT=2;m.jumpH=0;}});
      if(coopActive())chatAdd({sys:1,t:'🛡️ あなたが この せかいの まものを うごかす 役（ホスト）に なりました'});}
    else{G.monsters=[];G.shots=[];G.warns=[];}
  }
  G.wasHost=h;
  for(const m of G.monsters)m.cc=Math.max(0,(m.cc||0)-dt);
}
function netMobs(dt){
  if(!coopActive()||!amHost())return;
  if(G.fxOut&&(G.fxOut.s.length||G.fxOut.w.length)){mqPub(NET.rb+'fx',JSON.stringify({h:S.pid,s:G.fxOut.s,w:G.fxOut.w}));G.fxOut={s:[],w:[]};}
  NET.mobT=(NET.mobT||0)-dt;if(NET.mobT>0)return;NET.mobT=0.22;
  const PL=(G.plist&&G.plist.length?G.plist:[G.player]),FAR=TS*28;
  const arr=G.monsters.filter(m=>m.hp>0&&PL.some(q=>Math.abs(q.x-m.x)<FAR&&Math.abs(q.y-m.y)<FAR)).map(m=>[m.id,MOBK.indexOf(m.type),Math.round(m.x),Math.round(m.y),Math.round(m.hp),m.maxHp,m.dir,(m.elite?1:0)|(m.slow>0?2:0)|(m.state==='chase'?4:0)|(m.act&&m.act.k==='dashprep'?8:0)|(m.act&&m.act.k==='dash'?16:0),Math.round(m.jumpH||0),ZONEK.indexOf(m.zone),m.minion?MOBK.indexOf(m.minion):-1]);
  mqPub(NET.rb+'mobs',JSON.stringify({h:S.pid,m:arr}));
}
function mobsRecv(msg){
  let o;try{o=JSON.parse(msg);}catch(e){return;}
  if(!o||!Array.isArray(o.m)||o.h===S.pid||amHost()||o.h!==hostPid())return;
  const map={};G.monsters.forEach(m=>{if(m.id)map[m.id]=m;});
  const out=[];
  for(const a of o.m){
    const [id,ti,x,y,hp,mh,dir,fl,jh,zi,mi]=a;const type=MOBK[ti];if(!type||hp<=0)continue;
    let m=map[id];if(!m){m={id,type,x,y,t:rnd(0,10),flash:0,hpShow:0,cd:0,cc:0,kbx:0,kby:0,timer:0,tx:x,ty:y};}
    m.rx=x;m.ry=y;m.hp=hp;m.maxHp=mh;m.dir=dir;m.elite=!!(fl&1);m.mul=m.elite?1.7:1;m.slow=(fl&2)?0.3:0;m.state=(fl&4)?'chase':'idle';
    m.jumpH=jh;m.zone=ZONEK[zi]||'forest';m.minion=mi>=0?MOBK[mi]:null;
    m.act=(fl&8)?{k:'dashprep',t:0.1,tx:m.x,ty:m.y}:(fl&16)?{k:'dash',t:0.1}:null;
    if(MOB[type].boss&&!m.home){const B=BOSSES.find(b=>b.id===type);m.home=B?{x:B.x*TS+16,y:B.y*TS+24}:{x,y};}
    out.push(m);
  }
  G.monsters=out;
}
function hitRecv(msg){
  if(!amHost())return;let o;try{o=JSON.parse(msg);}catch(e){return;}
  if(!o||!o.id||!o.i||o.i===S.pid)return;
  const m=G.monsters.find(x=>x.id===o.id);if(!m)return;
  const dmg=clamp(+o.d||0,0,99999);if(!dmg)return;
  m.flash=0.15;m.hpShow=3;applyHit(m,dmg,+o.a||0,clamp(+o.k||0,0,500),!!o.s,o.i);
  G.monsters=G.monsters.filter(x=>x.hp>0);
}
function killRecv(msg){
  let o;try{o=JSON.parse(msg);}catch(e){return;}

function fxRecv(msg){

  }

function update(dt){
  G.t+=dt;
  const p=G.player;
  // time
  syncTime();
  G.dateT=(G.dateT||0)+dt;if(G.dateT>5){G.dateT=0;checkDate();}
  if(!G.dead){
    const calm=performance.now()-(G.lastHit||0)>4000;const inside=G.scene==='in';
    if(S.hp<maxHp()&&(calm||inside)){G.regen=(G.regen||0)+dt;const iv=inside?0.4:1.2;while(G.regen>iv){G.regen-=iv;S.hp=Math.min(maxHp(),S.hp+1);}}
    if(S.mp<maxMp()){G.mregen=(G.mregen||0)+dt;const iv=inside?0.3:1.0;while(G.mregen>iv){G.mregen-=iv;S.mp=Math.min(maxMp(),S.mp+1);}}
    G.player.mcd=Math.max(0,(G.player.mcd||0)-dt);
  }
  // input
  let mx=0,my=0;
  const k=G.keys;
  if(k.ArrowLeft||k.a||k.A)mx-=1;if(k.ArrowRight||k.d||k.D)mx+=1;if(k.ArrowUp||k.w||k.W)my-=1;if(k.ArrowDown||k.s||k.S)my+=1;
  if(joy.id!==null){mx=joy.dx;my=joy.dy;}
  const len=Math.hypot(mx,my);
  if(len>0.15&&!G.dead&&!G.edit){
    if(len>1){mx/=len;my/=len;}
    if(G.pslow>0)G.pslow-=dt;const sp=G.pslow>0?75:120;moveEnt(p,mx*sp*dt,my*sp*dt,8);
    if(p.atkT<=0)p.dir=Math.abs(mx)>Math.abs(my)?(mx>0?'right':'left'):(my>0?'down':'up');
    p.moving=true;p.anim+=dt;
  }else p.moving=false;
  if(p.kbx||p.kby){moveEnt(p,p.kbx*dt,p.kby*dt,8);p.kbx*=Math.pow(0.001,dt);p.kby*=Math.pow(0.001,dt);if(Math.abs(p.kbx)<5&&Math.abs(p.kby)<5){p.kbx=p.kby=0;}}
  p.cd=Math.max(0,p.cd-dt);p.atkT=Math.max(0,p.atkT-dt);p.toolT=Math.max(0,p.toolT-dt);p.inv=Math.max(0,p.inv-dt);
  if(G.held){G.heldT-=dt;if(G.heldT<=0){doAction();G.heldT=0.34;}}
  if(G.scene==='in'){
    const [,RH]=roomSize();
    if(p.y>RH*TS+14)exitHouse();
    for(const q of G.parts){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=q.g*dt;q.life-=dt;}
    G.parts=G.parts.filter(q=>q.life>0);
    for(const f of G.floats){f.y-=30*dt;f.life-=dt;}
    G.floats=G.floats.filter(f=>f.life>0);
    G.saveT+=dt;if(G.saveT>20){G.saveT=0;saveGame(true);}
    $('bossBar').classList.add('hidden');
    if(coopActive()){buildPlist();coopTick(dt);if(amHost())worldSim(dt);else clientSim(dt);}
    const ai=G.edit?{l:''}:findActionIn();if(ai.l!==G.actLabel){G.actLabel=ai.l;setActLabel(ai.l);}
    return;
  }
  // regen in safe area (slow)
  const ptx=Math.floor(p.x/TS),pty=Math.floor(p.y/TS);
  const zk=zoneAt(ptx,pty);
  // monsters
  buildPlist();coopTick(dt);
  if(amHost())worldSim(dt);else clientSim(dt);
  contactDamage();
  updateShots(dt);
  updateMagic(dt);
  updateBossBar();
  // object respawn
  for(let i=G.respawn.length-1;i>=0;i--){const r=G.respawn[i];if(G.t>=r.t){const x=r.i%MW,y=Math.floor(r.i/MW);
    if(Math.hypot(x*TS+16-p.x,y*TS+16-p.y)>TS*3&&!objs[r.i]){objs[r.i]=r.o;G.respawn.splice(i,1);}else r.t=G.t+10;}}
  // npcs
  for(const n of G.npcs){n.timer-=dt;if(n.timer<=0){n.timer=rnd(2,5);if(Math.random()<0.5){n.tx=0;n.moving=false;}else{n.tx=clamp(n.x+rnd(-100,100),58*TS,85*TS);n.ty=clamp(n.y+rnd(-80,80),29*TS,37*TS);n.moving=true;}}
    if(n.moving&&n.tx){const dx=n.tx-n.x,dy=n.ty-n.y,dd=Math.hypot(dx,dy);if(dd<4)n.moving=false;else{const ox=n.x,oy=n.y;moveEnt(n,dx/dd*40*dt,dy/dd*40*dt,7);if(ox===n.x&&oy===n.y)n.moving=false;n.dir=Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up');n.t+=dt;}}}
  for(const k in S.plants){const pl=S.plants[k];if(pl.shake)pl.shake=Math.max(0,pl.shake-dt);}
  // smith smoke
  if(Math.random()<dt*4){const b=BLD[3];G.parts.push({x:(b.x+b.w)*TS-31,y:(b.y-1)*TS,vx:rnd(-5,5),vy:-25,life:2,col:'rgba(180,180,180,.5)',sz:rnd(4,7),g:-5,smoke:1});}
  // effects
  for(const q of G.parts){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=q.g*dt;q.life-=dt;}
  G.parts=G.parts.filter(q=>q.life>0);
  for(const f of G.floats){f.y-=30*dt;f.life-=dt;}
  G.floats=G.floats.filter(f=>f.life>0);
  // zone banner
  if(G.landOf&&!inRect(ptx,pty,LAND)){const L=NET.lands[G.landOf];G.landOf=null;toast((L?L.n+' の 土地':'ともだちの 土地')+'から でたよ');netSend(true);}
  G.zoneT-=dt;if(G.zoneT<=0){G.zoneT=0.5;const lair=nearLair(ptx,pty,5);const zn=G.landOf&&NET.lands[G.landOf]?'🌱 '+NET.lands[G.landOf].n+' の 土地':lair&&G.monsters.some(m=>m.type===lair.id)?'⚠️ '+MOB[lair.id].n+' のすみか（おすすめLv'+MOB[lair.id].lv+'）':zk?ZONES[zk].name:inRect(ptx,pty,TOWN)?'まち':inRect(ptx,pty,LAND)?'じぶんの土地':areaAt(ptx,pty);if(zn&&zn!==G.curZone)banner(zn);G.curZone=zn;}
  // autosave
  G.saveT+=dt;if(G.saveT>20){G.saveT=0;saveGame(true);}
  // action label
  {const fm=inRect(ptx,pty,LAND)&&!nearestMob(TS*4);const pl=G.player;
   if(fm!==!!pl.farm){pl.farm=fm;$('actBtn').classList.toggle('farmB',fm);const now=performance.now();if(now-(G.modeT||0)>2500){G.modeT=now;toast(fm?'🌾 のうさぎょうモード（けんは しまったよ）':'⚔️ けんしモード');}}}
  const a=findAction();if(a.l!==G.actLabel){G.actLabel=a.l;setActLabel(a.l);}
  G.player.hold={'みずやり':'water','うえる':(()=>{const k=curPlantable();const it=k&&ITEMS[baseOf(k)];return it&&(it.cat==='fruit'||it.cat==='flower')?'plant':'seed';})(),'しゅうかく':'harvest','くさをぬく':'harvest','つむ':'harvest','ゆする':'harvest','ほる':'hoe','たがやす':'hoe','きをきる':'axe','いわをわる':'hoe'}[a.l]||G.player.hold||'hoe';
}

const TUT_HOME=['chair','doorflower','fwater','fgrow','fpick','vase','placevase'];
const TUT_BASE=['plant','water','grow','harvest'];
const TUT_PATHS={chair:['sell','buyfurn','place','kill','quest'],flower:['flower','sell','buyfurn','place','kill','quest'],forest:['kill','sell','buyfurn','place','quest']};
const TUT_OLD=['plant','water','grow','harvest','sell','buyfurn','place','kill','quest'];
const TUT_ALL=TUT_OLD.concat(['flower'],TUT_HOME);
function tutCur(){return S&&Array.isArray(S.tutQ)&&S.tutQ.length?S.tutQ[0]:null;}
function tutOn(){return !!tutCur();}
function tutStart(){S.tutQ=TUT_HOME.concat(TUT_BASE,TUT_PATHS.chair);S.combatIntro=false;for(const k in S.plants)delete S.plants[k].tut;}
function tutEnd(){S.tutQ=[];S.combatIntro=true;}
function tutAdvance(quiet){
  S.tutQ.shift();if(!quiet){SFX.lvl();banner('🎯 クリア！');gainExp(3);}
  const c=tutCur();
  if(c==='kill'&&!S.combatIntro){S.combatIntro=true;setTimeout(()=>talk([{w:'kuro',t:'つぎは ぼうけんだ。モンスターに ちかづくと ボタンが「こうげき」になる。'},{w:'chappy',t:'むらさきの ボタンは まほうだよ！ ⇄で しゅるいを かえられるの'}]),700);}
  if(c==='flower'){const f=Object.keys(S.inv).find(k=>ITEMS[baseOf(k)]&&ITEMS[baseOf(k)].flower&&S.inv[k]>0);if(f)S.seed=f;else{addItem('tulip_seed',2);S.seed='tulip_seed';}}
  if(!c){S.combatIntro=true;setTimeout(()=>{toast('これで きほんは バッチリ！ あとは じゆうに あそぼう');setTimeout(()=>toast('📮ポストや 🌐から、ともだちの 家や はたけを 見にいけるよ（るすでも OK）'),2600);},900);}

}
function talk(lines,choices){

    setTimeout(()=>{if(G.edit)endEdit();talk([{w:'chappy',t:'わあ、おへやが はなやかに なったね！ にわで そだてた お花だよ！'},{w:'fute',t:'……まあ、わるくない へやだな。'},{w:'kuro',t:'つぎは はたけで かぶを そだてて、かせぐぞ。'}]);toast('🎁 ごほうび：💰100G と かぶのタネ×3');},500);return;}
  if(st==='plant'&&ev==='plant'){
    if(baseOf(d.key)!=='turnip_seed'){toast('まずは かぶの タネで やってみよう（🌱タネボタン'+(PCKEYS?'／Qキー':'')+'で えらべるよ）');return;}
    S.plants[d.i].tut=S.pid;tutAdvance();if(S.plants[d.i].w){S.tutGrowAt=Date.now()+12000;tutAdvance(true);}return;}
  if(st==='water'&&ev==='water'){const i=tutPlantIdx();if(i>=0&&S.plants[i].w){S.tutGrowAt=Date.now()+15000;tutAdvance();}return;}
  if(st==='harvest'&&ev==='harvest'&&d.tut){S.tutQ.shift();SFX.lvl();banner('🎉 はじめての しゅうかく！');gainExp(3);updateGoal(true);saveGame(true);
    setTimeout(()=>talk([{w:'chappy',t:'やったー！ はじめての しゅうかく だね！'},{w:'fute',t:'これが うれたら、ひるね用の イスを かうにゃ。'},{w:'kuro',t:'つぎの タネだいも のこしとけよ。'}],[['chair','🪑 イスを かう（かぶを うって 家具を かう）'],['flower','🌷 花を そだてる'],['forest','⚔️ 森へ いく']]),700);return;}
  if(st==='flower'&&ev==='plant'){const it=ITEMS[baseOf(d.key)];if(it&&(it.flower||it.cat==='flower')){tutAdvance();setTimeout(()=>toast('フテ猫「……花も わるくないにゃ。」'),900);}return;}
  if(st==='sell'&&ev==='sell'){tutAdvance();return;}
  if(st==='buyfurn'&&ev==='buyfurn'){tutAdvance();return;}
  if(st==='place'&&ev==='place'){futeComment();return;}
  if(st==='kill'&&ev==='kill'){tutAdvance();return;}
  if(st==='quest'&&ev==='quest'){tutAdvance();return;}
}
function futeComment(){

  setTimeout(()=>{if(G.edit)endEdit();openPanel('🐱 フテ猫',()=>`<div style="text-align:center"><img src="${SPR.fute.front}" style="height:110px"><div class="msg" style="justify-content:center;font-size:17px;margin-top:8px"><b>「……まあ、わるくない へやだな。」</b></div><div style="font-size:14px;margin:6px 0">🎁 ごほうび：💰100G と 🥬かぶのタネ×3</div><div style="font-size:13px;color:#7a5230">そだてて、うって、家具を ふやそう。</div><button class="big" data-act="close" style="margin-top:10px">つぎへ</button></div>`);},600);
}
function tutTick(){
  const nomag=G.scene==='out'&&!!G.player.farm;document.body.classList.toggle('nomag',nomag);
  const st=tutCur();if(!st)return;
  if((st==='water'||st==='grow'||st==='harvest')&&tutPlantIdx()<0){S.tutQ=TUT_BASE.concat(S.tutQ.filter(x=>!TUT_BASE.includes(x)));if(!S.inv.turnip_seed)addItem('turnip_seed',1);S.seed='turnip_seed';updateGoal(true);}
  if((st==='fwater'||st==='fgrow'||st==='fpick')&&tutPlantIdx()<0){while(S.tutQ[0]!=='doorflower'&&S.tutQ.length&&['fwater','fgrow','fpick'].includes(S.tutQ[0]))S.tutQ.shift();S.tutQ.unshift('doorflower');updateGoal(true);}
  if(st==='doorflower'&&!S.inv.tulip_seed)addItem('tulip_seed',1);
  if(st==='doorflower'&&S.inv.tulip_seed&&baseOf(S.seed||'')!=='tulip_seed'&&G.tutFSeed!==1){S.seed='tulip_seed';G.tutFSeed=1;}
  if(st==='fgrow'&&Date.now()>=(S.tutGrowAt||0)){const i=tutPlantIdx();if(i>=0){const p=S.plants[i];p.st=3;const q=tilePos(i);sparkle(q.x,q.y-12,1.3);burst(q.x,q.y-6,'#ffb0c0',18);toast('🌷 チューリップが さいたよ！');}tutAdvance();}
  if(st==='vase'&&!['red','yellow','white','pink'].some(c=>S.inv['flw_tulip_'+c])&&!Object.keys(S.inv).some(k=>k.startsWith('vase_'))){addItem('flw_tulip_red',1);}
  if(st==='placevase'&&!Object.keys(S.inv).some(k=>k.startsWith('vase_'))&&!S.room.items.some(o=>o.id.startsWith('vase_')))addItem('vase_red',1);
  if(st==='plant'&&!S.inv.turnip_seed){addItem('turnip_seed',1);}
  if(st==='plant'&&S.inv.turnip_seed&&baseOf(S.seed||'')!=='turnip_seed'&&!G.tutSeedSet){S.seed='turnip_seed';G.tutSeedSet=1;}
  if(st==='grow'&&Date.now()>=(S.tutGrowAt||0)){const i=tutPlantIdx();if(i>=0){const p=S.plants[i];p.st=CROPS[p.id].days;const q=tilePos(i);burst(q.x,q.y-6,'#ffe14d',22);sparkle(q.x,q.y-10,1.3);floatText(q.x,q.y-24,'✨','#ffe14d',20);toast('かぶが そだったよ！');}tutAdvance();}
  if((st==='place'||st==='chair'||st==='placevase')&&G.scene==='in'&&!G.visit)$('decoBtn').classList.add('pulse');else $('decoBtn').classList.remove('pulse');
}
function curNav(){
  if(G.navTo){const t=NAVS[G.navTo];if(t){if(G.scene!=='out')return null;return Object.assign(t.p(),{n:t.n.split('（')[0],manual:1});}}
  const st=tutCur();if(st){const n=TUT[st].nav();if(n)return n;}
  return null;
}
function setNav(k){G.navTo=k;closePanel();if(NAVS[k])toast('🧭 '+NAVS[k].n+' へ あんないするよ');}
function navTick(){
  if(!G.navTo||G.scene!=='out')return;const t=NAVS[G.navTo];if(!t){G.navTo=null;return;}
  const q=t.p();if(Math.hypot(q.x-G.player.x,q.y-G.player.y)<TS*1.6){toast('🏁 '+t.n.split('（')[0]+' に ついたよ');G.navTo=null;}
}
function updateGoal(force){
  const el=$('goal');if(!el)return;const st=tutCur();
  if(!st||!G.playing){if(!el.classList.contains('hidden'))el.classList.add('hidden');return;}
  let T=TUT[st];const early=TUT_BASE.includes(st);
  if(G.scene==='in'&&!['chair','vase','placevase','place'].includes(st))T={t:T.t,h:()=>'このあとは そとで！ でぐち（したの あかい ところ）から でよう',nav:T.nav};
  const ctl=early?(PCKEYS?'⌨️ <kbd class="k">↑↓←→</kbd> いどう　<kbd class="k">スペース</kbd> ボタン　<kbd class="k">H</kbd> ヘルプ':'👆 がめんを なぞって いどう／ボタンで こうどう'):'';
  const n=curNav();const nv=n&&G.scene==='out'?`<small class="ctl">🧭 ${n.n} まで ${Math.round(Math.hypot(n.x-G.player.x,n.y-G.player.y)/TS)}マス（やじるしの ほう）</small>`:'';
  const html=`<img src="${SPR.chappy.front}"><div><b>🎯 ${T.t}</b><small>${T.h()}</small>${nv}${ctl?`<small class="ctl">${ctl}</small>`:''}</div>`;
  if(force||html!==G.goalHtml){G.goalHtml=html;el.innerHTML=html;}
  el.classList.remove('hidden');
  const sb=$('stat');el.style.top=(sb.offsetTop+sb.offsetHeight+6)+'px';
}
function goalTap(){const st=tutCur();if(!st)return;SFX.open();const n=TUT[st].nav();
  if(n&&G.scene==='out'){G.navPulse=2;toast('🧭 '+n.n+' へ あんない！ がめんの やじるしを みてね');}else toast(TUT[st].h());}

function drawNav(c){
  const n=curNav();if(!n)return;
  const z=G.zoom*DPR,cx=G.cam.x,cy=G.cam.y;const t=G.t;
  const on=n.x>cx+10&&n.x<cx+G.vw-10&&n.y>cy+40&&n.y<cy+G.vh-10;
